<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA Portal | المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ==================== الهوية البصرية: الكحلي #050b55 والأورنج #f47403 والأبيض ==================== */
        :root {
            --navy: #050b55;
            --navy-light: #0d1880;
            --navy-soft: #eef0ff;
            --orange: #f47403;
            --orange-hover: #d96500;
            --orange-soft: #fff4eb;
            --bg-main: #ffffff;
            --bg-sec: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #050b55;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --header-bg: #050b55;
            --header-text: #ffffff;
            --shadow: 0 4px 16px rgba(5, 11, 85, 0.07);
        }

        [data-theme="dark"] {
            --bg-main: #030626;
            --bg-sec: #050b55;
            --card-bg: #081063;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --border-color: #1e2985;
            --navy-soft: #121c7a;
            --orange-soft: #3b2008;
            --header-bg: #02041a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.25s, color 0.25s; }

        /* ==================== إشعارات فورية منبثقة (Toast Notifications) ==================== */
        #toastContainer { position: fixed; bottom: 20px; left: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 0.5rem; max-width: 390px; }
        .toast-item {
            background: var(--navy); color: #fff; border-right: 5px solid var(--orange); padding: 0.85rem 1.1rem;
            border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); font-size: 0.82rem; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; animation: slideIn 0.25s ease;
        }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ==================== شاشة تسجيل الدخول ==================== */
        #loginOverlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #02052e 0%, #050b55 70%, #1a2278 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 1rem;
        }
        .login-card {
            background: var(--card-bg); color: var(--text-main); border-radius: 16px; max-width: 440px; width: 100%;
            padding: 2.2rem; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border-top: 5px solid var(--orange); text-align: center;
        }
        .login-logo { max-height: 70px; margin-bottom: 0.8rem; object-fit: contain; }
        .login-card h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 0.2rem; }
        .login-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.4rem; }
        .form-group { text-align: start; margin-bottom: 0.9rem; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 0.3rem; }
        .form-input {
            width: 100%; padding: 0.55rem 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--bg-sec); color: var(--text-main); font-size: 0.84rem; outline: none;
        }
        .form-input:focus { border-color: var(--orange); }

        /* ==================== الأزرار والشارات ==================== */
        .btn {
            padding: 0.42rem 0.85rem; border: none; border-radius: 7px; cursor: pointer; font-weight: 700;
            font-size: 0.78rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none;
        }
        .btn-orange { background: var(--orange); color: #fff; }
        .btn-orange:hover { background: var(--orange-hover); transform: translateY(-1px); }
        .btn-navy { background: var(--navy); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
        .btn-navy:hover { background: var(--navy-light); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--orange); color: var(--orange); }
        .btn-header { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-header:hover, .btn-header.active-page { background: var(--orange); border-color: var(--orange); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-xs { padding: 0.2rem 0.5rem; font-size: 0.7rem; border-radius: 5px; }

        /* ==================== الهيدر العلوي ==================== */
        header {
            background: var(--header-bg); color: var(--header-text); padding: 0.75rem 1.5rem;
            border-bottom: 3px solid var(--orange); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
        }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; max-width: 1780px; margin: 0 auto; }
        .brand-box { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }
        .brand-logo { height: 46px; max-width: 160px; object-fit: contain; }
        .brand-title h1 { font-size: 1.22rem; font-weight: 800; display: flex; align-items: center; gap: 0.4rem; }
        .brand-title span.orange-dot { color: var(--orange); }
        .brand-title p { font-size: 0.74rem; color: #cbd5e1; }
        .header-tools { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

        .user-chip {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff;
            padding: 0.2rem 0.65rem 0.2rem 0.35rem; border-radius: 25px; display: inline-flex; align-items: center;
            gap: 0.45rem; cursor: pointer; font-size: 0.78rem; font-weight: 700; transition: 0.2s;
        }
        .user-chip:hover, .user-chip.active-page { border-color: var(--orange); background: var(--orange); }
        .user-avatar-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #fff; }
        .notif-badge { background: var(--orange); color: #fff; padding: 0.05rem 0.42rem; border-radius: 10px; font-size: 0.7rem; font-weight: 800; }
        .bell-shake { animation: shake 0.6s infinite; background: var(--orange) !important; }
        @keyframes shake { 0%,100%{transform:rotate(0);} 25%{transform:rotate(12deg);} 75%{transform:rotate(-12deg);} }

        /* ==================== شريط المسار (Breadcrumbs) ==================== */
        .breadcrumb-bar {
            background: var(--bg-sec); border-bottom: 1px solid var(--border-color); padding: 0.55rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;
        }
        .breadcrumb-links { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 700; flex-wrap: wrap; }
        .crumb-item { cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .crumb-item:hover, .crumb-item.active { color: var(--orange); font-weight: 800; }

        /* ==================== الحاوية الرئيسية والداشبورد الشخصية ==================== */
        .page-container { max-width: 1780px; width: 100%; margin: 0 auto; padding: 1.2rem 1.5rem; flex: 1; }
        .user-dashboard {
            background: var(--bg-sec); border: 1px solid var(--border-color); border-right: 5px solid var(--orange);
            border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.4rem; box-shadow: var(--shadow);
        }
        .dash-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; }
        .dash-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 0.75rem; }
        .kpi-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.8rem 1rem;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .kpi-card:hover { border-color: var(--orange); transform: translateY(-2px); }
        .kpi-num { font-size: 1.45rem; font-weight: 800; color: var(--orange); }
        .kpi-label { font-size: 0.76rem; font-weight: 700; color: var(--text-muted); }

        /* ==================== الصفحات الكاملة المستقلة (Full-Page System Views) ==================== */
        .full-page-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-top: 5px solid var(--orange);
            border-radius: 14px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem;
        }
        .full-page-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
            padding-bottom: 1rem; margin-bottom: 1.2rem; border-bottom: 2px solid var(--border-color);
        }
        .full-page-header h2 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
        .mode-banner {
            padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.85rem; font-weight: 700;
        }
        .mode-add { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
        .mode-edit { background: var(--orange-soft); border: 2px solid var(--orange); color: var(--orange); }

        /* ==================== بطاقات البوابة متعددة المستويات ==================== */
        .portal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.1rem; margin-top: 1rem; }
        .portal-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-top: 4px solid var(--navy);
            border-radius: 12px; padding: 1.3rem; box-shadow: var(--shadow); transition: 0.25s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .portal-card:hover { border-top-color: var(--orange); transform: translateY(-3px); }
        .portal-card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .portal-card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.35rem; }
        .portal-card p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1rem; }
        .portal-card-footer { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px dashed var(--border-color); flex-wrap: wrap; }

        /* ==================== تخطيط صفحة استركشر الكورس والمراحل الديناميكية ==================== */
        .course-layout { display: flex; gap: 1.2rem; align-items: flex-start; }
        .course-sidebar { width: 310px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1rem; }
        .course-main { flex: 1; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
        .box-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; box-shadow: var(--shadow); }
        .box-card h3 { font-size: 0.9rem; font-weight: 800; margin-bottom: 0.65rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--orange); display: flex; justify-content: space-between; align-items: center; }
        .unit-list { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
        .unit-item { padding: 0.48rem 0.65rem; border-radius: 7px; cursor: pointer; font-size: 0.78rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .unit-item:hover { background: var(--navy-soft); }
        .unit-item.active { background: var(--navy); color: #fff; border-right: 4px solid var(--orange); }

        .module-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .module-head { background: var(--navy); color: #fff; padding: 0.9rem 1.2rem; border-bottom: 3px solid var(--orange); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .module-head h2 { font-size: 1rem; font-weight: 800; }
        .sec-container { padding: 1rem 1.2rem; border-bottom: 2px solid var(--border-color); }
        .sec-container:last-child { border-bottom: none; }
        .sec-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.7rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border-color); }
        .sec-code-pill { background: var(--orange); color: #fff; padding: 0.1rem 0.5rem; border-radius: 5px; font-size: 0.8rem; font-weight: 800; }

        .topic-item { border: 1px solid var(--border-color); border-radius: 9px; background: var(--card-bg); margin-bottom: 0.65rem; overflow: hidden; }
        .topic-item.my-turn { border: 2px solid var(--orange); box-shadow: 0 0 0 3px rgba(244, 116, 3, 0.12); }
        .topic-top-bar { padding: 0.65rem 0.95rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; background: var(--bg-sec); }
        .topic-title-box { display: flex; align-items: center; gap: 0.45rem; flex: 1; min-width: 230px; cursor: pointer; flex-wrap: wrap; }
        .t-code { background: var(--navy); color: #fff; padding: 0.12rem 0.45rem; border-radius: 5px; font-size: 0.75rem; font-weight: 800; }
        .t-title { font-weight: 700; font-size: 0.88rem; }

        .pipeline-stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 0.4rem; padding: 0.6rem 0.9rem; border-top: 1px solid var(--border-color); background: var(--card-bg); }
        .step-box { border: 1px solid var(--border-color); border-radius: 7px; padding: 0.45rem 0.55rem; font-size: 0.71rem; display: flex; flex-direction: column; gap: 0.22rem; background: var(--bg-sec); }
        .step-box.active-stage { border: 2px solid var(--orange); background: var(--orange-soft); }
        .step-box.done-stage { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
        .step-box.rejected-stage { border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .step-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 0.74rem; }

        .topic-body-pane { padding: 0.95rem; border-top: 1px solid var(--border-color); background: var(--bg-sec); display: none; }
        .topic-body-pane.open { display: block; }
        .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.75rem; margin-bottom: 0.8rem; }
        .guide-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.7rem; font-size: 0.77rem; }
        .guide-card h5 { color: var(--orange); font-size: 0.78rem; margin-bottom: 0.3rem; }
        .action-panel { background: var(--card-bg); border: 2px solid var(--navy); border-radius: 9px; padding: 0.9rem; margin-top: 0.5rem; }
        .admin-override-bar { background: var(--navy-soft); border: 1px dashed var(--navy); border-radius: 8px; padding: 0.6rem 0.8rem; margin-top: 0.6rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.75rem; }

        .perm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.5rem; margin: 0.6rem 0; }
        .perm-item { background: var(--bg-sec); border: 1px solid var(--border-color); padding: 0.45rem 0.65rem; border-radius: 6px; font-size: 0.76rem; display: flex; align-items: center; gap: 0.45rem; cursor: pointer; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.6rem; }
        .data-table th, .data-table td { border: 1px solid var(--border-color); padding: 0.55rem 0.7rem; text-align: start; }
        .data-table th { background: var(--navy); color: #fff; font-weight: 700; }
        .data-table tr:nth-child(even) { background: var(--bg-sec); }

        @media (max-width: 1050px) { .course-layout { flex-direction: column; } .course-sidebar { width: 100%; } }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<!-- ==================== 1. شاشة تسجيل الدخول ==================== -->
<div id="loginOverlay">
    <div class="login-card">
        <img id="loginLogoImg" class="login-logo" src="" alt="DCA Logo" style="display:none;">
        <h2 id="loginTitleText">DCA <span style="color:var(--orange)">Portal</span></h2>
        <p id="lblLoginSub">المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</p>
        <form onsubmit="handleAuthLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="authUser" class="form-input" placeholder="admin / username" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور (Password):</label>
                <input type="password" id="authPass" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-orange" style="width:100%; justify-content:center; padding:0.7rem; font-size:0.9rem;">🔐 تسجيل الدخول إلى البوابة</button>
            <div id="loginErr" style="color:#ef4444; font-size:0.78rem; font-weight:700; margin-top:0.6rem; display:none;">❌ اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </form>
    </div>
</div>

<!-- ==================== 2. الهيدر العلوي ==================== -->
<header>
    <div class="header-wrap">
        <div class="brand-box" onclick="navigatePortal('HOME')">
            <img id="headerLogoImg" class="brand-logo" src="" alt="DCA Logo" style="display:none;">
            <div class="brand-title">
                <h1><span id="lblBrandMain">DCA</span> <span class="orange-dot" id="lblBrandAccent">Portal</span></h1>
                <p id="lblHeaderSub">المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</p>
            </div>
        </div>
        <div class="header-tools">
            <div class="user-chip" id="navBtnProfile" onclick="openFullPageSystemView('PROFILE')" title="الصفحة الشخصية المستقلة">
                <img id="headerUserAvatar" class="user-avatar-sm" src="" alt="Avatar">
                <span id="activeUserBadge">...</span>
                <span style="font-size:0.7rem; color:#fde047;" id="lblNavProfile">⚙️ صفحتي</span>
            </div>

            <button class="btn btn-header" id="navBtnInbox" onclick="openFullPageSystemView('INBOX')">
                🔔 <span id="lblInboxBtn">الإشعارات</span>
                <span id="unreadNotifCount" class="notif-badge">0</span>
            </button>

            <button class="btn btn-header" id="btnUsersMgr" style="display:none;" onclick="openFullPageSystemView('USERS')">👥 <span id="lblUsersBtn">إدارة الفريق والوظائف</span></button>
            <button class="btn btn-header" id="btnRolesMgr" style="display:none;" onclick="openFullPageSystemView('ROLES')">🛡️ <span id="lblRolesBtn">مستويات الصلاحيات</span></button>
            <button class="btn btn-header" id="btnStagesMgr" style="display:none;" onclick="openFullPageSystemView('STAGES')">🔄 <span id="lblStagesBtn">إدارة المراحل</span></button>
            <button class="btn btn-header" id="btnSuperSettings" style="display:none;" onclick="openFullPageSystemView('SETTINGS')">⚙️ <span id="lblSettingsBtn">إعدادات البوابة والأزرار</span></button>

            <button class="btn btn-header" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            <button class="btn btn-header" onclick="toggleLanguage()" id="langBtn">🌐 EN</button>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 <span id="lblSignOut">تسجيل خروج (Sign Out)</span></button>
        </div>
    </div>
</header>

<!-- ==================== 3. شريط المسار وحالة الاتصال ==================== -->
<div class="breadcrumb-bar">
    <div class="breadcrumb-links" id="breadcrumbContainer"></div>
    <div style="display:flex; align-items:center; gap:0.6rem;">
        <span style="font-size:0.74rem; font-weight:700;" id="cloudSyncIndicator">☁️ متصل بالسحابة لحظياً</span>
        <button class="btn btn-outline btn-xs" onclick="syncFromCloud(true)">🔄 تحديث الآن</button>
    </div>
</div>

<!-- ==================== 4. منطقة العرض الرئيسية (كل شيء يفتح في صفحة كاملة هنا) ==================== -->
<div class="page-container">
    <div class="user-dashboard" id="personalDashboard"></div>
    <div id="mainViewPort"></div>
</div>

<script>
// ============================================================================
// 🔗 إعدادات السحابة وحساب السوبر أدمن الرئيسي
// ============================================================================
const FIREBASE_BASE_URL = "https://dca-courses-management-default-rtdb.firebaseio.com";
const MASTER_SUPER_USER = "admin";
const MASTER_SUPER_PASS = "DCA@2023";

// ============================================================================
// 📚 الاستركشر الافتراضي الأساسي للكورس (الجزء 1: الوحدات 01 إلى 04)
// ============================================================================
const DEFAULT_COURSE_DATA = [
  {
    code: "01", title: "مقدمة في مراقبة الوثائق وإدارة المعلومات",
    overview: "تأسيس الفهم الشامل لبيئة المشروعات الهندسية، ولماذا تعتبر المعلومات والوثائق هي العصب المحرك للمشروع، وصولاً إلى تعريف علمي وعملي لضبط الوثائق وإدارة المعلومات والمعايير الدولية الحاكمة لهما.",
    sections: [
      {
        code: "01.01", title: "فهم طبيعة المشروعات الهندسية",

// دالة تحويل مصفوفة الكورس الافتراضية إلى كائنات غنية بمعرف داخلي ثابت uid
function normalizeStructureArray(rawArr) {
    return (rawArr || []).map((mod, mIdx) => ({
        uid: mod.uid || ("mod_" + (mod.code || (mIdx + 1))),
        code: mod.code || String(mIdx + 1).padStart(2, "0"),
        title: mod.title || "",
        overview: mod.overview || "",
        sections: (mod.sections || []).map((sec, sIdx) => ({
            uid: sec.uid || ("sec_" + (sec.code || `${mIdx+1}_${sIdx+1}`)),
            code: sec.code || `${String(mIdx+1).padStart(2,"0")}.${String(sIdx+1).padStart(2,"0")}`,
            title: sec.title || "",
            why: sec.why || "",
            how: sec.how || "",
            topics: (sec.topics || []).map((t, tIdx) => {
                if (Array.isArray(t)) {
                    const [c, ti, co, te, nw] = t;
                    return {
                        uid: c.replace(/\./g, "_"),
                        code: c,
                        title: ti || "",
                        content: co || "",
                        terms: Array.isArray(te) ? te : [],
                        isNew: !!nw
                    };
                }
                return {
                    uid: t.uid || (t.code ? t.code.replace(/\./g, "_") : `top_${Date.now()}_${tIdx}`),
                    code: t.code || "",
                    title: t.title || "",
                    content: t.content || "",
                    terms: Array.isArray(t.terms) ? t.terms : [],
                    isNew: !!t.isNew
                };
            })
        }))
    }));
}

function autoRenumberStructureList(structList) {
    structList.forEach((mod, mIdx) => {
        const mCode = String(mIdx + 1).padStart(2, "0");
        mod.code = mCode;
        (mod.sections || []).forEach((sec, sIdx) => {
            const sCode = `${mCode}.${String(sIdx + 1).padStart(2, "0")}`;
            sec.code = sCode;
            (sec.topics || []).forEach((top, tIdx) => {
                top.code = `${sCode}.${String(tIdx + 1).padStart(2, "0")}`;
            });
        });
    });
}

function showToast(msg, playSound = true) {
    const box = document.getElementById("toastContainer");
    if (!box) return;
    const el = document.createElement("div");
    el.className = "toast-item";
    el.innerHTML = `<span>🔔 ${msg}</span><span style="cursor:pointer; font-weight:800;" onclick="this.parentElement.remove()">×</span>`;
    box.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 5000);

    if (playSound) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.14);
        } catch (e) {}
    }
}

// ⏱️ محرك المراحل والتواريخ الديناميكية المرتبط بـ uid الثابت للنقطة
// ============================================================================
function addDaysToDateStr(dateStr, daysCount) {
    const d = dateStr ? new Date(dateStr) : new Date();
    if (isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + Number(daysCount || 1));
    return d.toISOString().split("T")[0];
}

function todayDateStr() {
    return new Date().toISOString().split("T")[0];
}

function getPipeItemByUid(topicUid) {
    const k = String(topicUid).replace(/\./g, "_");
    if (!portalState.pipeline[k]) {
        portalState.pipeline[k] = {
            stageIdx: 0,
            subStatus: "not-started",
            rejected: false,
            rejectReason: "",
            stageData: {},
            history: []
        };
    }
    const p = portalState.pipeline[k];
    if (typeof p.stageIdx !== "number") p.stageIdx = 0;
    if (!p.stageData) p.stageData = {};
    if (!Array.isArray(p.history)) p.history = [];

    portalState.workflowStages.forEach((stg, idx) => {
        if (!p.stageData[idx]) {
            p.stageData[idx] = {
                assignee: "",
                slaDays: stg.slaDays || 2,
                startDate: "",
                dueDate: "",
                completedAt: "",
                link: "",
                notes: ""
            };
        }
    });
    return p;
}

function isCompletedTopic(p) {
    return p.stageIdx >= portalState.workflowStages.length;
}

function isUserActiveInTopic(p, username) {
    if (!username || isCompletedTopic(p)) return false;
    const curStg = p.stageData[p.stageIdx];
    return curStg && curStg.assignee === username;
}

function isTopicOverdueNow(p) {
    if (isCompletedTopic(p)) return false;
    const curStg = p.stageData[p.stageIdx];
    if (!curStg || !curStg.dueDate) return false;
    return curStg.dueDate < todayDateStr();
}

function getUserAvatarUrl(uKey) {
    if (uKey === "admin") return "https://ui-avatars.com/api/?name=Admin&background=f47403&color=fff";
    const u = portalState.users[uKey];
    if (u && u.avatar) return u.avatar;
    const name = u ? u.displayName : (uKey || "U");
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=050b55&color=fff`;
}

function getUserNameDisplay(uKey) {
    if (!uKey) return tText("غير معين", "Unassigned");
    if (uKey === "admin") return "Super Admin";
    return portalState.users[uKey] ? portalState.users[uKey].displayName : uKey;
}

function getUserJobsText(uObj) {
    if (!uObj) return "-";
    const jobsArr = Array.isArray(uObj.jobs) ? uObj.jobs : (uObj.jobRole ? [uObj.jobRole] : []);
    if (jobsArr.length === 0) return "بدون تخصص محدد";
    return jobsArr.map(jKey => {
        const found = portalState.jobCatalog.find(x => x.key === jKey);
        return found ? found.title : jKey;
    }).join(" + ");
}

// 📊 الداشبورد الشخصية والتنقل بين الصفحات المستقلة الكاملة
// ============================================================================
function renderPersonalDashboard() {
    const box = document.getElementById("personalDashboard");
    if (!portalState.currentUser) return;

    // إخفاء شريط الداشبورد العلوي عند فتح صفحة إعدادات/إدارة مستقلة لتوفير مساحة كاملة
    if (portalState.navPath.level === "SYS_PAGE" || portalState.navPath.level === "STRUCT_IMPORT") {
        box.style.display = "none";
        return;
    }
    box.style.display = "block";

    const uName = portalState.currentUser.username;
    let myTurnCount = 0, myInProgressCount = 0, myOverdueCount = 0, myDoneStagesCount = 0;
    const urgentList = [];

    const structList = getActiveStructureList("tool_structure");
    structList.forEach(mod => {
        (mod.sections || []).forEach(sec => {
            (sec.topics || []).forEach(t => {
                const p = getPipeItemByUid(t.uid);
                if (isUserActiveInTopic(p, uName)) {
                    myTurnCount++;
                    if (p.subStatus === "in-progress") myInProgressCount++;
                    if (isTopicOverdueNow(p)) myOverdueCount++;
                    const curStg = p.stageData[p.stageIdx] || {};
                    urgentList.push({ uid: t.uid, code: t.code, title: t.title, stgName: portalState.workflowStages[p.stageIdx]?.name || "", rejected: p.rejected, due: curStg.dueDate });
                }
                portalState.workflowStages.forEach((stg, idx) => {
                    if (p.stageData[idx]?.assignee === uName && p.stageIdx > idx) myDoneStagesCount++;
                });
            });
        });
    });

    const roleObj = portalState.rolesConfig[portalState.currentUser.sysRole];

// التنقل بين البوابة والصفحات المستقلة الكاملة (بدون أي Pop-up)
function navigatePortal(level, catId = null, courseId = null, toolId = null) {
    portalState.navPath = { level, catId, courseId, toolId, sysPage: null, prevNav: null };
    renderAllViews();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function openFullPageSystemView(sysPageName) {
    const currentCopy = Object.assign({}, portalState.navPath);
    if (currentCopy.level !== "SYS_PAGE") {
        portalState.navPath.prevNav = currentCopy;
    }
    portalState.navPath.level = "SYS_PAGE";
    portalState.navPath.sysPage = sysPageName;
    renderAllViews();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function goBackFromSystemPage() {
    if (portalState.navPath.prevNav && portalState.navPath.prevNav.level !== "SYS_PAGE") {
        portalState.navPath = portalState.navPath.prevNav;
    } else {
        portalState.navPath = { level: "HOME", catId: null, courseId: null, toolId: null, sysPage: null, prevNav: null };
    }
    renderAllViews();
}

function renderBreadcrumbs() {
    const bar = document.getElementById("breadcrumbContainer");
    const { level, catId, courseId, toolId, sysPage } = portalState.navPath;
    let html = `<span class="crumb-item ${level==='HOME'?'active':''}" onclick="navigatePortal('HOME')">🏠 الرئيسية (DCA Portal)</span>`;

    if (level === "SYS_PAGE") {
        const sysTitles = {
            PROFILE: "👤 صفحتي الشخصية وإعدادات حسابي",
            INBOX: "🔔 مركز الإشعارات والرسائل الداخلية",
            USERS: "👥 إدارة حسابات الفريق والوظائف",
            ROLES: "🛡️ إدارة مستويات الصلاحيات",
            STAGES: "🔄 إدارة مراحل خط الإنتاج",
            SETTINGS: "⚙️ إعدادات البوابة وتخصيص أسماء الأزرار"
        };
        html += ` <span>/</span> <span class="crumb-item active">${sysTitles[sysPage] || sysPage}</span>`;
        bar.innerHTML = html;
        return;
    }

    if (catId) {
        const cat = portalState.portalTree.categories.find(c => c.id === catId);
        if (cat) html += ` <span>/</span> <span class="crumb-item ${level==='CATEGORY'?'active':''}" onclick="navigatePortal('CATEGORY', '${catId}')">${tText(cat.titleAr, cat.titleEn)}</span>`;
    }
    if (courseId && catId) {
        const crs = (portalState.portalTree.courses[catId] || []).find(c => c.id === courseId);
        if (crs) html += ` <span>/</span> <span class="crumb-item ${level==='COURSE'?'active':''}" onclick="navigatePortal('COURSE', '${catId}', '${courseId}')">${tText(crs.titleAr, crs.titleEn)}</span>`;
    }
    if (toolId && courseId) {
        const tl = (portalState.portalTree.courseTools[courseId] || []).find(x => x.id === toolId);
        if (tl) html += ` <span>/</span> <span class="crumb-item ${level==='TOOL'?'active':''}" onclick="navigatePortal('TOOL', '${catId}', '${courseId}', '${toolId}')">${tText(tl.titleAr, tl.titleEn)}</span>`;
    }
    if (level === "STRUCT_IMPORT") {
        html += ` <span>/</span> <span class="crumb-item active">📥 استيراد وبناء الاستركشر الذكي</span>`;
    }
    bar.innerHTML = html;
}
تفضل يا هندسة، ده الجزء الثالث والأخير من الكود المطور (3 من 3).

الجزء ده بيقفل الملف بالكامل لحد النهاية، وفيه:

  - الصفحات المستقلة الكاملة (صفحة البروفايل، صفحة الفريق، صفحة مستويات
    الصلاحيات، صفحة المراحل، صفحة الإشعارات، وصفحة الإعدادات وتعديل أسماء أزرار
    الموقع).
  - شريط التبديل الواضح بين وضع التعديل ووضع الإضافة في الفريق والصلاحيات
    والمراحل.
  - أزرار التحكم الكامل في الاستركشر: إضافة وتعديل وحذف وتحريك لأعلى ولأسفل ونقل
    أي نقطة لقسم آخر وإعادة الترقيم التلقائي الذكي.
  - صفحة استيراد الاستركشر الذكية: من نص وورد أو ملف إكسيل.
  - الـ 5 أنظمة الجاهزة لأي زرار جديد: (استركشر بمراحل، جدول ديناميكي، لوحة
    تاسكات، مكتبة لينكات، أو صفحة محتوى حر).

انسخ الكود اللي تحت ده بالكامل، والصقه في ملف الموقع مباشرة تحت آخر سطر في الجزء
الثاني:

function openCourseStructureWithFilter(fMode) {
    portalState.filterMode = fMode;
    portalState.navPath = { level: "TOOL", catId: "cat_courses", courseId: "crs_dc_im", toolId: "tool_structure", sysPage: null };
    renderAllViews();
}

function jumpToTopic(code, uid = null) {
    portalState.selectedModule = code.split(".")[0];
    portalState.filterMode = "ALL";
    const key = uid || code.replace(/\./g, "_");
    openTopicPanesSet.add(key);
    portalState.navPath = { level: "TOOL", catId: "cat_courses", courseId: "crs_dc_im", toolId: "tool_structure", sysPage: null };
    renderAllViews();
    setTimeout(() => {
        const el = document.getElementById(`topic-card-${key}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 120);
}

function toggleStructTopic(uid) {
    const pane = document.getElementById(`topic-pane-${uid}`);
    if (!pane) return;
    if (openTopicPanesSet.has(uid)) { openTopicPanesSet.delete(uid); pane.classList.remove("open"); }
    else { openTopicPanesSet.add(uid); pane.classList.add("open"); }
}

function getUserOptionsForJob(selectedUser, jobKey) {
    const keys = Object.keys(portalState.users);
    let html = `<option value="">-- غير معين --</option>`;
    keys.forEach(k => {
        const u = portalState.users[k];
        const uJobs = Array.isArray(u.jobs) ? u.jobs : (u.jobRole ? [u.jobRole] : []);
        const mark = uJobs.includes(jobKey) ? "⭐" : "";
        html += `<option value="${k}" ${selectedUser === k ? 'selected' : ''}>${mark} ${u.displayName}</option>`;
    });
    return html;
}

function renderStructurePipelineView(viewport, catId, courseId, toolId = "tool_structure") {
    const structList = getActiveStructureList(toolId);
    const uName = portalState.currentUser.username;
    const canAssign = hasPerm("assign_tasks");
    const canEditDates = hasPerm("edit_dates_sla");
    const canOverride = hasPerm("override_stage");
    const canEditStruct = hasPerm("manage_structure");
    const stages = portalState.workflowStages;

    const prevSearch = document.getElementById("structSearchInput")?.value || "";
    const searchVal = prevSearch.trim().toLowerCase();

    let unitsNavHtml = structList.map(m => {
        let cnt = 0;
        (m.sections || []).forEach(s => cnt += (s.topics || []).length);
        return `
            <li class="unit-item ${portalState.selectedModule === m.code ? 'active' : ''}" onclick="portalState.selectedModule='${m.code}'; renderAllViews();">
                <span><strong>${m.code}</strong> - ${m.title}</span>
                <span class="notif-badge" style="background:var(--navy-light);">${cnt}</span>
            </li>`;
    }).join("");

    let modulesHtml = "";

    structList.forEach((mod, mIdx) => {
        if (portalState.selectedModule !== "ALL" && portalState.selectedModule !== mod.code) return;
        let secsHtml = "";

        (mod.sections || []).forEach((sec, sIdx) => {
            let topicsHtml = "";
            (sec.topics || []).forEach((t, tIdx) => {
                const p = getPipeItemByUid(t.uid);
                const completed = isCompletedTopic(p);
                const myTurn = isUserActiveInTopic(p, uName);
                const overdue = isTopicOverdueNow(p);

                if (portalState.filterMode === "MY_TURN" && !myTurn) return;
                if (portalState.filterMode === "IN_PROGRESS" && !(myTurn && p.subStatus === "in-progress")) return;
                if (portalState.filterMode === "OVERDUE" && !overdue) return;
                if (portalState.filterMode === "COMPLETED" && !completed) return;

                if (searchVal) {
                    const hay = `${t.code} ${t.title} ${t.content} ${(t.terms||[]).join(" ")}`.toLowerCase();
                    if (!hay.includes(searchVal)) return;
                }

                const curStageObj = stages[p.stageIdx];
                const curStageTitle = completed
                    ? "🏆 مكتمل ومعتمد بالكامل"
                    : `${curStageObj?.icon||''} المرحلة (${p.stageIdx + 1}/${stages.length}): ${curStageObj?.name||''}`;

                const isOpen = openTopicPanesSet.has(t.uid);

                const stepperHtml = stages.map((stg, idx) => {
                    const sd = p.stageData[idx] || {};
                    const isCur = (!completed && p.stageIdx === idx);
                    const isDone = (p.stageIdx > idx);
                    let boxCls = "step-box";
                    if (isCur) boxCls += p.rejected ? " rejected-stage" : " active-stage";
                    else if (isDone) boxCls += " done-stage";

                    return `
                    <div class="${boxCls}">

async function addStructModule(toolId) {
    const list = getActiveStructureList(toolId);
    const title = prompt("أدخل عنوان الوحدة الرئيسية الجديدة:");
    if (!title) return;
    const overview = prompt("أدخل وصفاً أو نظرة عامة للوحدة:") || "";
    const nextCode = String(list.length + 1).padStart(2, "0");
    list.push({ uid: "mod_" + Date.now(), code: nextCode, title, overview, sections: [] });
    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✅ تم إضافة الوحدة الجديدة وترقيمها تلقائياً!");
}

async function editStructModule(toolId, mIdx) {
    const mod = getActiveStructureList(toolId)[mIdx];
    if (!mod) return;
    const newCode = prompt("رقم/كود الوحدة:", mod.code);
    if (!newCode) return;
    const newTitle = prompt("عنوان الوحدة:", mod.title);
    if (!newTitle) return;
    mod.code = newCode.trim();
    mod.title = newTitle.trim();
    mod.overview = prompt("الوصف العام للوحدة:", mod.overview) || "";
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✅ تم تعديل بيانات الوحدة!");
}

async function deleteStructModule(toolId, mIdx) {
    if (!confirm("⚠️ هل أنت متأكد من حذف هذه الوحدة بجميع أقسامها ونقاطها؟")) return;
    const list = getActiveStructureList(toolId);
    list.splice(mIdx, 1);
    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("🗑️ تم حذف الوحدة وإعادة الترقيم تلقائياً!");
}

async function moveStructModule(toolId, mIdx, dir) {
    const list = getActiveStructureList(toolId);
    const targetIdx = mIdx + dir;
    if (targetIdx < 0 || targetIdx >= list.length) return;
    const temp = list[mIdx];
    list[mIdx] = list[targetIdx];
    list[targetIdx] = temp;
    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("🔢 تم تحريك الوحدة وإعادة ضبط الترقيم تلقائياً!");
}

async function moveTopicToAnotherSection(toolId, mIdx, sIdx, tIdx) {
    const list = getActiveStructureList(toolId);
    const allSecs = [];
    list.forEach((m, mi) => {
        (m.sections || []).forEach((s, si) => {
            allSecs.push(`${s.code} (${s.title}) -> اكتب: ${mi}.${si}`);
        });
    });
    const destCode = prompt(`اختر القسم الذي تريد نقل النقطة إليه بكتابة كود القسم (مثال: 01.02 أو 02.01):\n\nالأقسام المتاحة:\n${list.map(m => m.sections.map(s => `${s.code}: ${s.title}`).join(" | ")).join("\n")}`);
    if (!destCode) return;

    let destM = -1, destS = -1;
    list.forEach((m, mi) => {
        (m.sections || []).forEach((s, si) => {
            if (s.code === destCode.trim()) { destM = mi; destS = si; }
        });
    });
    if (destM === -1) { alert("❌ لم يتم العثور على قسم بهذا الرقم!"); return; }

    const [movedTopic] = list[mIdx].sections[sIdx].topics.splice(tIdx, 1);
    list[destM].sections[destS].topics.push(movedTopic);
    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();

async function parseWordOutlineIntoStructure(toolId, replaceAll) {
    const raw = document.getElementById("wordRawTextInput").value.trim();
    if (!raw) { alert("⚠️ يرجى لصق النص أولاً!"); return; }
    if (replaceAll && !confirm("⚠️ هل أنت متأكد من استبدال هيكل الاستركشر بالكامل بالنص الجديد؟")) return;

    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const list = replaceAll ? [] : getActiveStructureList(toolId);

    let curMod = list[list.length - 1] || null;
    let curSec = (curMod && curMod.sections[curMod.sections.length - 1]) || null;

    lines.forEach(line => {
        // مطابقة 01.01.01 (نقطة فرعية)
        let mTop = line.match(/^(\d{1,3}\.\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mTop) {
            if (!curMod) { curMod = { uid: "mod_" + Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            if (!curSec) { curSec = { uid: "sec_" + Date.now(), code: "01.01", title: "القسم الأول", why: "", how: "", topics: [] }; curMod.sections.push(curSec); }
            const code = mTop[1].trim();
            curSec.topics.push({ uid: code.replace(/\./g, "_"), code, title: mTop[2].trim(), content: "اكتب الشرح التفصيلي والأمثلة التطبيقية لهذه النقطة.", terms: [], isNew: true });
            return;
        }
        // مطابقة 01.01 (قسم فرعي)
        let mSec = line.match(/^(\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mSec) {
            if (!curMod) { curMod = { uid: "mod_" + Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            curSec = { uid: "sec_" + mSec[1].replace(/\./g, "_"), code: mSec[1].trim(), title: mSec[2].trim(), why: "تغطية المفاهيم والتطبيقات الأساسية لهذا القسم.", how: "شرح متدرج مدعوم بالأمثلة.", topics: [] };
            curMod.sections.push(curSec);
            return;
        }
        // مطابقة 01 (وحدة رئيسية)
        let mMod = line.match(/^(\d{1,3})\s+(.+)$/);
        if (mMod) {
            curMod = { uid: "mod_" + mMod[1], code: mMod[1].padStart(2, "0"), title: mMod[2].trim(), overview: "", sections: [] };
            list.push(curMod);
            curSec = null;
        }
    });

    autoRenumberStructureList(list);
    portalState.portalTree.courseStructures[toolId] = list;
    await savePortalTreeToCloud();
    showToast("✅ تم بناء وتحديث الاستركشر بنفس التصميم والتنسيق بنجاح!");
    const { catId, courseId } = portalState.navPath;
    navigatePortal("TOOL", catId, courseId, toolId);
}

function downloadStructureTemplateCSV(toolId) {
    const list = getActiveStructureList(toolId);
    const rows = [["كود الوحدة", "عنوان الوحدة", "وصف الوحدة", "كود القسم", "عنوان القسم", "هدف القسم", "طريقة عرض القسم", "كود النقطة", "عنوان النقطة", "المحتوى المطلوب كتابته", "المصطلحات (مفصولة بـ |)", "المعرف الثابت UID"]];
    list.forEach(mod => {
        (mod.sections || []).forEach(sec => {
            (sec.topics || []).forEach(top => {
                rows.push([mod.code, mod.title, mod.overview||"", sec.code, sec.title, sec.why||"", sec.how||"", top.code, top.title, top.content||"", (top.terms||[]).join("|"), top.uid]);
            });
        });
    });
    let csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Structure_Template_${toolId}.csv`;
    a.click();
}

function parseCSVRows(text) {
    const rows = [];
    let curRow = [], curVal = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i], nxt = text[i+1];
        if (inQuotes) {
            if (ch === '"' && nxt === '"') { curVal += '"'; i++; }
            else if (ch === '"') inQuotes = false;
            else curVal += ch;
        } else {
            if (ch === '"') inQuotes = true;
            else if (ch === ',') { curRow.push(curVal); curVal = ""; }
            else if (ch === '\n' || (ch === '\r' && nxt === '\n')) {
                curRow.push(curVal); rows.push(curRow); curRow = []; curVal = "";
                if (ch === '\r') i++;
            } else curVal += ch;
        }
    }
    if (curVal || curRow.length > 0) { curRow.push(curVal); rows.push(curRow); }
    return rows;
}

function uploadStructureFromCSV(ev, toolId) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        const rows = parseCSVRows(e.target.result.replace(/^\uFEFF/, ""));
        if (rows.length < 2) { alert("⚠️ الملف فارغ أو غير صالح!"); return; }
        const modMap = new Map();
        const newList = [];

        for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length < 9 || !r[7]) continue;
            const [mCode, mTitle, mOver, sCode, sTitle, sWhy, sHow, tCode, tTitle, tCont, tTerms, tUid] = r;
            if (!modMap.has(mCode)) {
                const mObj = { uid: "mod_" + mCode, code: mCode, title: mTitle, overview: mOver, sections: [], _secMap: new Map() };
                modMap.set(mCode, mObj);
                newList.push(mObj);
            }
            const mObj = modMap.get(mCode);
            if (!mObj._secMap.has(sCode)) {
                const sObj = { uid: "sec_" + sCode.replace(/\./g,"_"), code: sCode, title: sTitle, why: sWhy, how: sHow, topics: [] };
                mObj._secMap.set(sCode, sObj);
                mObj.sections.push(sObj);
            }
            const sObj = mObj._secMap.get(sCode);
            sObj.topics.push({
                uid: (tUid && tUid.trim()) ? tUid.trim() : tCode.replace(/\./g, "_"),
                code: tCode.trim(),
                title: tTitle.trim(),
                content: tCont || "",
                terms: (tTerms || "").split("|").map(x => x.trim()).filter(Boolean),
                isNew: false
            });
        }
        newList.forEach(m => delete m._secMap);
        portalState.portalTree.courseStructures[toolId] = newList;
        await savePortalTreeToCloud();
        showToast("✅ تم استيراد وتحديث الاستركشر من ملف الإكسيل بنجاح!");
        const { catId, courseId } = portalState.navPath;
        navigatePortal("TOOL", catId, courseId, toolId);
    };
    reader.readAsText(file);
}

    renderAllViews();

async function addDynamicTableRow(toolId) {
    const tbl = getToolCustomData(toolId, "TABLE");
    const newRow = [];
    for (let col of tbl.columns) {
        const val = prompt(`أدخل قيمة عمود (${col}):`) || "";
        newRow.push(val);
    }
    tbl.rows.push(newRow);
    await savePortalTreeToCloud();
    renderAllViews();
}

async function editDynamicTableRow(toolId, rIdx) {
    const tbl = getToolCustomData(toolId, "TABLE");
    const row = tbl.rows[rIdx];
    for (let i = 0; i < tbl.columns.length; i++) {
        const val = prompt(`تعديل قيمة (${tbl.columns[i]}):`, row[i] || "");
        if (val !== null) row[i] = val;
    }
    await savePortalTreeToCloud();
    renderAllViews();
}

async function moveDynamicTableRow(toolId, rIdx, dir) {
    const tbl = getToolCustomData(toolId, "TABLE");
    const target = rIdx + dir;
    if (target < 0 || target >= tbl.rows.length) return;
    const tmp = tbl.rows[rIdx]; tbl.rows[rIdx] = tbl.rows[target]; tbl.rows[target] = tmp;
    await savePortalTreeToCloud();
    renderAllViews();
}

async function deleteDynamicTableRow(toolId, rIdx) {
    if (!confirm("حذف هذا الصف؟")) return;
    getToolCustomData(toolId, "TABLE").rows.splice(rIdx, 1);
    await savePortalTreeToCloud();
    renderAllViews();
}

                    ❌ رفض الاستلام وإرجاع لمرحلة (${prevStg.name} - ${getUserNameDisplay(p.stageData[curIdx-1]?.assignee)})

function renderAdminOverrideBar(tUid, tCode, p) {
    const stages = portalState.workflowStages;
    return `
    <div class="admin-override-bar">
        <div><strong>👑 تحكم المدير المباشر في النقطة (${tCode}):</strong></div>

            <select id="ovr-sel-${tUid}" class="form-input" style="width:auto; padding:0.2rem 0.5rem; font-size:0.73rem;">
                ${stages.map((s, idx) => `<option value="${idx}" ${p.stageIdx===idx?'selected':''}>المرحلة ${idx+1}: ${s.name}</option>`).join("")}
                <option value="${stages.length}" ${p.stageIdx>=stages.length?'selected':''}>🏆 مكتمل نهائياً</option>
            </select>
            <button class="btn btn-navy btn-xs" onclick="adminForceJumpStage('${tUid}', '${tCode}')">نقل فوري</button>
            <button class="btn btn-danger btn-xs" onclick="adminResetSingleTopic('${tUid}', '${tCode}')">🔄 تصفير للمرحلة 1</button>

async function saveTopicPipeToCloud(tUid) {
    const k = String(tUid).replace(/\./g, "_");
    const p = getPipeItemByUid(tUid);
    renderAllViews();
    try {
        await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/pipeline/${k}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
        });
    } catch (e) {}
}

function addTopicHistory(p, actionText) {
    const uDisplay = portalState.currentUser ? portalState.currentUser.displayName : "System";
    p.history.unshift({ time: new Date().toLocaleString("ar-EG"), user: uDisplay, action: actionText });
}

async function setTopicSubStatus(tUid, tCode, statusVal) {
    const p = getPipeItemByUid(tUid);
    p.subStatus = statusVal;
    const curSd = p.stageData[p.stageIdx];
    if (curSd && !curSd.startDate) {
        curSd.startDate = todayDateStr();
        if (!curSd.dueDate) curSd.dueDate = addDaysToDateStr(curSd.startDate, curSd.slaDays);
    }
    addTopicHistory(p, `بدأ العمل في مرحلة (${portalState.workflowStages[p.stageIdx]?.name})`);
    showToast("تم تحديث حالة المرحلة إلى: جاري العمل حالياً ⚙️");
    await saveTopicPipeToCloud(tUid);
}

async function handoverToNextStage(tUid, tCode, tTitle) {
    const p = getPipeItemByUid(tUid);
    const stages = portalState.workflowStages;
    const curIdx = p.stageIdx;
    const curStg = stages[curIdx];
    const nextStg = stages[curIdx + 1];

    const linkVal = document.getElementById(`act-link-${tUid}`)?.value.trim() || "";
    const noteVal = document.getElementById(`act-note-${tUid}`)?.value.trim() || "";
    if (!linkVal) { alert("⚠️ يرجى وضع رابط ملف العمل أولاً قبل التسليم!"); return; }

    const nowDate = todayDateStr();
    const curSd = p.stageData[curIdx];
    if (!curSd.startDate) curSd.startDate = nowDate;
    curSd.completedAt = nowDate;
    curSd.link = linkVal;
    curSd.notes = noteVal;
    p.rejected = false; p.rejectReason = ""; p.subStatus = "not-started";

    if (nextStg) {
        const nextSlaInput = document.getElementById(`act-next-sla-${tUid}`)?.value;
        const nextSd = p.stageData[curIdx + 1];
        if (nextSlaInput) nextSd.slaDays = Number(nextSlaInput);
        nextSd.startDate = nowDate;
        nextSd.dueDate = addDaysToDateStr(nowDate, nextSd.slaDays || nextStg.slaDays);
        p.stageIdx = curIdx + 1;
        addTopicHistory(p, `أتم مرحلة (${curStg.name}) وسلّم النقطة إلى (${nextStg.name}) باستحقاق ${nextSd.dueDate}`);
        await saveTopicPipeToCloud(tUid);
        showToast(`✅ تم تسليم النقطة ${tCode} إلى (${nextStg.name})!`);
        await sendWorkflowNotification(nextSd.assignee, tCode, `تم تسليم النقطة (${tCode} - ${tTitle}) إليك في مرحلة (${nextStg.name}). تاريخ الاستحقاق: ${nextSd.dueDate}`, linkVal);
    } else {
        p.stageIdx = stages.length;
        addTopicHistory(p, `🏆 أتم المرحلة الأخيرة (${curStg.name}) واعتمد النقطة نهائياً!`);
        await saveTopicPipeToCloud(tUid);
        showToast(`🏆 تم الاعتماد النهائي للنقطة ${tCode}!`);
        await sendWorkflowNotification("admin", tCode, `🏆 اكتملت النقطة (${tCode} - ${tTitle}) في جميع المراحل بنجاح!`, linkVal);
    }
}

async function rejectBackToPrevStage(tUid, tCode, tTitle) {
    const p = getPipeItemByUid(tUid);
    const stages = portalState.workflowStages;
    const curIdx = p.stageIdx;
    if (curIdx <= 0) return;
    const reason = document.getElementById(`act-note-${tUid}`)?.value.trim() || "";
    if (!reason) { alert("⚠️ يرجى كتابة أسباب الرفض والملاحظات في خانة الملاحظات قبل الإرجاع!"); return; }

    const curStg = stages[curIdx], prevStg = stages[curIdx - 1], prevSd = p.stageData[curIdx - 1];
    const nowDate = todayDateStr();
    p.stageIdx = curIdx - 1; p.rejected = true; p.rejectReason = reason; p.subStatus = "in-progress";
    prevSd.startDate = nowDate;
    prevSd.dueDate = addDaysToDateStr(nowDate, prevSd.slaDays || prevStg.slaDays);

    addTopicHistory(p, `❌ رفض الاستلام في (${curStg.name}) وأرجعها إلى (${prevStg.name}). السبب: ${reason}`);
    await saveTopicPipeToCloud(tUid);
    showToast(`⚠️ تم إرجاع النقطة ${tCode} إلى (${prevStg.name}) للتعديل.`);
    await sendWorkflowNotification(prevSd.assignee, tCode, `⚠️ تم رفض وإرجاع النقطة (${tCode} - ${tTitle}) من (${curStg.name}). السبب: ${reason}`, prevSd.link);
}

async function adminForceJumpStage(tUid, tCode) {
    if (!hasPerm("override_stage")) return;
    const selVal = Number(document.getElementById(`ovr-sel-${tUid}`).value);
    const p = getPipeItemByUid(tUid);
    p.stageIdx = selVal; p.rejected = false;
    const stgName = selVal >= portalState.workflowStages.length ? "مكتمل نهائياً" : portalState.workflowStages[selVal].name;
    addTopicHistory(p, `👑 نقل المدير النقطة مباشرة إلى: (${stgName})`);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم نقل النقطة ${tCode} إلى (${stgName})!`);
}

async function adminResetSingleTopic(tUid, tCode) {
    if (!hasPerm("override_stage") || !confirm(`تصفير النقطة ${tCode} وإعادتها للمرحلة 1؟`)) return;
    const p = getPipeItemByUid(tUid);
    p.stageIdx = 0; p.subStatus = "not-started"; p.rejected = false; p.rejectReason = "";
    addTopicHistory(p, `🔄 قام المدير بتصفير النقطة للمرحلة الأولى.`);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم تصفير النقطة ${tCode}!`);
}

async function assignTopicStageUser(tUid, tCode, stageIdx, username) {
    if (!hasPerm("assign_tasks")) return;
    const p = getPipeItemByUid(tUid);
    const sd = p.stageData[stageIdx];
    sd.assignee = username;
    if (stageIdx === 0 && !sd.startDate) {
        sd.startDate = todayDateStr();
        sd.dueDate = addDaysToDateStr(sd.startDate, sd.slaDays);
    }
    addTopicHistory(p, `تم تعيين (${getUserNameDisplay(username)}) للمرحلة ${stageIdx + 1}`);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم تعيين ${getUserNameDisplay(username)} على ${tCode}`);
    if (username) await sendWorkflowNotification(username, tCode, `تم تعيينك على النقطة (${tCode}) في مرحلة (${portalState.workflowStages[stageIdx]?.name}).`, "");
}

async function updateTopicStageSla(tUid, stageIdx, daysVal) {
    const p = getPipeItemByUid(tUid);
    const sd = p.stageData[stageIdx];
    sd.slaDays = Number(daysVal || 1);
    if (sd.startDate) sd.dueDate = addDaysToDateStr(sd.startDate, sd.slaDays);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم تحديث مدة المرحلة إلى ${sd.slaDays} يوم`);
}

async function updateTopicStageDue(tUid, stageIdx, dateVal) {
    const p = getPipeItemByUid(tUid);
    p.stageData[stageIdx].dueDate = dateVal;
    await saveTopicPipeToCloud(tUid);
    showToast(`تم تحديث تاريخ الاستحقاق إلى ${dateVal}`);
}

async function bulkAssignSectionStage(toolId, mIdx, sIdx, stageIdx, username) {
    if (!hasPerm("assign_tasks") || !username) return;
    const sec = getActiveStructureList(toolId)[mIdx]?.sections[sIdx];
    if (!sec) return;
    const patchObj = {};
    (sec.topics || []).forEach(t => {
        const p = getPipeItemByUid(t.uid);
        p.stageData[stageIdx].assignee = username;
        if (stageIdx === 0 && !p.stageData[0].startDate) {
            p.stageData[0].startDate = todayDateStr();
            p.stageData[0].dueDate = addDaysToDateStr(p.stageData[0].startDate, p.stageData[0].slaDays);
        }
        patchObj[String(t.uid).replace(/\./g, "_")] = p;
    });
    renderAllViews();
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/pipeline.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patchObj)
    });
    showToast(`✅ تم تعيين القسم (${sec.code}) بالكامل للعضو ${getUserNameDisplay(username)}`);
}

function uploadMyAvatar(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const uName = portalState.currentUser.username;
        if (portalState.users[uName]) portalState.users[uName].avatar = e.target.result;
        portalState.currentUser.avatar = e.target.result;
        const img = document.getElementById("profPageAvatar");
        if (img) img.src = e.target.result;
        document.getElementById("headerUserAvatar").src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function saveMyProfileInfo() {
    const uName = portalState.currentUser.username;
    const newName = document.getElementById("profNameInput").value.trim();
    const newEmail = document.getElementById("profEmailInput").value.trim();
    const newPhone = document.getElementById("profPhoneInput").value.trim();
    const newBio = document.getElementById("profBioInput").value.trim();
    if (portalState.users[uName]) {
        portalState.users[uName].displayName = newName || portalState.users[uName].displayName;
        portalState.users[uName].email = newEmail;
        portalState.users[uName].phone = newPhone;
        portalState.users[uName].bio = newBio;
        await saveUsersListToCloud();
    }
    portalState.currentUser.displayName = newName || portalState.currentUser.displayName;
    portalState.currentUser.email = newEmail;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(portalState.currentUser));
    renderAllViews();
    showToast("✅ تم حفظ بياناتك وصورتك الشخصية بنجاح!");
}

async function changeMyPassword() {
    const oldP = document.getElementById("oldPassInput").value.trim();
    const newP = document.getElementById("newPassInput").value.trim();
    if (!oldP || !newP) { alert("⚠️ يرجى كتابة كلمة المرور الحالية والجديدة!"); return; }
    const uName = portalState.currentUser.username;
    if (uName === "admin") { alert("حساب السوبر أدمن الرئيسي محمي بكود النظام."); return; }
    const uObj = portalState.users[uName];
    if (!uObj || uObj.pass !== oldP) { alert("❌ كلمة المرور الحالية غير صحيحة!"); return; }
    uObj.pass = newP;
    await saveUsersListToCloud();
    document.getElementById("oldPassInput").value = "";
    document.getElementById("newPassInput").value = "";
    showToast("✅ تم تغيير كلمة المرور الخاصة بك بنجاح!");
}

async function addNewJobTitle() {
    const title = prompt("أدخل اسم الوظيفة الجديدة (مثال: 🎯 مدقق علمي / أو 🎙️ مسجل صوتي):");
    if (!title) return;
    portalState.jobCatalog.push({ key: "job_" + Date.now(), title: title.trim() });
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/jobCatalog.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.jobCatalog)
    });
    renderAllViews();
    showToast("✅ تم إضافة الوظيفة الجديدة!");
}

async function createOrUpdateUser() {
    const name = document.getElementById("uNewName").value.trim();
    const user = document.getElementById("uNewUser").value.trim().toLowerCase().replace(/\s+/g, "");
    const pass = document.getElementById("uNewPass").value.trim();
    const email = document.getElementById("uNewEmail").value.trim();
    const sysRole = document.getElementById("uNewSysRole").value;
    const selectedJobs = [...document.querySelectorAll(".u-job-chk:checked")].map(c => c.value);

    if (!name || !user || !pass) { alert("⚠️ يرجى ملء الاسم واسم المستخدم وكلمة المرور!"); return; }
    const existing = portalState.users[user] || {};
    portalState.users[user] = {
        username: user, pass, displayName: name, email,
        phone: existing.phone || "", bio: existing.bio || "", avatar: existing.avatar || "",
        sysRole, jobs: selectedJobs
    };
    editState.editingUserKey = null;
    await saveUsersListToCloud();
    renderAllViews();
    showToast(`✅ تم حفظ حساب وصلاحيات (${name}) والعودة لوضع الإضافة!`);
}

async function resetUserPassword(uName) {
    const newP = prompt(`🔑 كلمة المرور الجديدة للعضو (${portalState.users[uName].displayName}):`, "123456");
    if (!newP) return;
    portalState.users[uName].pass = newP.trim();
    await saveUsersListToCloud();
    renderAllViews();
    showToast("✅ تم عمل Reset لكلمة المرور!");
}

async function removeUserAccount(uName) {
    if (!confirm("حذف هذا الحساب نهائياً؟")) return;
    delete portalState.users[uName];
    if (editState.editingUserKey === uName) editState.editingUserKey = null;
    await saveUsersListToCloud();
    renderAllViews();
}

async function saveUsersListToCloud() {
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/users.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.users)
    });
}

                            <td>${s.canReject ? 'نعم ✅' : 'لا'}</td>
                            <td>
                                <button class="btn btn-outline btn-xs" onclick="moveWorkflowStage(${idx}, -1)">⬆️</button>
                                <button class="btn btn-outline btn-xs" onclick="moveWorkflowStage(${idx}, 1)">⬇️</button>
                                <button class="btn btn-orange btn-xs" onclick="editState.editingStageIdx=${idx}; renderAllViews();">✏️ تعديل</button>
                                ${portalState.workflowStages.length > 1 ? `<button class="btn btn-danger btn-xs" onclick="deleteWorkflowStage(${idx})">🗑️</button>` : ''}
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>

async function saveWorkflowStage() {
    const idx = editState.editingStageIdx;
    const name = document.getElementById("stgNameAr").value.trim();
    const icon = document.getElementById("stgIcon").value.trim() || "⚡";
    const jobKey = document.getElementById("stgJobKey").value;
    const slaDays = Number(document.getElementById("stgSlaDays").value || 2);
    const canReject = document.getElementById("stgCanReject").checked;
    if (!name) { alert("⚠️ يرجى كتابة اسم المرحلة!"); return; }

    const stgObj = { id: "st_" + Date.now(), name, icon, jobKey, slaDays, canReject };
    if (idx >= 0 && idx < portalState.workflowStages.length) portalState.workflowStages[idx] = stgObj;
    else portalState.workflowStages.push(stgObj);
    editState.editingStageIdx = -1;

    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/workflowStages.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.workflowStages)
    });
    renderAllViews();
    showToast(`✅ تم حفظ المرحلة (${name}) بنجاح!`);
}

async function moveWorkflowStage(idx, dir) {
    const arr = portalState.workflowStages;
    const target = idx + dir;
    if (target < 0 || target >= arr.length) return;
    const tmp = arr[idx]; arr[idx] = arr[target]; arr[target] = tmp;
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/workflowStages.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(arr)
    });
    renderAllViews();
}

async function deleteWorkflowStage(idx) {
    if (!confirm("حذف هذه المرحلة من خط الإنتاج؟")) return;
    portalState.workflowStages.splice(idx, 1);
    editState.editingStageIdx = -1;
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/workflowStages.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.workflowStages)
    });
    renderAllViews();
}
