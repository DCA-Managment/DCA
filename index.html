<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA Portal | المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ==================== الهوية البصرية الديناميكية القابلة للتخصيص ==================== */
        :root {
            --navy: #050b55;
            --navy-light: #0d1880;
            --navy-soft: #eef0ff;
            --orange: #f47403;
            --orange-hover: #d96500;
            --orange-soft: #fff4eb;
            --bg-main: #ffffff;
            --bg-sec: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #050b55;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --header-bg: #050b55;
            --header-text: #ffffff;
            --card-radius: 12px;
            --base-font-size: 15px;
            --shadow: 0 4px 16px rgba(5, 11, 85, 0.07);
        }

        [data-theme="dark"] {
            --bg-main: #030626;
            --bg-sec: #050b55;
            --card-bg: #081063;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --border-color: #1e2985;
            --navy-soft: #121c7a;
            --orange-soft: #3b2008;
            --header-bg: #02041a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        html { font-size: var(--base-font-size); }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.25s, color 0.25s; }

        /* ==================== إشعارات فورية منبثقة (Toast) ==================== */
        #toastContainer { position: fixed; bottom: 20px; left: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 0.5rem; max-width: 390px; }
        .toast-item {
            background: var(--navy); color: #fff; border-right: 5px solid var(--orange); padding: 0.85rem 1.1rem;
            border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); font-size: 0.82rem; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; animation: slideIn 0.25s ease;
        }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ==================== نافذة استوديو التعديل الموضعي الاحترافية (بديل الـ Prompt الأسود) ==================== */
        #studioModalBackdrop {
            position: fixed; inset: 0; background: rgba(2, 5, 46, 0.72); backdrop-filter: blur(3px);
            display: none; justify-content: center; align-items: center; z-index: 9000; padding: 1rem;
        }
        .studio-modal-card {
            background: var(--card-bg); color: var(--text-main); border-radius: 16px; max-width: 720px; width: 100%;
            max-height: 92vh; overflow-y: auto; padding: 1.5rem; border-top: 5px solid var(--orange);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .studio-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; margin-bottom: 1rem; border-bottom: 2px solid var(--border-color); }
        .studio-header h3 { font-size: 1.1rem; font-weight: 800; color: var(--orange); display: flex; align-items: center; gap: 0.4rem; }

        /* ==================== معاينة الصور والغلاف بالزووم والتحريك ==================== */
        .img-crop-preview-banner {
            width: 100%; height: 140px; border-radius: 10px; border: 2px dashed var(--border-color);
            overflow: hidden; position: relative; background: linear-gradient(135deg, var(--navy), var(--orange)); margin-bottom: 0.6rem;
        }
        .img-crop-preview-circle {
            width: 105px; height: 105px; border-radius: 50%; border: 3px solid var(--orange);
            overflow: hidden; position: relative; background: var(--bg-sec); margin: 0 auto 0.6rem auto;
        }
        .sliders-box { background: var(--bg-sec); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.75rem; margin-bottom: 0.8rem; }
        .slider-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
        .slider-row span { width: 110px; font-weight: 700; }
        .slider-row input[type="range"] { flex: 1; accent-color: var(--orange); cursor: pointer; }

        /* ==================== شاشة تسجيل الدخول ==================== */
        #loginOverlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #02052e 0%, #050b55 70%, #1a2278 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9500; padding: 1rem;
        }
        .login-card {
            background: var(--card-bg); color: var(--text-main); border-radius: 16px; max-width: 440px; width: 100%;
            padding: 2.2rem; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border-top: 5px solid var(--orange); text-align: center;
        }
        .login-logo { max-height: 70px; margin-bottom: 0.8rem; object-fit: contain; }
        .login-card h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 0.2rem; }
        .login-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.4rem; }
        .form-group { text-align: start; margin-bottom: 0.85rem; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 0.3rem; }
        .form-input {
            width: 100%; padding: 0.55rem 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--bg-sec); color: var(--text-main); font-size: 0.84rem; outline: none;
        }
        .form-input:focus { border-color: var(--orange); }

        /* ==================== الأزرار والشارات ==================== */
        .btn {
            padding: 0.42rem 0.85rem; border: none; border-radius: 7px; cursor: pointer; font-weight: 700;
            font-size: 0.78rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none;
        }
        .btn-orange { background: var(--orange); color: #fff; }
        .btn-orange:hover { background: var(--orange-hover); transform: translateY(-1px); }
        .btn-navy { background: var(--navy); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
        .btn-navy:hover { background: var(--navy-light); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--orange); color: var(--orange); }
        .btn-header { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-header:hover, .btn-header.active-page { background: var(--orange); border-color: var(--orange); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-xs { padding: 0.2rem 0.48rem; font-size: 0.7rem; border-radius: 5px; }

        /* ==================== الهيدر العلوي ==================== */
        header {
            background: var(--header-bg); color: var(--header-text); padding: 0.7rem 1.4rem;
            border-bottom: 3px solid var(--orange); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
        }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.7rem; max-width: 1800px; margin: 0 auto; }
        .brand-box { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }
        .brand-logo { height: 45px; max-width: 160px; object-fit: contain; }
        .brand-title h1 { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 0.35rem; }
        .brand-title span.orange-dot { color: var(--orange); }
        .brand-title p { font-size: 0.72rem; color: #cbd5e1; }
        .header-tools { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }

        .user-chip {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff;
            padding: 0.18rem 0.6rem 0.18rem 0.35rem; border-radius: 25px; display: inline-flex; align-items: center;
            gap: 0.4rem; cursor: pointer; font-size: 0.76rem; font-weight: 700; transition: 0.2s;
        }
        .user-chip:hover, .user-chip.active-page { border-color: var(--orange); background: var(--orange); }
        .user-avatar-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #fff; }
        .notif-badge { background: var(--orange); color: #fff; padding: 0.05rem 0.42rem; border-radius: 10px; font-size: 0.7rem; font-weight: 800; }
        .bell-shake { animation: shake 0.6s infinite; background: var(--orange) !important; }
        @keyframes shake { 0%,100%{transform:rotate(0);} 25%{transform:rotate(12deg);} 75%{transform:rotate(-12deg);} }

        /* ==================== شريط المسار (Breadcrumbs) ==================== */
        .breadcrumb-bar {
            background: var(--bg-sec); border-bottom: 1px solid var(--border-color); padding: 0.5rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;
        }
        .breadcrumb-links { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 700; flex-wrap: wrap; }
        .crumb-item { cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .crumb-item:hover, .crumb-item.active { color: var(--orange); font-weight: 800; }

        /* ==================== الحاوية الرئيسية والداشبورد الشخصية ==================== */
        .page-container { max-width: 1800px; width: 100%; margin: 0 auto; padding: 1.2rem 1.5rem; flex: 1; }
        .user-dashboard {
            background: var(--bg-sec); border: 1px solid var(--border-color); border-right: 5px solid var(--orange);
            border-radius: var(--card-radius); padding: 1rem 1.2rem; margin-bottom: 1.3rem; box-shadow: var(--shadow);
        }
        .dash-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; }
        .dash-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 0.75rem; }
        .kpi-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.8rem 1rem;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .kpi-card:hover { border-color: var(--orange); transform: translateY(-2px); }
        .kpi-num { font-size: 1.45rem; font-weight: 800; color: var(--orange); }
        .kpi-label { font-size: 0.76rem; font-weight: 700; color: var(--text-muted); }

        /* ==================== الصفحات الكاملة المستقلة (Full-Page System Views) ==================== */
        .full-page-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-top: 5px solid var(--orange);
            border-radius: var(--card-radius); padding: 1.4rem; box-shadow: var(--shadow); margin-bottom: 1.5rem;
        }
        .full-page-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
            padding-bottom: 0.9rem; margin-bottom: 1.2rem; border-bottom: 2px solid var(--border-color);
        }
        .full-page-header h2 { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
        .mode-banner {
            padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.84rem; font-weight: 700;
        }
        .mode-add { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
        .mode-edit { background: var(--orange-soft); border: 2px solid var(--orange); color: var(--orange); }

        /* ==================== بطاقات البوابة والكافر والألوان والأيقونات المرفوعة ==================== */
        .portal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.1rem; margin-top: 1rem; }
        .portal-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-top: 4px solid var(--navy);
            border-radius: var(--card-radius); overflow: hidden; box-shadow: var(--shadow); transition: 0.25s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .portal-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .portal-card.horizontal-card { grid-column: 1 / -1; flex-direction: row; align-items: center; }
        .card-cover-box { width: 100%; height: 125px; overflow: hidden; position: relative; background: linear-gradient(135deg, var(--navy), var(--orange)); }
        .card-cover-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-body-pad { padding: 1.15rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .portal-card-icon { font-size: 2rem; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.5rem; }
        .custom-icon-img { width: 42px; height: 42px; object-fit: contain; border-radius: 8px; }
        .portal-card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.35rem; }
        .portal-card p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0.9rem; }
        .portal-card-footer { display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; padding-top: 0.75rem; border-top: 1px dashed var(--border-color); flex-wrap: wrap; }

        /* ==================== غلاف البروفايل الشخصي (LinkedIn Style) ==================== */
        .profile-Banner-wrap {
            position: relative; width: 100%; height: 185px; border-radius: 12px; overflow: hidden;
            background: linear-gradient(135deg, var(--navy) 0%, #1e2985 60%, var(--orange) 100%); margin-bottom: 3.5rem; border: 1px solid var(--border-color);
        }
        .profile-avatar-overlap {
            position: absolute; bottom: -42px; right: 28px; width: 105px; height: 105px; border-radius: 50%;
            border: 4px solid var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; background: #fff; z-index: 5;
        }

        /* ==================== الاستركشر والسحب والإفلات بالماوس (Drag & Drop) ==================== */
        .course-layout { display: flex; gap: 1.2rem; align-items: flex-start; }
        .course-sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1rem; }
        .course-main { flex: 1; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
        .box-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 1rem; box-shadow: var(--shadow); }
        .box-card h3 { font-size: 0.9rem; font-weight: 800; margin-bottom: 0.65rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--orange); display: flex; justify-content: space-between; align-items: center; }
        .unit-list { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
        .unit-item { padding: 0.48rem 0.65rem; border-radius: 7px; cursor: pointer; font-size: 0.78rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .unit-item:hover { background: var(--navy-soft); }
        .unit-item.active { background: var(--navy); color: #fff; border-right: 4px solid var(--orange); }

        .module-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--card-radius); overflow: hidden; box-shadow: var(--shadow); }
        .module-head { background: var(--navy); color: #fff; padding: 0.85rem 1.2rem; border-bottom: 3px solid var(--orange); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .module-head h2 { font-size: 1rem; font-weight: 800; }
        .sec-container { padding: 1rem 1.2rem; border-bottom: 2px solid var(--border-color); transition: 0.2s; }
        .sec-container.drag-over-sec { background: var(--orange-soft); border: 2px dashed var(--orange); }
        .sec-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.7rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border-color); }
        .sec-code-pill { background: var(--orange); color: #fff; padding: 0.1rem 0.5rem; border-radius: 5px; font-size: 0.8rem; font-weight: 800; }

        .topic-item { border: 1px solid var(--border-color); border-radius: 9px; background: var(--card-bg); margin-bottom: 0.65rem; overflow: hidden; transition: 0.15s; }
        .topic-item.my-turn { border: 2px solid var(--orange); box-shadow: 0 0 0 3px rgba(244, 116, 3, 0.12); }
        .topic-item.dragging { opacity: 0.45; border: 2px dashed var(--orange); }
        .topic-item.drag-over-top { border-top: 4px solid var(--orange); }
        .drag-handle { cursor: grab; font-size: 1.1rem; color: var(--orange); padding: 0 0.3rem; user-select: none; }
        .drag-handle:active { cursor: grabbing; }

        .topic-top-bar { padding: 0.6rem 0.9rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; background: var(--bg-sec); }
        .topic-title-box { display: flex; align-items: center; gap: 0.45rem; flex: 1; min-width: 230px; cursor: pointer; flex-wrap: wrap; }
        .t-code { background: var(--navy); color: #fff; padding: 0.12rem 0.45rem; border-radius: 5px; font-size: 0.75rem; font-weight: 800; }
        .t-title { font-weight: 700; font-size: 0.88rem; }

        .pipeline-stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 0.4rem; padding: 0.6rem 0.9rem; border-top: 1px solid var(--border-color); background: var(--card-bg); }
        .step-box { border: 1px solid var(--border-color); border-radius: 7px; padding: 0.45rem 0.55rem; font-size: 0.71rem; display: flex; flex-direction: column; gap: 0.22rem; background: var(--bg-sec); }
        .step-box.active-stage { border: 2px solid var(--orange); background: var(--orange-soft); }
        .step-box.done-stage { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
        .step-box.rejected-stage { border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .step-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 0.74rem; }

        .topic-body-pane { padding: 0.95rem; border-top: 1px solid var(--border-color); background: var(--bg-sec); display: none; }
        .topic-body-pane.open { display: block; }
        .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.75rem; margin-bottom: 0.8rem; }
        .guide-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.7rem; font-size: 0.77rem; }
        .guide-card h5 { color: var(--orange); font-size: 0.78rem; margin-bottom: 0.3rem; }
        .action-panel { background: var(--card-bg); border: 2px solid var(--navy); border-radius: 9px; padding: 0.9rem; margin-top: 0.5rem; }
        .admin-override-bar { background: var(--navy-soft); border: 1px dashed var(--navy); border-radius: 8px; padding: 0.6rem 0.8rem; margin-top: 0.6rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.75rem; }

        .perm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.5rem; margin: 0.6rem 0; }
        .perm-item { background: var(--bg-sec); border: 1px solid var(--border-color); padding: 0.45rem 0.65rem; border-radius: 6px; font-size: 0.76rem; display: flex; align-items: center; gap: 0.45rem; cursor: pointer; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.6rem; }
        .data-table th, .data-table td { border: 1px solid var(--border-color); padding: 0.55rem 0.7rem; text-align: start; }
        .data-table th { background: var(--navy); color: #fff; font-weight: 700; }
        .data-table tr:nth-child(even) { background: var(--bg-sec); }

        @media (max-width: 1050px) { .course-layout { flex-direction: column; } .course-sidebar { width: 100%; } }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<!-- ==================== نافذة استوديو التعديل الموضعي المرئي (Visual Studio Modal) ==================== -->
<div id="studioModalBackdrop">
    <div class="studio-modal-card" id="studioModalContent"></div>
</div>

<!-- ==================== 1. شاشة تسجيل الدخول ==================== -->
<div id="loginOverlay">
    <div class="login-card">
        <img id="loginLogoImg" class="login-logo" src="" alt="DCA Logo" style="display:none;">
        <h2><span id="loginBrandMain">DCA</span> <span style="color:var(--orange)" id="loginBrandAccent">Portal</span></h2>
        <p id="lblLoginSub">المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</p>
        <form onsubmit="handleAuthLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="authUser" class="form-input" placeholder="admin / username" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور (Password):</label>
                <input type="password" id="authPass" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-orange" style="width:100%; justify-content:center; padding:0.7rem; font-size:0.9rem;">🔐 تسجيل الدخول إلى البوابة</button>
            <div id="loginErr" style="color:#ef4444; font-size:0.78rem; font-weight:700; margin-top:0.6rem; display:none;">❌ اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </form>
    </div>
</div>

<!-- ==================== 2. الهيدر العلوي ==================== -->
<header>
    <div class="header-wrap">
        <div class="brand-box" onclick="navigatePortal('HOME')">
            <img id="headerLogoImg" class="brand-logo" src="" alt="DCA Logo" style="display:none;">
            <div class="brand-title">
                <h1><span id="lblBrandMain">DCA</span> <span class="orange-dot" id="lblBrandAccent">Portal</span></h1>
                <p id="lblHeaderSub">المنصة الرقمية المتكاملة لإدارة منظومة وأعمال DCA</p>
            </div>
        </div>
        <div class="header-tools">

function normalizeStructureArray(rawArr) {
    return (rawArr || []).map((mod, mIdx) => ({
        uid: mod.uid || ("mod_" + (mod.code || (mIdx + 1))),
        code: mod.code || String(mIdx + 1).padStart(2, "0"),
        title: mod.title || "",
        overview: mod.overview || "",
        sections: (mod.sections || []).map((sec, sIdx) => ({
            uid: sec.uid || ("sec_" + (sec.code || `${mIdx+1}_${sIdx+1}`)),
            code: sec.code || `${String(mIdx+1).padStart(2,"0")}.${String(sIdx+1).padStart(2,"0")}`,
            title: sec.title || "",
            why: sec.why || "",
            how: sec.how || "",
            topics: (sec.topics || []).map((t, tIdx) => {
                if (Array.isArray(t)) {
                    const [c, ti, co, te, nw] = t;
                    return { uid: c.replace(/\./g, "_"), code: c, title: ti || "", content: co || "", terms: Array.isArray(te) ? te : [], isNew: !!nw };
                }
                return {
                    uid: t.uid || (t.code ? t.code.replace(/\./g, "_") : `top_${Date.now()}_${tIdx}`),
                    code: t.code || "", title: t.title || "", content: t.content || "",
                    terms: Array.isArray(t.terms) ? t.terms : [], isNew: !!t.isNew
                };
            })
        }))
    }));
}

}

function playNotificationTone(forceToneId = null) {
    if (portalState.isMuted && !forceToneId) return;
    const chosen = forceToneId || (portalState.userSoundChoice !== "DEFAULT" ? portalState.userSoundChoice : portalState.settings.defaultSoundTone) || "crystal";

    if (chosen === "custom" && portalState.settings.customSoundDataUrl) {
        try { const a = new Audio(portalState.settings.customSoundDataUrl); a.play(); return; } catch (e) {}
    }

    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const playNote = (freq, start, dur, type = "sine", vol = 0.1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + start);
            gain.gain.setValueAtTime(vol, now + start);
            gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + start);
            osc.stop(now + start + dur);
        };

        if (chosen === "crystal")  { playNote(587.33, 0, 0.18, "sine", 0.12); playNote(880, 0.12, 0.28, "sine", 0.12); }
        else if (chosen === "official") { playNote(523.25, 0, 0.15, "triangle", 0.14); playNote(659.25, 0.14, 0.3, "triangle", 0.14); }
        else if (chosen === "double")   { playNote(784, 0, 0.1, "sine", 0.12); playNote(784, 0.14, 0.15, "sine", 0.12); }
        else if (chosen === "harmony")  { playNote(440, 0, 0.25, "sine", 0.1); playNote(554.37, 0.08, 0.25, "sine", 0.1); playNote(659.25, 0.16, 0.35, "sine", 0.1); }
        else if (chosen === "digital")  { playNote(1046.5, 0, 0.08, "square", 0.06); playNote(1318.5, 0.09, 0.14, "square", 0.06); }
        else { playNote(392, 0, 0.35, "sine", 0.12); }
    } catch (e) {}
}

// ============================================================================
// 🖼️ محرك قص وضبط وضعية الصور بالزووم والتحريك (Live Crop & Zoom Canvas Studio)
// ============================================================================
function bakeCroppedImageToDataUrl(imgSrc, zoomPct = 100, posX = 50, posY = 50, outW = 400, outH = 400) {
    return new Promise((resolve) => {
        if (!imgSrc) return resolve("");
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() {
            const canvas = document.createElement("canvas");
            canvas.width = outW;
            canvas.height = outH;
            const ctx = canvas.getContext("2d");

            const scale = Math.max(outW / img.width, outH / img.height) * (Number(zoomPct || 100) / 100);
            const drawW = img.width * scale;
            const drawH = img.height * scale;
            const offsetX = (outW - drawW) * (Number(posX ?? 50) / 100);
            const offsetY = (outH - drawH) * (Number(posY ?? 50) / 100);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, outW, outH);
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
            resolve(canvas.toDataURL("image/jpeg", 0.86));
        };
        img.onerror = () => resolve(imgSrc);
        img.src = imgSrc;
    });
}

function handleStudioIconUpload(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        studioTempState.rawIconImg = await bakeCroppedImageToDataUrl(e.target.result, 100, 50, 50, 128, 128);
        showToast("✅ تم تحميل صورة الأيقونة بنجاح!");
    };
    reader.readAsDataURL(file);
}

function handleStudioCoverUpload(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        studioTempState.rawCoverImg = e.target.result;
        studioTempState.zoom = 100; studioTempState.posX = 50; studioTempState.posY = 50;
        const box = document.getElementById("st_coverPreviewBox");
        const img = document.getElementById("st_coverPreviewImg");
        const sld = document.getElementById("st_coverSliders");
        if (box && img && sld) {
            img.src = e.target.result;
            box.style.display = "block";
            sld.style.display = "block";
        }
    };
    reader.readAsDataURL(file);
}

function clearStudioCover() {
    studioTempState.rawCoverImg = "";
    const box = document.getElementById("st_coverPreviewBox");
    const sld = document.getElementById("st_coverSliders");
    if (box) box.style.display = "none";
    if (sld) sld.style.display = "none";
}

function updateStudioCoverTransform(z, x, y) {
    if (z !== null) studioTempState.zoom = Number(z);
    if (x !== null) studioTempState.posX = Number(x);
    if (y !== null) studioTempState.posY = Number(y);
    const img = document.getElementById("st_coverPreviewImg");
    if (img) {
        img.style.transform = `scale(${studioTempState.zoom / 100})`;
        img.style.objectPosition = `${studioTempState.posX}% ${studioTempState.posY}%`;
    }
}

async function submitVisualStudioForm() {
    const titleAr = document.getElementById("st_titleAr")?.value.trim() || "";
    if (!titleAr) { alert("⚠️ يرجى كتابة العنوان أولاً!"); return; }

    let bakedCover = "";
    if (studioTempState.rawCoverImg) {
        bakedCover = await bakeCroppedImageToDataUrl(studioTempState.rawCoverImg, studioTempState.zoom, studioTempState.posX, studioTempState.posY, 700, 260);
    }

    const resultData = {
        code: document.getElementById("st_code")?.value.trim() || "",
        titleAr: titleAr,
        titleEn: document.getElementById("st_titleEn")?.value.trim() || titleAr,
        descAr: document.getElementById("st_descAr")?.value.trim() || "",
        why: document.getElementById("st_why")?.value.trim() || "",
        how: document.getElementById("st_how")?.value.trim() || "",
        terms: (document.getElementById("st_terms")?.value || "").split(",").map(s => s.trim()).filter(Boolean),
        assignee: document.getElementById("st_assignee")?.value.trim() || "",
        status: document.getElementById("st_status")?.value.trim() || "",
        dueDate: document.getElementById("st_dueDate")?.value || "",
        link: document.getElementById("st_link")?.value.trim() || "",
        toolType: document.getElementById("st_toolType")?.value || "TASKS",
        icon: document.getElementById("st_icon")?.value.trim() || "📁",
        iconImg: studioTempState.rawIconImg || "",
        coverImg: bakedCover,
        coverZoom: 100, coverX: 50, coverY: 50,
        color: document.getElementById("st_color")?.value || "#050b55",
        cardStyle: document.getElementById("st_cardStyle")?.value || "standard",
        allowedUsers: [...document.querySelectorAll(".st-allow-user:checked")].map(c => c.value)
    };

    const cb = studioTempState.onSaveCallback;
    closeStudioModal();
    if (cb) await cb(resultData);
}

// ✋ محرك السحب والإفلات بالماوس (Drag & Drop) + إعادة الترقيم التلقائي الذكي
// ============================================================================
function autoRenumberStructureList(structList) {
    structList.forEach((mod, mIdx) => {
        const mCode = String(mIdx + 1).padStart(2, "0");
        mod.code = mCode;
        (mod.sections || []).forEach((sec, sIdx) => {
            const sCode = `${mCode}.${String(sIdx + 1).padStart(2, "0")}`;
            sec.code = sCode;
            (sec.topics || []).forEach((top, tIdx) => {
                top.code = `${sCode}.${String(tIdx + 1).padStart(2, "0")}`;
            });
        });
    });
}

async function triggerAutoRenumberAndSave(toolId = "tool_structure") {
    const list = getActiveStructureList(toolId);
    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("🔢 تم إعادة ترقيم جميع الوحدات والأقسام والنقاط تلقائياً بنجاح!");
}

function onTopicDragStart(ev, toolId, mIdx, sIdx, tIdx) {
    if (!hasPerm("drag_drop_reorder")) { ev.preventDefault(); return; }
    dragState = { toolId, fromM: mIdx, fromS: sIdx, fromT: tIdx };
    ev.currentTarget.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
}

function onTopicDragEnd(ev) {
    ev.currentTarget.classList.remove("dragging");
    document.querySelectorAll(".drag-over-top, .drag-over-sec").forEach(el => {
        el.classList.remove("drag-over-top", "drag-over-sec");
    });
}

function onTopicDragOver(ev) {
    if (!hasPerm("drag_drop_reorder")) return;
    ev.preventDefault();
    ev.currentTarget.classList.add("drag-over-top");
}

function onTopicDragLeave(ev) {
    ev.currentTarget.classList.remove("drag-over-top");
}

async function onTopicDropOnTopic(ev, toolId, toM, toS, toT) {
    ev.preventDefault();
    ev.stopPropagation();
    ev.currentTarget.classList.remove("drag-over-top");
    if (!hasPerm("drag_drop_reorder") || dragState.fromM < 0) return;

    const list = getActiveStructureList(toolId);
    const { fromM, fromS, fromT } = dragState;
    if (fromM === toM && fromS === toS && fromT === toT) return;

    const [movedItem] = list[fromM].sections[fromS].topics.splice(fromT, 1);
    list[toM].sections[toS].topics.splice(toT, 0, movedItem);
    dragState = { toolId: null, fromM: -1, fromS: -1, fromT: -1 };

    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✋🔢 تم نقل النقطة بالسحب والإفلات وإعادة الترقيم تلقائياً!");
}

async function onTopicDropOnSection(ev, toolId, toM, toS) {
    ev.preventDefault();
    ev.currentTarget.classList.remove("drag-over-sec");
    if (!hasPerm("drag_drop_reorder") || dragState.fromM < 0) return;

    const list = getActiveStructureList(toolId);
    const { fromM, fromS, fromT } = dragState;
    if (fromM === toM && fromS === toS) return;

    const [movedItem] = list[fromM].sections[fromS].topics.splice(fromT, 1);
    list[toM].sections[toS].topics.push(movedItem);
    dragState = { toolId: null, fromM: -1, fromS: -1, fromT: -1 };

    autoRenumberStructureList(list);
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✋🔢 تم نقل النقطة إلى القسم الجديد وإعادة الترقيم تلقائياً!");
}

// 🛡️ فحص الصلاحيات، تطبيق الهوية البصرية والألوان الديناميكية، والتنبيهات
// ============================================================================
function hasPerm(permKey) {
    if (!portalState.currentUser) return false;
    const rId = portalState.currentUser.sysRole;
    if (rId === "superadmin" || portalState.currentUser.username === "admin") return true;
    const roleObj = portalState.rolesConfig[rId];
    return roleObj && Array.isArray(roleObj.perms) && roleObj.perms.includes(permKey);
}

function uiTxt(keyBase) {
    const lbls = portalState.settings.uiLabels || {};
    const k = keyBase + (portalState.lang === "ar" ? "Ar" : "En");
    return lbls[k] || lbls[keyBase + "Ar"] || keyBase;
}

function tText(arTxt, enTxt) {
    return portalState.lang === "ar" ? arTxt : (enTxt || arTxt);
}

function showToast(msg, withSound = true) {
    const box = document.getElementById("toastContainer");
    if (!box) return;
    const el = document.createElement("div");
    el.className = "toast-item";
    el.innerHTML = `<span>🔔 ${msg}</span><span style="cursor:pointer; font-weight:800;" onclick="this.parentElement.remove()">×</span>`;
    box.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 4800);
    if (withSound) playNotificationTone();
}

function applyThemeAndLogos() {
    document.documentElement.setAttribute("data-theme", portalState.theme);
    const s = portalState.settings;
    // تطبيق الألوان والحجم واستدارة الحواف المخصصة على الموقع بالكامل
    document.documentElement.style.setProperty("--navy", s.primaryColor || "#050b55");

function addDaysToDateStr(dateStr, daysCount) {
    const d = dateStr ? new Date(dateStr) : new Date();
    if (isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + Number(daysCount || 1));
    return d.toISOString().split("T")[0];
}

function todayDateStr() { return new Date().toISOString().split("T")[0]; }

function getPipeItemByUid(topicUid, toolId = "tool_structure") {
    const k = String(topicUid).replace(/\./g, "_");
    const stages = getStagesForTool(toolId);
    if (!portalState.pipeline[k]) {
        portalState.pipeline[k] = { stageIdx: 0, subStatus: "not-started", rejected: false, rejectReason: "", stageData: {}, history: [] };
    }
    const p = portalState.pipeline[k];
    if (typeof p.stageIdx !== "number") p.stageIdx = 0;
    if (!p.stageData) p.stageData = {};
    if (!Array.isArray(p.history)) p.history = [];
    stages.forEach((stg, idx) => {
        if (!p.stageData[idx]) {
            p.stageData[idx] = { assignee: "", slaDays: stg.slaDays || 2, startDate: "", dueDate: "", completedAt: "", link: "", notes: "" };
        }
    });
    return p;
}

function isCompletedTopic(p, toolId = "tool_structure") {
    return p.stageIdx >= getStagesForTool(toolId).length;
}

function isUserActiveInTopic(p, username, toolId = "tool_structure") {
    if (!username || isCompletedTopic(p, toolId)) return false;
    const curStg = p.stageData[p.stageIdx];
    return curStg && curStg.assignee === username;
}

function isTopicOverdueNow(p, toolId = "tool_structure") {
    if (isCompletedTopic(p, toolId)) return false;
    const curStg = p.stageData[p.stageIdx];
    return curStg && curStg.dueDate && curStg.dueDate < todayDateStr();
}

function getUserAvatarUrl(uKey) {
    if (uKey === "admin") return "https://ui-avatars.com/api/?name=Admin&background=f47403&color=fff";
    const u = portalState.users[uKey];
    if (u && u.avatar) return u.avatar;
    const name = u ? u.displayName : (uKey || "U");
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=050b55&color=fff`;
}

function getUserNameDisplay(uKey) {
    if (!uKey) return tText("غير معين", "Unassigned");
    if (uKey === "admin") return "Super Admin";
    return portalState.users[uKey] ? portalState.users[uKey].displayName : uKey;
}

function getUserJobsText(uObj) {
    if (!uObj) return "-";
    const jobsArr = Array.isArray(uObj.jobs) ? uObj.jobs : (uObj.jobRole ? [uObj.jobRole] : []);
    if (jobsArr.length === 0) return "عضو عام";
    return jobsArr.map(jKey => portalState.jobCatalog.find(x => x.key === jKey)?.title || jKey).join(" + ");
}

function renderPersonalDashboard() {
    const box = document.getElementById("personalDashboard");
    if (!portalState.currentUser) return;
    if (portalState.navPath.level === "SYS_PAGE" || portalState.navPath.level === "STRUCT_IMPORT") {
        box.style.display = "none";
        return;
    }
    box.style.display = "block";

    const uName = portalState.currentUser.username;
    let myTurnCount = 0, myInProgressCount = 0, myOverdueCount = 0, myDoneStagesCount = 0;
    const urgentList = [];

    // جمع المهام عبر كل هياكل المشروعات والكورسات والتاسكات العامة
    Object.keys(portalState.portalTree.courseStructures || {}).forEach(tId => {
        const sList = getActiveStructureList(tId);
        const stgs = getStagesForTool(tId);
        sList.forEach(mod => {
            (mod.sections || []).forEach(sec => {
                (sec.topics || []).forEach(t => {
                    const p = getPipeItemByUid(t.uid, tId);
                    if (isUserActiveInTopic(p, uName, tId)) {
                        myTurnCount++;
                        if (p.subStatus === "in-progress") myInProgressCount++;
                        if (isTopicOverdueNow(p, tId)) myOverdueCount++;
                        urgentList.push({ toolId: tId, uid: t.uid, code: t.code, stgName: stgs[p.stageIdx]?.name || "", rejected: p.rejected, due: p.stageData[p.stageIdx]?.dueDate });
                    }
                    stgs.forEach((_, idx) => { if (p.stageData[idx]?.assignee === uName && p.stageIdx > idx) myDoneStagesCount++; });
                });
            });
        });
    });

    const roleTitle = portalState.rolesConfig[portalState.currentUser.sysRole]?.title || portalState.currentUser.sysRole;
    const uObj = portalState.users[uName] || portalState.currentUser;
    const inStructView = portalState.navPath.level === "TOOL";

    box.innerHTML = `
        <div class="dash-header">
            <div style="display:flex; align-items:center; gap:0.8rem;">
                <img src="${getUserAvatarUrl(uName)}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid var(--orange); cursor:pointer;" onclick="openFullPageSystemView('PROFILE')">
                <div>
                    <h3 style="font-size:0.98rem; font-weight:800;">${uiTxt("dashTitle")} (${portalState.currentUser.displayName})</h3>
                    <p style="font-size:0.74rem; color:var(--text-muted);">الصلاحية: <strong style="color:var(--orange);">${roleTitle}</strong> | الوظائف: <strong>${getUserJobsText(uObj)}</strong></p>
                </div>
            </div>
            ${inStructView ? `
                <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                    <button class="btn btn-orange btn-xs" onclick="portalState.filterMode='MY_TURN'; renderAllViews();">🔥 عرض مهامي الحالية (${myTurnCount})</button>
                    <button class="btn btn-outline btn-xs" onclick="portalState.filterMode='ALL'; renderAllViews();">📋 عرض كل البنود</button>
                </div>
            ` : ''}
        </div>
        <div class="dash-kpi-grid">
            <div class="kpi-card" onclick="if('${inStructView}'==='true'){portalState.filterMode='MY_TURN';renderAllViews();}">
                <div class="kpi-label">${uiTxt("kpi1")}</div><div class="kpi-num">${myTurnCount}</div>
            </div>
            <div class="kpi-card" onclick="if('${inStructView}'==='true'){portalState.filterMode='IN_PROGRESS';renderAllViews();}">
                <div class="kpi-label">${uiTxt("kpi2")}</div><div class="kpi-num" style="color:#0284c7;">${myInProgressCount}</div>
            </div>
            <div class="kpi-card" onclick="if('${inStructView}'==='true'){portalState.filterMode='OVERDUE';renderAllViews();}">
                <div class="kpi-label">${uiTxt("kpi3")}</div><div class="kpi-num" style="color:#ef4444;">${myOverdueCount}</div>
            </div>
            <div class="kpi-card" onclick="if('${inStructView}'==='true'){portalState.filterMode='COMPLETED';renderAllViews();}">
                <div class="kpi-label">${uiTxt("kpi4")}</div><div class="kpi-num" style="color:#10b981;">${myDoneStagesCount}</div>
            </div>
        </div>
        ${urgentList.length > 0 ? `
            <div style="margin-top:0.7rem; padding-top:0.6rem; border-top:1px dashed var(--border-color); font-size:0.75rem;">
                <strong style="color:var(--orange);">⚡ مهام عاجلة تنتظر استلامك/إجراءك الآن (اضغط للانتقال الفوري):</strong>
                <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.35rem;">
                    ${urgentList.slice(0, 10).map(it => `
                        <span onclick="jumpToTopic('${it.code}', '${it.uid}', '${it.toolId}')" style="cursor:pointer; background:var(--card-bg); border:1px solid ${it.rejected?'#ef4444':'var(--orange)'}; padding:0.2rem 0.6rem; border-radius:6px; font-weight:700;">
                            ${it.code} (${it.stgName}) ${it.rejected ? '⚠️ مرتجع' : ''} ${it.due ? `[📅 ${it.due}]` : ''}
                        </span>
                    `).join("")}
                </div>
            </div>
        ` : ''}
    `;
}

function navigatePortal(level, catId = null, courseId = null, toolId = null) {
    portalState.navPath = { level, catId, courseId, toolId, sysPage: null, prevNav: null };
    renderAllViews();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function openFullPageSystemView(sysPageName) {
    const currentCopy = Object.assign({}, portalState.navPath);
    if (currentCopy.level !== "SYS_PAGE") portalState.navPath.prevNav = currentCopy;
    portalState.navPath.level = "SYS_PAGE";
    portalState.navPath.sysPage = sysPageName;
    renderAllViews();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function goBackFromSystemPage() {
    if (portalState.navPath.prevNav && portalState.navPath.prevNav.level !== "SYS_PAGE") portalState.navPath = portalState.navPath.prevNav;
    else portalState.navPath = { level: "HOME", catId: null, courseId: null, toolId: null, sysPage: null, prevNav: null };
    renderAllViews();
}

function renderBreadcrumbs() {
    const bar = document.getElementById("breadcrumbContainer");
    const { level, catId, courseId, toolId, sysPage } = portalState.navPath;
    let html = `<span class="crumb-item ${level==='HOME'?'active':''}" onclick="navigatePortal('HOME')">🏠 الرئيسية (DCA Portal)</span>`;

    if (level === "SYS_PAGE") {
        const sysTitles = { PROFILE: "👤 صفحتي الشخصية", INBOX: "🔔 مركز الإشعارات", MAIL_STUDIO: "📧 إرسال بريد وتعميم رسمي", USERS: "👥 إدارة الفريق والوظائف", ROLES: "🛡️ مستويات الصلاحيات", STAGES: "🔄 إدارة المراحل", SETTINGS: "⚙️ إعدادات البوابة والمظهر" };
        html += ` <span>/</span> <span class="crumb-item active">${sysTitles[sysPage] || sysPage}</span>`;
        bar.innerHTML = html; return;
    }
    if (catId) {
        const cat = portalState.portalTree.categories.find(c => c.id === catId);
        if (cat) html += ` <span>/</span> <span class="crumb-item ${level==='CATEGORY'?'active':''}" onclick="navigatePortal('CATEGORY', '${catId}')">${tText(cat.titleAr, cat.titleEn)}</span>`;
    }
    if (courseId && catId) {
        const crs = (portalState.portalTree.courses[catId] || []).find(c => c.id === courseId);
        if (crs) html += ` <span>/</span> <span class="crumb-item ${level==='COURSE'?'active':''}" onclick="navigatePortal('COURSE', '${catId}', '${courseId}')">${tText(crs.titleAr, crs.titleEn)}</span>`;
    }
    if (toolId && courseId) {
        const tl = (portalState.portalTree.courseTools[courseId] || []).find(x => x.id === toolId);
        if (tl) html += ` <span>/</span> <span class="crumb-item ${level==='TOOL'?'active':''}" onclick="navigatePortal('TOOL', '${catId}', '${courseId}', '${toolId}')">${tText(tl.titleAr, tl.titleEn)}</span>`;
    }
    if (level === "STRUCT_IMPORT") html += ` <span>/</span> <span class="crumb-item active">📥 استيراد وبناء الاستركشر الذكي</span>`;
    bar.innerHTML = html;
}

    return node.allowedUsers.includes(portalState.currentUser.username);
}

    }

    if (level === "TOOL") {
        const tools = (portalState.portalTree.courseTools && portalState.portalTree.courseTools[courseId]) || [];
        const tl = tools.find(x => x.id === toolId);
        if (!tl || tl.type === "STRUCTURE") renderStructurePipelineView(viewport, catId, courseId, toolId || "tool_structure");
        else renderDynamicToolEngine(viewport, catId, courseId, tl);
    }
}

// ============================================================================
// 🏗️ عرض استركشر المشروع/الكورس مع السحب والإفلات وتخصيص المراحل والتحكم في السجل
// ============================================================================
function jumpToTopic(code, uid = null, toolId = "tool_structure") {
    portalState.selectedModule = code.split(".")[0];
    portalState.filterMode = "ALL";
    const key = uid || code.replace(/\./g, "_");
    openTopicPanesSet.add(key);
    portalState.navPath = { level: "TOOL", catId: "cat_courses", courseId: "crs_dc_im", toolId: toolId, sysPage: null };
    renderAllViews();
    setTimeout(() => { const el = document.getElementById(`topic-card-${key}`); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 120);
}

function toggleStructTopic(uid) {
    const pane = document.getElementById(`topic-pane-${uid}`);
    if (!pane) return;
    if (openTopicPanesSet.has(uid)) { openTopicPanesSet.delete(uid); pane.classList.remove("open"); }
    else { openTopicPanesSet.add(uid); pane.classList.add("open"); }
}

function getUserOptionsForJob(selectedUser, jobKey) {
    let html = `<option value="">-- غير معين --</option>`;
    Object.keys(portalState.users).forEach(k => {
        const u = portalState.users[k];
        const uJobs = Array.isArray(u.jobs) ? u.jobs : (u.jobRole ? [u.jobRole] : []);
        html += `<option value="${k}" ${selectedUser === k ? 'selected' : ''}>${uJobs.includes(jobKey) ? '⭐ ' : ''}${u.displayName}</option>`;
    });
    return html;
}

function renderStructurePipelineView(viewport, catId, courseId, toolId = "tool_structure") {
    const structList = getActiveStructureList(toolId);
    const uName = portalState.currentUser.username;
    const canAssign = hasPerm("assign_tasks");
    const canEditDates = hasPerm("edit_dates_sla");
    const canOverride = hasPerm("override_stage");
    const canEditStruct = hasPerm("manage_structure");
    const canDrag = hasPerm("drag_drop_reorder");
    const canManageLog = hasPerm("manage_audit_log");
    const stages = getStagesForTool(toolId);

    const prevSearch = document.getElementById("structSearchInput")?.value || "";
    const searchVal = prevSearch.trim().toLowerCase();

    let unitsNavHtml = structList.map(m => {
        let cnt = 0; (m.sections || []).forEach(s => cnt += (s.topics || []).length);
        return `<li class="unit-item ${portalState.selectedModule === m.code ? 'active' : ''}" onclick="portalState.selectedModule='${m.code}'; renderAllViews();">
            <span><strong>${m.code}</strong> - ${m.title}</span><span class="notif-badge" style="background:var(--navy-light);">${cnt}</span>
        </li>`;
    }).join("");

    let modulesHtml = "";

    structList.forEach((mod, mIdx) => {
        if (portalState.selectedModule !== "ALL" && portalState.selectedModule !== mod.code) return;
        let secsHtml = "";

        (mod.sections || []).forEach((sec, sIdx) => {
            let topicsHtml = "";
            (sec.topics || []).forEach((t, tIdx) => {
                const p = getPipeItemByUid(t.uid, toolId);
                const completed = isCompletedTopic(p, toolId);
                const myTurn = isUserActiveInTopic(p, uName, toolId);
                const overdue = isTopicOverdueNow(p, toolId);

                if (portalState.filterMode === "MY_TURN" && !myTurn) return;
                if (portalState.filterMode === "IN_PROGRESS" && !(myTurn && p.subStatus === "in-progress")) return;
                if (portalState.filterMode === "OVERDUE" && !overdue) return;
                if (portalState.filterMode === "COMPLETED" && !completed) return;
                if (searchVal && !`${t.code} ${t.title} ${t.content} ${(t.terms||[]).join(" ")}`.toLowerCase().includes(searchVal)) return;

                const curStageObj = stages[p.stageIdx];
                const curStageTitle = completed ? "🏆 مكتمل ومعتمد بالكامل" : `${curStageObj?.icon||''} المرحلة (${p.stageIdx + 1}/${stages.length}): ${curStageObj?.name||''}`;
                const isOpen = openTopicPanesSet.has(t.uid);

                const stepperHtml = stages.map((stg, idx) => {
                    const sd = p.stageData[idx] || {};
                    const isCur = (!completed && p.stageIdx === idx);
                    const isDone = (p.stageIdx > idx);
                    let boxCls = "step-box" + (isCur ? (p.rejected ? " rejected-stage" : " active-stage") : (isDone ? " done-stage" : ""));
                    return `
                    <div class="${boxCls}">
                        <div class="step-head"><span>${idx + 1}. ${stg.icon} ${stg.name}</span><span>${isDone ? '✅' : (isCur ? (p.subStatus==='in-progress'?'⚙️ جاري':'⏳') : '')}</span></div>
                        <div>👤 ${canAssign ? `<select class="form-input" style="padding:0.12rem; font-size:0.7rem;" onchange="assignTopicStageUser('${t.uid}', '${t.code}', ${idx}, this.value, '${toolId}')">${getUserOptionsForJob(sd.assignee, stg.jobKey)}</select>` : `<strong>${getUserNameDisplay(sd.assignee)}</strong>`}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;"><span>⏱️ الأيام:</span>${canEditDates ? `<input type="number" min="1" class="form-input" style="width:52px; padding:0.1rem; font-size:0.7rem;" value="${sd.slaDays || stg.slaDays}" onchange="updateTopicStageSla('${t.uid}', ${idx}, this.value, '${toolId}')">` : `<strong>${sd.slaDays || stg.slaDays} يوم</strong>`}</div>
                        <div>🟢 بدء: <strong>${sd.startDate || '-'}</strong></div>
                        <div>📅 استحقاق: ${(canEditDates || (isCur && sd.assignee === uName && idx > 0)) ? `<input type="date" class="form-input" style="padding:0.1rem; font-size:0.68rem;" value="${sd.dueDate||''}" onchange="updateTopicStageDue('${t.uid}', ${idx}, this.value)">` : `<strong>${sd.dueDate || 'عند الاستلام'}</strong>`}</div>
                        ${sd.completedAt ? `<div style="color:#10b981; font-weight:700;">✔ سُلّم: ${sd.completedAt}</div>` : ''}
                    </div>`;
                }).join("");

                topicsHtml += `
                <div class="topic-item ${myTurn ? 'my-turn' : ''}" id="topic-card-${t.uid}"
                     ${canDrag ? `draggable="true" ondragstart="onTopicDragStart(event,'${toolId}',${mIdx},${sIdx},${tIdx})" ondragend="onTopicDragEnd(event)" ondragover="onTopicDragOver(event)" ondragleave="onTopicDragLeave(event)" ondrop="onTopicDropOnTopic(event,'${toolId}',${mIdx},${sIdx},${tIdx})"` : ''}>
                    <div class="topic-top-bar">
                        <div class="topic-title-box" onclick="toggleStructTopic('${t.uid}')">
                            ${canDrag ? `<span class="drag-handle" title="اسحب النقطة بالماوس لتحريكها أو نقلها لقسم آخر">⠿</span>` : ''}
                            <span class="t-code">${t.code}</span>
                            <span class="t-title">${t.title}</span>
                            ${t.isNew ? `<span class="notif-badge" style="background:#10b981;">✨ محدث</span>` : ''}
                            ${p.rejected ? `<span class="notif-badge" style="background:#ef4444;">⚠️ مرفوض ومرتجع</span>` : ''}
                            ${overdue ? `<span class="notif-badge" style="background:#dc2626;">🚨 متأخر</span>` : ''}
                            ${myTurn ? `<span class="notif-badge">🔥 دورك الآن</span>` : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:0.3rem; flex-wrap:wrap;">
                            <span style="font-size:0.74rem; font-weight:800; color:${completed?'#10b981':'var(--orange)'}; margin-left:0.3rem;">${curStageTitle}</span>
                            ${canDrag ? `
                                <button class="btn btn-outline btn-xs" onclick="moveStructTopic('${toolId}', ${mIdx}, ${sIdx}, ${tIdx}, -1)" title="لأعلى">⬆️</button>
                                <button class="btn btn-outline btn-xs" onclick="moveStructTopic('${toolId}', ${mIdx}, ${sIdx}, ${tIdx}, 1)" title="لأسفل">⬇️</button>
                                <button class="btn btn-outline btn-xs" onclick="moveTopicToAnotherSection('${toolId}', ${mIdx}, ${sIdx}, ${tIdx})" title="نقل لقسم آخر">↗️ نقل</button>
                            ` : ''}
                            ${canEditStruct ? `
                                <button class="btn btn-outline btn-xs" onclick="openStructTopicStudio('${toolId}', ${mIdx}, ${sIdx}, ${tIdx})" title="استوديو تعديل النقطة">🎨 تعديل</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteStructTopic('${toolId}', ${mIdx}, ${sIdx}, ${tIdx})">🗑️</button>
                            ` : ''}
                            <button class="btn btn-outline btn-xs" onclick="toggleStructTopic('${t.uid}')">📖 ${isOpen ? 'طي ▲' : 'التفاصيل ▼'}</button>
                        </div>
                    </div>

                    <div class="pipeline-stepper">${stepperHtml}</div>

                    <div class="topic-body-pane ${isOpen ? 'open' : ''}" id="topic-pane-${t.uid}">
                        <div class="guide-grid">
                            <div class="guide-card"><h5>📝 المحتوى والتفاصيل المطلوبة</h5><p style="line-height:1.5;">${t.content || 'لم يحدد وصف بعد.'}</p></div>
                            <div class="guide-card">
                                <h5>📐 إرشادات التقسيم والمصطلحات</h5>
                                <div style="display:flex; flex-wrap:wrap; gap:0.25rem; margin-top:0.3rem;">
                                    ${(t.terms||[]).map(tm => `<span style="background:var(--navy-soft); color:var(--text-main); padding:0.1rem 0.45rem; border-radius:4px; font-size:0.7rem; font-weight:700; direction:ltr;">${tm}</span>`).join("")}
                                </div>
                            </div>
                            <div class="guide-card">
                                <h5>🔗 روابط ملفات المراحل</h5>
                                <div style="font-size:0.73rem; display:flex; flex-direction:column; gap:0.3rem;">
                                    ${stages.map((stg, idx) => `<div>${idx+1}. ${stg.name}: ${p.stageData[idx]?.link ? `<a href="${p.stageData[idx].link}" target="_blank" style="color:var(--orange); font-weight:800;">فتح الملف ↗</a>` : 'لم يُرفق'}</div>`).join("")}
                                </div>
                            </div>
                        </div>

                        ${p.rejected && p.rejectReason ? `<div style="background:rgba(239,68,68,0.12); border:1px solid #ef4444; padding:0.7rem; border-radius:8px; margin-bottom:0.65rem; font-size:0.8rem; color:#ef4444; font-weight:700;">⚠️ سبب الرفض والإرجاع: "${p.rejectReason}"</div>` : ''}

                        ${renderDynamicStageActionBox(t.uid, t.code, t.title, p, toolId)}
                        ${canOverride ? renderAdminOverrideBar(t.uid, t.code, p, toolId) : ''}

                        <!-- سجل حركات وتسليمات النقطة مع تحكم السوبر أدمن في حذف أي خطوة أو تصفير السجل -->
                        ${p.history && p.history.length > 0 ? `
                            <div style="margin-top:0.7rem; background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:0.6rem 0.8rem; font-size:0.73rem;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                                    <strong style="color:var(--orange);">📜 سجل حركات وتسليمات النقطة (${p.history.length}):</strong>
                                    ${canManageLog ? `<button class="btn btn-danger btn-xs" onclick="clearAllTopicHistory('${t.uid}')">🧹 مسح وتصفير سجل الحركات بالكامل</button>` : ''}
                                </div>
                                <div style="max-height:130px; overflow-y:auto; display:flex; flex-direction:column; gap:0.25rem;">
                                    ${p.history.map((h, hIdx) => `
                                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.2rem 0.4rem; background:var(--bg-sec); border-radius:4px;">
                                            <span>• <code>[${h.time}]</code> <strong>${h.user}:</strong> ${h.action}</span>
                                            ${canManageLog ? `<button class="btn btn-danger btn-xs" style="padding:0.08rem 0.35rem; font-size:0.65rem;" onclick="deleteSingleHistoryStep('${t.uid}', ${hIdx})" title="حذف هذه الخطوة فقط">🗑️ حذف الخطوة</button>` : ''}
                                        </div>
                                    `).join("")}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            });

            if (topicsHtml !== "" || canEditStruct) {
                secsHtml += `
                <div class="sec-container"
                     ${canDrag ? `ondragover="event.preventDefault(); this.classList.add('drag-over-sec');" ondragleave="this.classList.remove('drag-over-sec');" ondrop="onTopicDropOnSection(event,'${toolId}',${mIdx},${sIdx})"` : ''}>
                    <div class="sec-head">
                        <h3 style="font-size:0.96rem; font-weight:800; display:flex; align-items:center; gap:0.45rem;">
                            <span class="sec-code-pill">${sec.code}</span> ${sec.title}
                        </h3>
                        <div style="display:flex; gap:0.3rem; align-items:center; flex-wrap:wrap;">
                            ${canEditStruct ? `
                                <button class="btn btn-orange btn-xs" onclick="openStructTopicStudio('${toolId}', ${mIdx}, ${sIdx}, -1)">➕ إضافة نقطة</button>
                                <button class="btn btn-outline btn-xs" onclick="moveStructSection('${toolId}', ${mIdx}, ${sIdx}, -1)">⬆️</button>
                                <button class="btn btn-outline btn-xs" onclick="moveStructSection('${toolId}', ${mIdx}, ${sIdx}, 1)">⬇️</button>
                                <button class="btn btn-outline btn-xs" onclick="openStructSectionStudio('${toolId}', ${mIdx}, ${sIdx})">🎨 تعديل القسم</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteStructSection('${toolId}', ${mIdx}, ${sIdx})">🗑️</button>
                            ` : ''}
                            ${canAssign ? `
                                <div style="display:flex; gap:0.25rem; align-items:center; flex-wrap:wrap; font-size:0.7rem; background:var(--bg-sec); padding:0.2rem 0.45rem; border-radius:6px;">
                                    <strong>تعيين القسم:</strong>
                                    ${stages.map((stg, idx) => `<select class="form-input" style="width:auto; padding:0.1rem; font-size:0.68rem;" onchange="bulkAssignSectionStage('${toolId}', ${mIdx}, ${sIdx}, ${idx}, this.value)"><option value="">${stg.icon} ${stg.name}...</option>${getUserOptionsForJob("", stg.jobKey)}</select>`).join("")}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <div style="background:var(--orange-soft); border-right:4px solid var(--orange); padding:0.6rem 0.85rem; border-radius:6px; margin-bottom:0.75rem; font-size:0.77rem;">
                        <strong>🎯 الهدف:</strong> ${sec.why || '-'} | <strong>🗺️ العرض:</strong> ${sec.how || '-'}
                    </div>
                    <div>${topicsHtml || `<p style="font-size:0.78rem; color:var(--text-muted); padding:0.5rem;">لا توجد نقاط في هذا القسم بعد.</p>`}</div>
                </div>`;
            }
        });

        if (secsHtml !== "" || canEditStruct) {
            modulesHtml += `
            <div class="module-container">
                <div class="module-head">
                    <h2><span>الوحدة ${mod.code}:</span> ${mod.title}</h2>
                    ${canEditStruct ? `
                        <div style="display:flex; gap:0.3rem; flex-wrap:wrap;">
                            <button class="btn btn-orange btn-xs" onclick="openStructSectionStudio('${toolId}', ${mIdx}, -1)">➕ إضافة قسم فرعي</button>
                            <button class="btn btn-header btn-xs" onclick="moveStructModule('${toolId}', ${mIdx}, -1)">⬆️</button>
                            <button class="btn btn-header btn-xs" onclick="moveStructModule('${toolId}', ${mIdx}, 1)">⬇️</button>
                            <button class="btn btn-header btn-xs" onclick="openStructModuleStudio('${toolId}', ${mIdx})">🎨 تعديل الوحدة</button>
                            <button class="btn btn-danger btn-xs" onclick="deleteStructModule('${toolId}', ${mIdx})">🗑️</button>
                        </div>
                    ` : ''}
                </div>
                <div style="padding:0.65rem 1.2rem; background:var(--bg-sec); font-size:0.78rem; color:var(--text-muted); border-bottom:1px solid var(--border-color);">
                    <strong>📌 نظرة عامة:</strong> ${mod.overview || '-'}
                </div>
                ${secsHtml}
            </div>`;
        }
    });

    viewport.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem; margin-bottom:1rem; background:var(--bg-sec); padding:0.8rem 1rem; border-radius:10px; border:1px solid var(--border-color);">
            <div style="display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="navigatePortal('COURSE', '${catId}', '${courseId}')">⬅️ رجوع لأدوات المشروع/الكورس</button>
                <input type="text" id="structSearchInput" class="form-input" style="width:200px;" value="${prevSearch}" placeholder="🔍 ابحث برقم النقطة أو الاسم..." oninput="renderStructurePipelineView(document.getElementById('mainViewPort'), '${catId}', '${courseId}', '${toolId}')">
                <select class="form-input" style="width:auto;" onchange="portalState.filterMode=this.value; renderAllViews();">
                    <option value="ALL" ${portalState.filterMode==='ALL'?'selected':''}>📌 كل النقاط</option>
                    <option value="MY_TURN" ${portalState.filterMode==='MY_TURN'?'selected':''}>🔥 واقفة عند مرحلتي الآن</option>
                    <option value="IN_PROGRESS" ${portalState.filterMode==='IN_PROGRESS'?'selected':''}>⚙️ جاري العمل عليها</option>
                    <option value="OVERDUE" ${portalState.filterMode==='OVERDUE'?'selected':''}>🚨 المتأخرات (Overdue)</option>
                    <option value="COMPLETED" ${portalState.filterMode==='COMPLETED'?'selected':''}>🏆 المكتملة نهائياً</option>
                </select>
            </div>
            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                ${canEditStruct ? `
                    <button class="btn btn-orange" onclick="openStructModuleStudio('${toolId}', -1)">➕ إضافة وحدة رئيسية</button>
                    <button class="btn btn-navy" onclick="triggerAutoRenumberAndSave('${toolId}')">🔢 إعادة ترقيم تلقائي</button>
                    <button class="btn btn-outline" onclick="navigatePortal('STRUCT_IMPORT', '${catId}', '${courseId}', '${toolId}')">📥 استيراد (Word / Excel)</button>
                ` : ''}
                ${hasPerm("manage_stages") ? `<button class="btn btn-outline" onclick="customizeToolStagesPrompt('${toolId}')">🔄 تخصيص مراحل هذا المشروع</button>` : ''}
                <button class="btn btn-success" onclick="exportFullPipelineCSV('${toolId}')">📊 تصدير Excel</button>
            </div>
        </div>
        <div class="course-layout">
            <aside class="course-sidebar">
                <div class="box-card">
                    <h3><span>📑 الوحدات الرئيسية</span><button class="btn btn-outline btn-xs" onclick="portalState.selectedModule='ALL'; renderAllViews();">عرض الكل</button></h3>
                    <ul class="unit-list">${unitsNavHtml}</ul>
                </div>
            </aside>
            <div class="course-main">${modulesHtml || `<div class="box-card" style="text-align:center; padding:2.5rem;">لا توجد وحدات أو نقاط مطابقة حالياً.</div>`}</div>
        </div>`;
}

// ============================================================================
// 🎨 دوال فتح استوديو التعديل الموضعي (للقطاعات والمشروعات والأزرار والوحدات والأقسام والنقاط)
// ============================================================================
function openPortalNodeStudio(type, isEdit, catId = null, courseId = null, toolId = null) {
    let target = null;
    if (isEdit) {
        if (type === "CATEGORY") target = portalState.portalTree.categories.find(x => x.id === catId);
        if (type === "COURSE") target = (portalState.portalTree.courses[catId] || []).find(x => x.id === courseId);
        if (type === "TOOL") target = (portalState.portalTree.courseTools[courseId] || []).find(x => x.id === toolId);
    }

    openVisualStudioModal({
        modalTitle: isEdit ? `تعديل بيانات ومظهر: ${target?.titleAr || ''}` : `إضافة زرار / قسم جديد`,
        titleAr: target?.titleAr || "",
        titleEn: target?.titleEn || "",
        showTitleEn: true,
        descAr: target?.descAr || "",
        showToolTypeSelector: (type === "TOOL" && !isEdit),
        toolType: target?.type || "TASKS",
        showVisualAppearance: true,
        icon: target?.icon || "📁",
        iconImg: target?.iconImg || "",
        coverImg: target?.coverImg || "",
        color: target?.color || "#050b55",
        cardStyle: target?.cardStyle || "standard",
        showAccessControl: true,
        allowedUsers: target?.allowedUsers || [],
        onSave: async (res) => {
            if (isEdit && target) {
                Object.assign(target, {
                    titleAr: res.titleAr, titleEn: res.titleEn, descAr: res.descAr, descEn: res.descAr,
                    icon: res.icon, iconImg: res.iconImg, coverImg: res.coverImg,
                    color: res.color, cardStyle: res.cardStyle, allowedUsers: res.allowedUsers
                });
            } else {
                const newId = "node_" + Date.now();
                const newNode = {
                    id: newId, type: res.toolType, titleAr: res.titleAr, titleEn: res.titleEn, descAr: res.descAr, descEn: res.descAr,
                    icon: res.icon, iconImg: res.iconImg, coverImg: res.coverImg,
                    color: res.color, cardStyle: res.cardStyle, allowedUsers: res.allowedUsers
                };
                if (type === "CATEGORY") {
                    portalState.portalTree.categories.push(newNode);
                    portalState.portalTree.courses[newId] = [];
                } else if (type === "COURSE") {
                    if (!portalState.portalTree.courses[catId]) portalState.portalTree.courses[catId] = [];
                    portalState.portalTree.courses[catId].push(newNode);
                    const sId = "tool_struct_" + newId;
                    portalState.portalTree.courseTools[newId] = [
                        { id: sId, type: "STRUCTURE", icon: "🏗️", color: "#050b55", cardStyle: "standard", titleAr: "خريطة العمل والمراحل", titleEn: "Workflow Pipeline", descAr: "نظام المراحل والتسليم والتسلم", descEn: "Workflow Pipeline" },
                        { id: "tool_tasks_" + newId, type: "TASKS", icon: "📝", color: "#f47403", cardStyle: "standard", titleAr: "المهام والتكليفات اليومية", titleEn: "Tasks & Actions", descAr: "لوحة المهام والأنشطة", descEn: "Tasks" },
                        { id: "tool_table_" + newId, type: "TABLE", icon: "📅", color: "#0d9488", cardStyle: "standard", titleAr: "الجدول الزمني والسجلات", titleEn: "Schedule & Logs", descAr: "جدول ديناميكي مرن", descEn: "Dynamic Table" },

// تخصيص مراحل تشغيل مستقلة لأي مشروع في أي إدارة
function customizeToolStagesPrompt(toolId) {
    const curStages = getStagesForTool(toolId);
    openVisualStudioModal({
        modalTitle: "🔄 تخصيص مراحل خط الإنتاج لهذا المشروع/الكورس تحديداً",
        titleAr: "مراحل المشروع المخصصة",
        descLabel: "اكتب كل مرحلة في سطر منفصل بالصيغة: اسم المرحلة | عدد الأيام | نعم (لصلاحية الرفض) أو لا",
        descAr: curStages.map(s => `${s.name} | ${s.slaDays} | ${s.canReject ? 'نعم' : 'لا'}`).join("\n"),
        onSave: async (res) => {
            const lines = res.descAr.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return;
            const newStgs = lines.map((ln, idx) => {
                const parts = ln.split("|").map(x => x.trim());
                return {
                    id: "cst_" + idx,
                    name: parts[0] || `مرحلة ${idx+1}`,
                    icon: ["✍️","🔍","🎨","📄","🎯","🚀"][idx % 6],
                    jobKey: portalState.jobCatalog[idx % portalState.jobCatalog.length]?.key || "writer",
                    slaDays: Number(parts[1] || 2),
                    canReject: (parts[2] || "").includes("نعم")
                };
            });
            if (!portalState.portalTree.customToolStages) portalState.portalTree.customToolStages = {};
            portalState.portalTree.customToolStages[toolId] = newStgs;
            await savePortalTreeToCloud();
            renderAllViews();
            showToast("✅ تم تخصيص مراحل التشغيل لهذا المشروع بنجاح!");
        }
    });
}

        titleAr: list[mIdx].sections[sIdx].topics[tIdx].title,
        showCodeField: true,
        codeVal: list[mIdx].sections[sIdx].code,
        descLabel: "اكتب رقم القسم الجديد المراد نقل النقطة إليه في خانة الرقم بالأعلى (الأقسام المتاحة بالأسفل):",
        descAr: list.map(m => m.sections.map(s => `${s.code} (${s.title})`).join(" | ")).join("\n"),
        onSave: async (res) => {
            let destM = -1, destS = -1;

function getToolCustomData(toolId, defaultType) {
    if (!portalState.portalTree.customItems) portalState.portalTree.customItems = {};
    if (!portalState.portalTree.customItems[toolId]) {
        portalState.portalTree.customItems[toolId] = (defaultType === "TABLE")
            ? { columns: ["البند / الأسبوع", "الموضوع والتفاصيل", "المدة / التاريخ", "المسؤول", "الحالة / ملاحظات"], rows: [] }
            : [];
    }
    return portalState.portalTree.customItems[toolId];
}

function renderDynamicStageActionBox(tUid, tCode, tTitle, p, toolId = "tool_structure") {
    const stages = getStagesForTool(toolId);
    const completed = isCompletedTopic(p, toolId);
    const uName = portalState.currentUser.username;
    const myTurn = isUserActiveInTopic(p, uName, toolId);
    const canOverride = hasPerm("override_stage");

    if (completed) return `<div class="action-panel" style="border-color:#10b981;"><strong style="color:#10b981;">🏆 هذه النقطة أتمت جميع المراحل بنجاح وتم اعتمادها بالكامل!</strong></div>`;

    const curIdx = p.stageIdx;
    const curStg = stages[curIdx];
    const nextStg = stages[curIdx + 1];
    const prevStg = curIdx > 0 ? stages[curIdx - 1] : null;
    const sd = p.stageData[curIdx] || {};
    const prevLink = curIdx > 0 ? (p.stageData[curIdx - 1]?.link || "") : "";

    if (!myTurn && !canOverride) {
        return `<div class="action-panel" style="font-size:0.78rem; color:var(--text-muted);">🔒 <strong>للعرض فقط:</strong> النقطة حالياً في مرحلة <strong>(${curStg.icon} ${curStg.name})</strong> عند: <strong>${getUserNameDisplay(sd.assignee)}</strong>.</div>`;
    }

    const nextBtnLabel = nextStg
        ? `📤 انتهيت من (${curStg.name}) ⬅️ تسليم إلى (${nextStg.name} - ${getUserNameDisplay(p.stageData[curIdx+1]?.assignee)})`
        : `🏆 اعتماد نهائي وإتمام النقطة بالكامل (${curStg.name})`;
