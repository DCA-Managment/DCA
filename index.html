                <div class="form-group"><label>Service ID:</label><input type="text" id="ejsService" class="form-input" value="${s.ejsService||''}"></div>
                <div class="form-group"><label>Template ID:</label><input type="text" id="ejsTemplate" class="form-input" value="${s.ejsTemplate||''}"></div>
                <div class="form-group"><label>Public Key:</label><input type="text" id="ejsKey" class="form-input" value="${s.ejsKey||''}"></div>
                <hr style="margin:1rem 0; border-color:var(--border-color);">
                <button class="btn btn-danger" onclick="resetAllTopicsPipeline()">🔄 تصفير وإعادة ضبط حالات كل النقاط للمرحلة 1</button>
            </div>
        </div>

        <!-- لوحة التحكم الكامل في أسماء أزرار وعناوين الموقع بدون لمس الكود -->
        <div class="box-card" style="margin-bottom:1.2rem;">
            <h3>✏️ تخصيص وتعديل أسماء الأزرار والعناوين في الموقع بالكامل (UI Labels Customizer)</h3>
            <p style="font-size:0.78rem; color:var(--text-muted); margin-bottom:0.8rem;">عدل أي مسمى لأي زرار أو عنوان بالعربية أو الإنجليزية وسيتم تطبيقه فوراً في الموقع كله دون الحاجة لتعديل الكود:</p>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:0.7rem;">
                <div class="form-group"><label>زرار صفحتي (عربي):</label><input type="text" id="lbl_navProfileAr" class="form-input" value="${lbl.navProfileAr||''}"></div>
                <div class="form-group"><label>زرار الإشعارات (عربي):</label><input type="text" id="lbl_navInboxAr" class="form-input" value="${lbl.navInboxAr||''}"></div>
                <div class="form-group"><label>زرار إدارة الفريق (عربي):</label><input type="text" id="lbl_navUsersAr" class="form-input" value="${lbl.navUsersAr||''}"></div>
                <div class="form-group"><label>زرار مستويات الصلاحيات (عربي):</label><input type="text" id="lbl_navRolesAr" class="form-input" value="${lbl.navRolesAr||''}"></div>
                <div class="form-group"><label>زرار إدارة المراحل (عربي):</label><input type="text" id="lbl_navStagesAr" class="form-input" value="${lbl.navStagesAr||''}"></div>
                <div class="form-group"><label>زرار الإعدادات (عربي):</label><input type="text" id="lbl_navSettingsAr" class="form-input" value="${lbl.navSettingsAr||''}"></div>
                <div class="form-group"><label>زرار تسجيل الخروج (عربي):</label><input type="text" id="lbl_navSignOutAr" class="form-input" value="${lbl.navSignOutAr||''}"></div>
                <div class="form-group"><label>عنوان الصفحة الرئيسية (عربي):</label><input type="text" id="lbl_homeHeadingAr" class="form-input" value="${lbl.homeHeadingAr||''}"></div>
                <div class="form-group"><label>عنوان الداشبورد الشخصية (عربي):</label><input type="text" id="lbl_dashTitleAr" class="form-input" value="${lbl.dashTitleAr||''}"></div>
            </div>
        </div>

        <button class="btn btn-orange" style="padding:0.7rem 1.5rem; font-size:0.9rem;" onclick="savePortalSettings()">💾 حفظ كافة إعدادات البوابة وأسماء الأزرار في السحابة</button>
    </div>`;
}

function uploadLogoFile(ev, mode) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        if (mode === "light") portalState.settings.logoLight = e.target.result;
        else portalState.settings.logoDark = e.target.result;
        applyThemeAndLogos();
    };
    reader.readAsDataURL(file);
}

async function savePortalSettings() {
    const s = portalState.settings;
    s.brandMain = document.getElementById("setBrandMain").value.trim() || "DCA";
    s.brandAccent = document.getElementById("setBrandAccent").value.trim() || "Portal";
    s.subtitleAr = document.getElementById("setSubAr").value.trim();
    s.subtitleEn = document.getElementById("setSubEn").value.trim();
    s.ejsService = document.getElementById("ejsService").value.trim();
    s.ejsTemplate = document.getElementById("ejsTemplate").value.trim();
    s.ejsKey = document.getElementById("ejsKey").value.trim();

    ["navProfileAr","navInboxAr","navUsersAr","navRolesAr","navStagesAr","navSettingsAr","navSignOutAr","homeHeadingAr","dashTitleAr"].forEach(k => {
        const el = document.getElementById("lbl_" + k);
        if (el && el.value.trim()) s.uiLabels[k] = el.value.trim();
    });

    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/settings.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(s)
    });
    renderAllViews();
    showToast("✅ تم حفظ إعدادات البوابة وتحديث أسماء الأزرار بنجاح!");
}

async function resetAllTopicsPipeline() {
    if (!hasPerm("override_stage") || !confirm("⚠️ هل تريد إعادة ضبط كل نقاط الكورس إلى المرحلة 1؟")) return;
    Object.keys(portalState.pipeline).forEach(k => {
        portalState.pipeline[k].stageIdx = 0;
        portalState.pipeline[k].subStatus = "not-started";
        portalState.pipeline[k].rejected = false;
    });
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/pipeline.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.pipeline)
    });
    renderAllViews();
    showToast("✅ تم تصفير وإعادة ضبط جميع النقاط للمرحلة 1!");
}

// ============================================================================
// 🗂️ إضافة وتعديل وحذف وتحريك أزرار البوابة مع اختيار نوع الأداة من الـ 5 أنظمة
// ============================================================================
async function addPortalNode(type, catId = null, courseId = null) {
    if (!hasPerm("manage_portal_nodes")) return;
    const titleAr = prompt("أدخل اسم الزرار/القسم بالعربية:");
    if (!titleAr) return;
    const descAr = prompt("أدخل الوصف المختصر:") || "";
    const icon = prompt("أدخل الأيقونة (Emoji):", "📁") || "📁";
    const newId = "node_" + Date.now();

    if (type === "CATEGORY") {
        portalState.portalTree.categories.push({ id: newId, icon, titleAr, titleEn: titleAr, descAr, descEn: descAr });
        portalState.portalTree.courses[newId] = [];
    } else if (type === "COURSE") {
        if (!portalState.portalTree.courses[catId]) portalState.portalTree.courses[catId] = [];
        portalState.portalTree.courses[catId].push({ id: newId, icon, titleAr, titleEn: titleAr, descAr, descEn: descAr });
        const structToolId = "tool_struct_" + newId;
        portalState.portalTree.courseTools[newId] = [
            { id: structToolId, type: "STRUCTURE", icon: "🏗️", titleAr: "استركشر وماتريال الكورس", titleEn: "Course Structure", descAr: "خريطة الطريق ونظام المراحل", descEn: "Course structure" },
            { id: "tool_tasks_" + newId, type: "TASKS", icon: "📝", titleAr: "التاسكات والأنشطة العملية", titleEn: "Course Tasks", descAr: "إدارة الأنشطة العملية", descEn: "Tasks" },
            { id: "tool_table_" + newId, type: "TABLE", icon: "📅", titleAr: "الجدول الزمني للكورس", titleEn: "Course Schedule", descAr: "جدول المحاضرات", descEn: "Schedule" },
            { id: "tool_links_" + newId, type: "LINKS", icon: "🔗", titleAr: "أهم اللينكات والقوالب", titleEn: "Important Links", descAr: "روابط وقوالب الكورس", descEn: "Links" }
        ];
        portalState.portalTree.courseStructures[structToolId] = [];
    } else if (type === "TOOL") {
        const chosenType = prompt("اختر نوع المحتوى الذي تريد بناءه داخل هذا الزرار:\n1 = استركشر بمراحل تسليم (STRUCTURE)\n2 = جدول ديناميكي بأعمدة (TABLE)\n3 = لوحة تاسكات وأنشطة (TASKS)\n4 = مكتبة روابط وملفات (LINKS)\n5 = صفحة محتوى حر / سياسات (PAGE)", "3");
        const mapType = { "1": "STRUCTURE", "2": "TABLE", "3": "TASKS", "4": "LINKS", "5": "PAGE" };
        const finalType = mapType[(chosenType||"3").trim()] || "TASKS";
        if (!portalState.portalTree.courseTools[courseId]) portalState.portalTree.courseTools[courseId] = [];
        portalState.portalTree.courseTools[courseId].push({ id: newId, type: finalType, icon, titleAr, titleEn: titleAr, descAr, descEn: descAr });
        if (finalType === "STRUCTURE") portalState.portalTree.courseStructures[newId] = [];
    }
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✅ تم إنشاء الزرار الجديد بنجاح!");
}

async function movePortalNode(type, idx, dir, catId = null, courseId = null) {
    let arr = null;
    if (type === "CATEGORY") arr = portalState.portalTree.categories;
    if (type === "COURSE") arr = portalState.portalTree.courses[catId];
    if (type === "TOOL") arr = portalState.portalTree.courseTools[courseId];
    if (!arr) return;
    const target = idx + dir;
    if (target < 0 || target >= arr.length) return;
    const tmp = arr[idx]; arr[idx] = arr[target]; arr[target] = tmp;
    await savePortalTreeToCloud();
    renderAllViews();
}
async function editPortalNode(type, id1, id2 = null, id3 = null) {
    if (!hasPerm("manage_portal_nodes")) return;
    let target = null;
    if (type === "CATEGORY") target = portalState.portalTree.categories.find(x => x.id === id1);
    if (type === "COURSE") target = (portalState.portalTree.courses[id1] || []).find(x => x.id === id2);
    if (type === "TOOL") target = (portalState.portalTree.courseTools[id2] || []).find(x => x.id === id3);
    if (!target) return;
    const newT = prompt("تعديل الاسم:", target.titleAr);
    if (!newT) return;
    target.titleAr = newT;
    target.titleEn = newT;
    target.descAr = prompt("تعديل الوصف:", target.descAr) || "";
    target.icon = prompt("تعديل الأيقونة:", target.icon) || target.icon;
    await savePortalTreeToCloud();
    renderAllViews();
    showToast("✅ تم تعديل الزرار بنجاح!");
}

async function deletePortalNode(type, id1, id2 = null, id3 = null) {
    if (!hasPerm("manage_portal_nodes") || !confirm("هل أنت متأكد من حذف هذا القسم/الزرار؟")) return;
    if (type === "CATEGORY") portalState.portalTree.categories = portalState.portalTree.categories.filter(x => x.id !== id1);
    if (type === "COURSE") portalState.portalTree.courses[id1] = (portalState.portalTree.courses[id1] || []).filter(x => x.id !== id2);
    if (type === "TOOL") portalState.portalTree.courseTools[id2] = (portalState.portalTree.courseTools[id2] || []).filter(x => x.id !== id3);
    await savePortalTreeToCloud();
    renderAllViews();
}

async function savePortalTreeToCloud() {
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/portalTree.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(portalState.portalTree)
    });
}

// ============================================================================
// 🔔 الإشعارات، المزامنة السحابية، تسجيل الدخول، وتصدير Excel
// ============================================================================
async function sendWorkflowNotification(toUsername, topicCode, msgText, fileLink = "") {
    const fromUser = portalState.currentUser ? portalState.currentUser.displayName : "System";
    const newNotif = {
        id: "ntf_" + Date.now(),
        toUser: toUsername || "admin",
        fromUser: fromUser,
        topicCode: topicCode,
        message: msgText,
        fileLink: fileLink,
        date: new Date().toLocaleString("ar-EG"),
        read: false
    };
    portalState.notifications.unshift(newNotif);
    updateUnreadBadge();

    try {
        await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5/notifications.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(portalState.notifications.slice(0, 150))
        });
    } catch (e) {}
}

function updateUnreadBadge() {
    if (!portalState.currentUser) return;
    const uName = portalState.currentUser.username;
    const unread = portalState.notifications.filter(n => (n.toUser === uName || (uName === "admin" && n.toUser === "admin")) && !n.read).length;
    const badge = document.getElementById("unreadNotifCount");
    const bell = document.getElementById("navBtnInbox");
    if (badge) badge.textContent = unread;
    if (bell) {
        if (unread > 0) bell.classList.add("bell-shake");
        else bell.classList.remove("bell-shake");
    }
    if (unread > lastKnownNotifCount && lastKnownNotifCount !== 0) {
        showToast("🔔 لديك إشعار جديد في صندوق الرسائل!");
    }
    lastKnownNotifCount = unread;
}

async function syncFromCloud(manual = false) {
    try {
        document.getElementById("cloudSyncIndicator").textContent = "⏳ جاري المزامنة...";
        const res = await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) {
                if (data.users) portalState.users = data.users;
                if (data.settings) {
                    const savedUi = Object.assign({}, portalState.settings.uiLabels, data.settings.uiLabels || {});
                    portalState.settings = Object.assign(portalState.settings, data.settings);
                    portalState.settings.uiLabels = savedUi;
                }
                if (data.rolesConfig) portalState.rolesConfig = data.rolesConfig;
                if (data.jobCatalog) portalState.jobCatalog = data.jobCatalog;
                if (data.workflowStages) portalState.workflowStages = data.workflowStages;
                if (data.portalTree) {
                    if (!data.portalTree.courseStructures) {
                        data.portalTree.courseStructures = { "tool_structure": normalizeStructureArray(DEFAULT_COURSE_DATA) };
                    }
                    portalState.portalTree = data.portalTree;
                }
                if (data.pipeline) portalState.pipeline = data.pipeline;
                if (data.notifications) portalState.notifications = data.notifications;
            } else {
                await fetch(`${FIREBASE_BASE_URL}/dca_portal_v5.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        users: portalState.users,
                        settings: portalState.settings,
                        rolesConfig: portalState.rolesConfig,
                        jobCatalog: portalState.jobCatalog,
                        workflowStages: portalState.workflowStages,
                        portalTree: portalState.portalTree,
                        pipeline: portalState.pipeline,
                        notifications: portalState.notifications
                    })
                });
            }
            applyThemeAndLogos();
            const activeTag = document.activeElement?.tagName;
            if (portalState.currentUser && (manual || (activeTag !== "INPUT" && activeTag !== "TEXTAREA" && activeTag !== "SELECT"))) {
                renderAllViews();
            } else if (portalState.currentUser) {
                updateUnreadBadge();
            }
            document.getElementById("cloudSyncIndicator").textContent = "☁️ متصل بالسحابة لحظياً ✓";
            if (manual) showToast("✅ تم تحديث كافة البيانات من السحابة!");
        }
    } catch (e) {
        document.getElementById("cloudSyncIndicator").textContent = "⚠️ تعذر الاتصال بالسحابة";
    }
}

async function handleAuthLogin(ev) {
    ev.preventDefault();
    const u = document.getElementById("authUser").value.trim().toLowerCase();
    const p = document.getElementById("authPass").value.trim();
    const err = document.getElementById("loginErr");
    err.style.display = "none";

    await syncFromCloud(false);

    if (u === MASTER_SUPER_USER && p === MASTER_SUPER_PASS) {
        portalState.currentUser = { username: "admin", displayName: "Super Admin (المدير العام)", email: "", sysRole: "superadmin", jobs: ["writer","proofreader","formatter","template"] };
    } else if (portalState.users[u] && portalState.users[u].pass === p) {
        portalState.currentUser = portalState.users[u];
    } else {
        err.style.display = "block";
        return;
    }

    sessionStorage.setItem(SESSION_KEY, JSON.stringify(portalState.currentUser));
    document.getElementById("loginOverlay").style.display = "none";
    renderAllViews();
    showToast(`مرحباً بك ${portalState.currentUser.displayName}!`);
}

function handleLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    portalState.currentUser = null;
    document.getElementById("loginOverlay").style.display = "flex";
    document.getElementById("authPass").value = "";
}

function exportFullPipelineCSV(toolId = "tool_structure") {
    const structList = getActiveStructureList(toolId);
    const stages = portalState.workflowStages;
    const head = ["كود الوحدة", "كود القسم", "كود النقطة", "عنوان النقطة", "المرحلة الحالية", "مرتجع؟"];
    stages.forEach(s => { head.push(`${s.name} (المسؤول)`, `${s.name} (استحقاق)`, `${s.name} (تاريخ التسليم)`); });
    let rows = [head];

    structList.forEach(mod => {
        (mod.sections || []).forEach(sec => {
            (sec.topics || []).forEach(t => {
                const p = getPipeItemByUid(t.uid);
                const stName = isCompletedTopic(p) ? "مكتمل" : stages[p.stageIdx]?.name;
                const row = [mod.code, sec.code, t.code, t.title, stName, p.rejected ? "نعم" : "لا"];
                stages.forEach((s, idx) => {
                    const sd = p.stageData[idx] || {};
                    row.push(getUserNameDisplay(sd.assignee), sd.dueDate || "", sd.completedAt || "");
                });
                rows.push(row);
            });
        });
    });

    let csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "DCA_Portal_Full_Report.csv";
    a.click();
}

window.onload = async function() {
    applyThemeAndLogos();
    await syncFromCloud(false);
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
        try {
            portalState.currentUser = JSON.parse(saved);
            document.getElementById("loginOverlay").style.display = "none";
            renderAllViews();
        } catch (e) {}
    }
    setInterval(() => { if (portalState.currentUser) syncFromCloud(false); }, 10000);
};
</script>
