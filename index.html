async function saveTopicPipeToCloud(tUid) {
    const k = String(tUid).replace(/\./g, "_");
    const p = getPipeItemByUid(tUid);
    renderAllViews();
    try { await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/pipeline/${k}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }); } catch (e) {}
}

function addTopicHistory(p, actionText) {
    const uDisplay = portalState.currentUser ? portalState.currentUser.displayName : "System";
    p.history.unshift({ time: new Date().toLocaleString("ar-EG"), user: uDisplay, action: actionText });
}

async function setTopicSubStatus(tUid, tCode, statusVal, toolId = "tool_structure") {
    const p = getPipeItemByUid(tUid, toolId);
    const stages = getStagesForTool(toolId);
    p.subStatus = statusVal;
    const curSd = p.stageData[p.stageIdx];
    if (curSd && !curSd.startDate) {
        curSd.startDate = todayDateStr();
        if (!curSd.dueDate) curSd.dueDate = addDaysToDateStr(curSd.startDate, curSd.slaDays);
    }
    addTopicHistory(p, `بدأ العمل في مرحلة (${stages[p.stageIdx]?.name})`);
    showToast("تم تحديث حالة المرحلة إلى: جاري العمل حالياً ⚙️");
    await saveTopicPipeToCloud(tUid);
}

async function handoverToNextStage(tUid, tCode, tTitle, toolId = "tool_structure") {
    const p = getPipeItemByUid(tUid, toolId);
    const stages = getStagesForTool(toolId);
    const curIdx = p.stageIdx;
    const curStg = stages[curIdx], nextStg = stages[curIdx + 1];

    const linkVal = document.getElementById(`act-link-${tUid}`)?.value.trim() || "";
    const noteVal = document.getElementById(`act-note-${tUid}`)?.value.trim() || "";
    const wantEmail = document.getElementById(`act-send-mail-${tUid}`)?.checked;
    if (!linkVal) { alert("⚠️ يرجى وضع رابط ملف العمل أولاً قبل التسليم!"); return; }

    const nowDate = todayDateStr();
    const curSd = p.stageData[curIdx];
    if (!curSd.startDate) curSd.startDate = nowDate;
    curSd.completedAt = nowDate; curSd.link = linkVal; curSd.notes = noteVal;
    p.rejected = false; p.rejectReason = ""; p.subStatus = "not-started";

    if (nextStg) {
        const nextSlaInput = document.getElementById(`act-next-sla-${tUid}`)?.value;
        const nextSd = p.stageData[curIdx + 1];
        if (nextSlaInput) nextSd.slaDays = Number(nextSlaInput);
        nextSd.startDate = nowDate;
        nextSd.dueDate = addDaysToDateStr(nowDate, nextSd.slaDays || nextStg.slaDays);
        p.stageIdx = curIdx + 1;
        addTopicHistory(p, `أتم (${curStg.name}) وسلّم إلى (${nextStg.name}) باستحقاق ${nextSd.dueDate}`);
        await saveTopicPipeToCloud(tUid);
        showToast(`✅ تم تسليم ${tCode} إلى (${nextStg.name})!`);
        await sendWorkflowNotification(nextSd.assignee, tCode, `تم تسليم البند (${tCode} - ${tTitle}) إليك في مرحلة (${nextStg.name}). تاريخ الاستحقاق: ${nextSd.dueDate}`, linkVal, wantEmail && portalState.settings.emailTriggers.onHandover);
    } else {
        p.stageIdx = stages.length;
        addTopicHistory(p, `🏆 أتم المرحلة الأخيرة (${curStg.name}) واعتمد البند نهائياً!`);
        await saveTopicPipeToCloud(tUid);
        showToast(`🏆 تم الاعتماد النهائي للبند ${tCode}!`);
        await sendWorkflowNotification("admin", tCode, `🏆 اكتمل البند (${tCode} - ${tTitle}) في جميع المراحل بنجاح!`, linkVal, wantEmail && portalState.settings.emailTriggers.onComplete);
    }
}

async function rejectBackToPrevStage(tUid, tCode, tTitle, toolId = "tool_structure") {
    const p = getPipeItemByUid(tUid, toolId);
    const stages = getStagesForTool(toolId);
    const curIdx = p.stageIdx;
    if (curIdx <= 0) return;
    const reason = document.getElementById(`act-note-${tUid}`)?.value.trim() || "";
    const wantEmail = document.getElementById(`act-send-mail-${tUid}`)?.checked;
    if (!reason) { alert("⚠️ يرجى كتابة أسباب الرفض والملاحظات في خانة الملاحظات قبل الإرجاع!"); return; }

    const curStg = stages[curIdx], prevStg = stages[curIdx - 1], prevSd = p.stageData[curIdx - 1];
    const nowDate = todayDateStr();
    p.stageIdx = curIdx - 1; p.rejected = true; p.rejectReason = reason; p.subStatus = "in-progress";
    prevSd.startDate = nowDate;
    prevSd.dueDate = addDaysToDateStr(nowDate, prevSd.slaDays || prevStg.slaDays);

    addTopicHistory(p, `❌ رفض الاستلام في (${curStg.name}) وأرجعها إلى (${prevStg.name}). السبب: ${reason}`);
    await saveTopicPipeToCloud(tUid);
    showToast(`⚠️ تم إرجاع ${tCode} إلى (${prevStg.name}) للتعديل.`);
    await sendWorkflowNotification(prevSd.assignee, tCode, `⚠️ تم رفض وإرجاع البند (${tCode} - ${tTitle}) من (${curStg.name}). السبب: ${reason}`, prevSd.link, wantEmail && portalState.settings.emailTriggers.onReject);
}

async function adminForceJumpStage(tUid, tCode, toolId = "tool_structure") {
    if (!hasPerm("override_stage")) return;
    const stages = getStagesForTool(toolId);
    const selVal = Number(document.getElementById(`ovr-sel-${tUid}`).value);
    const p = getPipeItemByUid(tUid, toolId);
    p.stageIdx = selVal; p.rejected = false;
    const stgName = selVal >= stages.length ? "مكتمل نهائياً" : stages[selVal].name;
    addTopicHistory(p, `👑 نقل المدير النقطة مباشرة إلى: (${stgName})`);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم نقل ${tCode} إلى (${stgName})!`);
}

async function adminResetSingleTopic(tUid, tCode, toolId = "tool_structure") {
    if (!hasPerm("override_stage") || !confirm(`تصفير النقطة ${tCode} وإعادتها للمرحلة 1؟`)) return;
    const p = getPipeItemByUid(tUid, toolId);
    p.stageIdx = 0; p.subStatus = "not-started"; p.rejected = false; p.rejectReason = "";
    addTopicHistory(p, `🔄 قام المدير بتصفير النقطة للمرحلة الأولى.`);
    await saveTopicPipeToCloud(tUid);
    showToast(`تم تصفير النقطة ${tCode}!`);
}

async function assignTopicStageUser(tUid, tCode, stageIdx, username, toolId = "tool_structure") {
    if (!hasPerm("assign_tasks")) return;
    const p = getPipeItemByUid(tUid, toolId);
    const stages = getStagesForTool(toolId);

async function updateTopicStageSla(tUid, stageIdx, daysVal, toolId = "tool_structure") {
    const p = getPipeItemByUid(tUid, toolId);
    const sd = p.stageData[stageIdx];

async function bulkAssignSectionStage(toolId, mIdx, sIdx, stageIdx, username) {
    if (!hasPerm("assign_tasks") || !username) return;
    const sec = getActiveStructureList(toolId)[mIdx]?.sections[sIdx];
    if (!sec) return;
    const patchObj = {};
    (sec.topics || []).forEach(t => {
        const p = getPipeItemByUid(t.uid, toolId);
        p.stageData[stageIdx].assignee = username;
        if (stageIdx === 0 && !p.stageData[0].startDate) {
            p.stageData[0].startDate = todayDateStr();
            p.stageData[0].dueDate = addDaysToDateStr(p.stageData[0].startDate, p.stageData[0].slaDays);
        }
        patchObj[String(t.uid).replace(/\./g, "_")] = p;
    });
    renderAllViews();
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/pipeline.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patchObj) });
    showToast(`✅ تم تعيين القسم (${sec.code}) بالكامل للعضو ${getUserNameDisplay(username)}`);
    await sendWorkflowNotification(username, sec.code, `تم تعيينك على جميع نقاط القسم (${sec.code}).`, "", portalState.settings.emailTriggers.onAssign);
}

// ============================================================================
async function dispatchSmartEmail(toEmail, toName, fromName, topicCode, msgText, fileLink = "", customSubject = null, customBody = null) {
    const s = portalState.settings;
    if (!s.emailEnabled || !toEmail) return false;

    const fillVars = (tpl) => (tpl || "")
        .replace(/\{\{to_name\}\}/g, toName || "")
        .replace(/\{\{from_name\}\}/g, fromName || "")
        .replace(/\{\{topic_code\}\}/g, topicCode || "DCA")
        .replace(/\{\{message\}\}/g, msgText || "")
        .replace(/\{\{file_link\}\}/g, fileLink || "لا يوجد مرفق");

    const finalSubject = customSubject || fillVars(s.emailSubjectTpl);
    const finalBody = customBody || fillVars(s.emailBodyTpl);

    // 1. إذا كان مختاراً الربط المفتوح بسيرفر خارجي أو جوجل سكريبت (بلا حدود)
    if (s.emailProviderMode === "CUSTOM_WEBHOOK" && s.customWebhookUrl) {
        try {
            await fetch(s.customWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ to_email: toEmail, to_name: toName, email_subject: finalSubject, email_body: finalBody, topic_code: topicCode, message: msgText, file_link: fileLink })
            });
            showToast(`📧 تم إرسال البريد الرسمي إلى (${toName}) عبر السيرفر المخصص!`);
            return true;
        } catch (e) { console.warn(e); return false; }
    }

    // 2. الإرسال عبر طابور حسابات EmailJS (ينتقل تلقائياً للحساب التالي عند وصول الأول لـ 195 رسالة!)
    const pool = Array.isArray(s.emailAccountsPool) ? s.emailAccountsPool : [];
    const activeAcc = pool.find(acc => acc.serviceId && acc.templateId && acc.publicKey && (acc.sentCount || 0) < (acc.maxLimit || 195)) || pool[0];
    if (!activeAcc || !activeAcc.serviceId) return false;

    try {
        const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                service_id: activeAcc.serviceId,
                template_id: activeAcc.templateId,
                user_id: activeAcc.publicKey,
                template_params: {
                    to_email: toEmail,
                    to_name: toName,
                    from_name: fromName,
                    topic_code: topicCode || "DCA",
                    message: msgText,
                    file_link: fileLink || "https://dca-managment.github.io/DCA/",
                    email_subject: finalSubject,
                    email_body: finalBody
                }
            })
        });
        if (res.ok) {
            activeAcc.sentCount = (activeAcc.sentCount || 0) + 1;
            await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings/emailAccountsPool.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pool) });
            showToast(`📧 تم إرسال إيميل رسمي في الخلفية إلى (${toName})!`);
            return true;
        }
    } catch (e) { console.warn("EmailJS error:", e); }
    return false;
}

async function sendWorkflowNotification(toUsername, topicCode, msgText, fileLink = "", shouldSendEmail = true) {
    const fromUser = portalState.currentUser ? portalState.currentUser.displayName : "DCA System";
    const newNotif = { id: "ntf_" + Date.now(), toUser: toUsername || "admin", fromUser, topicCode, message: msgText, fileLink, date: new Date().toLocaleString("ar-EG"), read: false };
    portalState.notifications.unshift(newNotif);
    updateUnreadBadge();
    try { await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/notifications.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.notifications.slice(0, 200)) }); } catch (e) {}

    if (shouldSendEmail && toUsername) {
        const uObj = portalState.users[toUsername];
        const targetEmail = (toUsername === "admin") ? "mohamed.adel@dca-eg.com" : (uObj?.email || "");
        const targetName = (toUsername === "admin") ? "المدير العام" : (uObj?.displayName || toUsername);
        if (targetEmail) await dispatchSmartEmail(targetEmail, targetName, fromUser, topicCode, msgText, fileLink);
    }
}

function updateUnreadBadge() {
    if (!portalState.currentUser) return;
    const uName = portalState.currentUser.username;
    const unread = portalState.notifications.filter(n => (n.toUser === uName || (uName === "admin" && n.toUser === "admin")) && !n.read).length;
    const badge = document.getElementById("unreadNotifCount");
    const bell = document.getElementById("navBtnInbox");
    if (badge) badge.textContent = unread;
    if (bell) { if (unread > 0) bell.classList.add("bell-shake"); else bell.classList.remove("bell-shake"); }
    if (unread > lastKnownNotifCount && lastKnownNotifCount !== 0) showToast("🔔 لديك إشعار جديد في صندوق الرسائل!");
    lastKnownNotifCount = unread;
}

function handleProfAvatarSelect(ev) {
    const f = ev.target.files[0]; if (!f) return;
    isUploadingOrEditingLock = true;
    const r = new FileReader();
    r.onload = (e) => { profCropTemp.rawAvatar = e.target.result; profCropTemp.avZoom = 100; profCropTemp.avX = 50; profCropTemp.avY = 50; const img = document.getElementById("profLiveAvatarImg"); if (img) img.src = e.target.result; };
    r.readAsDataURL(f);
}

function handleProfCoverSelect(ev) {
    const f = ev.target.files[0]; if (!f) return;
    isUploadingOrEditingLock = true;
    const r = new FileReader();
    r.onload = (e) => {
        profCropTemp.rawCover = e.target.result; profCropTemp.cvZoom = 100; profCropTemp.cvX = 50; profCropTemp.cvY = 50;
        const box = document.getElementById("profCoverBannerBox");
        let img = document.getElementById("profLiveCoverImg");
        if (!img && box) { img = document.createElement("img"); img.id = "profLiveCoverImg"; img.style.cssText = "width:100%;height:100%;object-fit:cover;"; box.prepend(img); }
        if (img) img.src = e.target.result;
    };
    r.readAsDataURL(f);
}

function updateProfAvatarTransform(z, x, y) {
    if (z !== null) profCropTemp.avZoom = Number(z); if (x !== null) profCropTemp.avX = Number(x); if (y !== null) profCropTemp.avY = Number(y);
    const img = document.getElementById("profLiveAvatarImg");
    if (img) { img.style.transform = `scale(${profCropTemp.avZoom/100})`; img.style.objectPosition = `${profCropTemp.avX}% ${profCropTemp.avY}%`; }
}

function updateProfCoverTransform(z, x, y) {
    if (z !== null) profCropTemp.cvZoom = Number(z); if (x !== null) profCropTemp.cvX = Number(x); if (y !== null) profCropTemp.cvY = Number(y);
    const img = document.getElementById("profLiveCoverImg");
    if (img) { img.style.transform = `scale(${profCropTemp.cvZoom/100})`; img.style.objectPosition = `${profCropTemp.cvX}% ${profCropTemp.cvY}%`; }
}

async function saveMyProfileInfo() {
    const uName = portalState.currentUser.username;
    const bakedAv = profCropTemp.rawAvatar.startsWith("data:") ? await bakeCroppedImageToDataUrl(profCropTemp.rawAvatar, profCropTemp.avZoom, profCropTemp.avX, profCropTemp.avY, 260, 260) : profCropTemp.rawAvatar;
    const bakedCv = profCropTemp.rawCover ? await bakeCroppedImageToDataUrl(profCropTemp.rawCover, profCropTemp.cvZoom, profCropTemp.cvX, profCropTemp.cvY, 900, 280) : "";

    const newName = document.getElementById("profNameInput").value.trim();
    const newEmail = document.getElementById("profEmailInput").value.trim();
    const newPhone = document.getElementById("profPhoneInput").value.trim();
    const newBio = document.getElementById("profBioInput").value.trim();

    if (portalState.users[uName]) {
        Object.assign(portalState.users[uName], { displayName: newName || portalState.users[uName].displayName, email: newEmail, phone: newPhone, bio: newBio, avatar: bakedAv, cover: bakedCv });
        await saveUsersListToCloud();
    }
    Object.assign(portalState.currentUser, { displayName: newName || portalState.currentUser.displayName, email: newEmail, avatar: bakedAv, cover: bakedCv });
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(portalState.currentUser));
    isUploadingOrEditingLock = false;
    renderAllViews();
    showToast("✅ تم حفظ صورتك وغلافك وبياناتك الشخصية في السحابة بنجاح!");
}

async function changeMyPassword() {
    const oldP = document.getElementById("oldPassInput").value.trim(), newP = document.getElementById("newPassInput").value.trim();
    if (!oldP || !newP) { alert("⚠️ يرجى كتابة كلمة المرور الحالية والجديدة!"); return; }
    const uName = portalState.currentUser.username;
    if (uName === "admin") { alert("حساب السوبر أدمن الرئيسي محمي بكود النظام."); return; }
    if (portalState.users[uName]?.pass !== oldP) { alert("❌ كلمة المرور الحالية غير صحيحة!"); return; }
    portalState.users[uName].pass = newP;
    await saveUsersListToCloud();
    showToast("✅ تم تحديث كلمة المرور بنجاح!");
}

async function deleteSingleNotification(nId) {

    renderAllViews();

async function clearAllNotificationsInbox() {

    const uName = portalState.currentUser.username;
    if (uName === "admin" || portalState.currentUser.sysRole === "superadmin") portalState.notifications = [];

    renderAllViews();
    showToast("🧹 تم تفريغ صندوق الإشعارات بالكامل!");
}

async function sendCustomStudioEmailNow() {
    const target = document.getElementById("mailToUser").value;
    const ref = document.getElementById("mailRefCode").value.trim() || "DCA";
    const link = document.getElementById("mailFileLink").value.trim();
    const sub = document.getElementById("mailCustomSub").value.trim();
    const body = document.getElementById("mailCustomBody").value.trim();
    if (!sub || !body) { alert("⚠️ يرجى كتابة عنوان ونص الرسالة!"); return; }

    const fromName = portalState.currentUser.displayName;
    const recipients = target === "ALL_TEAM" ? Object.keys(portalState.users) : [target];

    for (let uKey of recipients) {
        const u = portalState.users[uKey];
        if (!u) continue;
        await sendWorkflowNotification(uKey, ref, `${sub} — ${body}`, link, false);
        if (u.email) await dispatchSmartEmail(u.email, u.displayName, fromName, ref, body, link, sub, body);
    }
    showToast("✅ تم إرسال البريد الرسمي والتعميم بنجاح!");
    goBackFromSystemPage();
}

function uploadCustomSoundFile(ev) {
    const f = ev.target.files[0]; if (!f) return;
    isUploadingOrEditingLock = true;
    const r = new FileReader();
    r.onload = async (e) => {
        portalState.settings.customSoundDataUrl = e.target.result;
        portalState.settings.defaultSoundTone = "custom";
        await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.settings) });

    };

function uploadLogoFile(ev, mode) {
    const file = ev.target.files[0]; if (!file) return;
    isUploadingOrEditingLock = true;
    const reader = new FileReader();
    reader.onload = async function(e) {
        if (mode === "light") portalState.settings.logoLight = e.target.result;

        applyThemeAndLogos();
        // حفظ فوري في السحابة لمنع اختفاء اللوجو نهائياً!
        await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.settings) });
        showToast("✅ تم رفع وحفظ اللوجو في السحابة تلقائياً!");
    };
    reader.readAsDataURL(file);
}

function addBackupEmailAccount() {
    openVisualStudioModal({
        modalTitle: "➕ إضافة حساب EmailJS احتياطي للطابور (+200 إيميل شهرياً)",
        titleAr: "حساب احتياطي إضافي",
        showCodeField: true,
        codeVal: "service_xxxxx",
        descLabel: "اكتب في السطر الأول Template ID وفي السطر الثاني Public Key:",
        descAr: "template_xxxxx\nPublic_Key_xxxxx",
        onSave: async (res) => {
            const lines = res.descAr.split(/\r?\n/).map(x => x.trim());
            portalState.settings.emailAccountsPool.push({
                name: res.titleAr, serviceId: res.code, templateId: lines[0] || "", publicKey: lines[1] || "", sentCount: 0, maxLimit: 195
            });
            await savePortalSettings();
        }
    });
}

async function savePortalSettings() {
    const s = portalState.settings;
    if (document.getElementById("setPriColor")) s.primaryColor = document.getElementById("setPriColor").value;
    if (document.getElementById("setAccColor")) s.accentColor = document.getElementById("setAccColor").value;
    if (document.getElementById("setRadius")) s.cardRadius = document.getElementById("setRadius").value.trim() || "12px";
    if (document.getElementById("setFontSize")) s.baseFontSize = document.getElementById("setFontSize").value.trim() || "15px";
    if (document.getElementById("setDefaultTone")) s.defaultSoundTone = document.getElementById("setDefaultTone").value;

    if (document.getElementById("setBrandMain")) s.brandMain = document.getElementById("setBrandMain").value.trim() || "DCA";
    if (document.getElementById("setBrandAccent")) s.brandAccent = document.getElementById("setBrandAccent").value.trim() || "Portal";
    if (document.getElementById("setSubAr")) s.subtitleAr = document.getElementById("setSubAr").value.trim();
    if (document.getElementById("setSubEn")) s.subtitleEn = document.getElementById("setSubEn").value.trim();

    s.userSettingsVisibility = {
        allowSoundChange: document.getElementById("vis_sound")?.checked !== false,
        allowThemeFontChange: document.getElementById("vis_theme")?.checked !== false
    };

    if (document.getElementById("em_enabled")) {
        s.emailEnabled = document.getElementById("em_enabled").checked;
        s.emailProviderMode = document.getElementById("em_providerMode").value;
        s.customWebhookUrl = document.getElementById("em_webhookUrl").value.trim();
        s.emailSubjectTpl = document.getElementById("em_subTpl").value.trim();
        s.emailBodyTpl = document.getElementById("em_bodyTpl").value.trim();
        s.emailTriggers = {
            onHandover: document.getElementById("em_onHandover").checked,
            onReject: document.getElementById("em_onReject").checked,
            onAssign: document.getElementById("em_onAssign").checked,
            onComplete: document.getElementById("em_onComplete").checked
        };
    }

    ["navProfileAr","navInboxAr","navMailAr","navUsersAr","navRolesAr","navStagesAr","navSettingsAr","navSignOutAr","homeHeadingAr"].forEach(k => {
        const el = document.getElementById("lbl_" + k);
        if (el && el.value.trim()) s.uiLabels[k] = el.value.trim();
    });

    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(s) });
    isUploadingOrEditingLock = false;
    renderAllViews();
    showToast("✅ تم حفظ كافة الإعدادات والمظهر والإيميل في السحابة بنجاح!");
}

function downloadFullSystemBackup() {
    const blob = new Blob([JSON.stringify(portalState, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `DCA_Portal_Backup_${todayDateStr()}.json`; a.click();
}

function restoreFullSystemBackup(ev) {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async (e) => {
        try {
            const parsed = JSON.parse(e.target.result);
            await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(parsed) });
            await syncFromCloud(true);
        } catch (err) { alert("❌ ملف نسخة احتياطية غير صالح!"); }
    };
    r.readAsText(f);
}

async function createOrUpdateUser() {

        </div>
        <div class="box-card" style="margin-bottom:1.4rem;">
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0.8rem;">
                <div class="form-group"><label>اسم المرحلة:</label><input type="text" id="stgNameAr" class="form-input" value="${editStg?.name||''}"></div>
                <div class="form-group"><label>الأيقونة:</label><input type="text" id="stgIcon" class="form-input" value="${editStg?.icon||'⚡'}"></div>
                <div class="form-group"><label>الوظيفة المسؤولة:</label><select id="stgJobKey" class="form-input">${portalState.jobCatalog.map(j => `<option value="${j.key}" ${editStg?.jobKey===j.key?'selected':''}>${j.title}</option>`).join("")}</select></div>
                <div class="form-group"><label>الأيام (SLA):</label><input type="number" min="1" id="stgSlaDays" class="form-input" value="${editStg?.slaDays||2}"></div>
            </div>
            <label class="perm-item" style="margin-bottom:0.8rem;"><input type="checkbox" id="stgCanReject" ${(!editStg || editStg.canReject)?'checked':''}><span>صلاحية رفض الاستلام وإرجاع للمرحلة السابقة</span></label>
            <button class="btn btn-orange" onclick="saveWorkflowStage()">💾 حفظ المرحلة</button>
        </div>
        <div class="box-card"><table class="data-table"><thead><tr><th>#</th><th>المرحلة</th><th>الأيام</th><th>الرفض</th><th>تحكم</th></tr></thead><tbody>
            ${portalState.workflowStages.map((s, idx) => `<tr><td>${idx+1}</td><td><strong>${s.icon} ${s.name}</strong></td><td>${s.slaDays} أيام</td><td>${s.canReject?'نعم ✅':'لا'}</td><td><button class="btn btn-orange btn-xs" onclick="editState.editingStageIdx=${idx}; renderAllViews();">✏️ تعديل</button> ${portalState.workflowStages.length>1?`<button class="btn btn-danger btn-xs" onclick="portalState.workflowStages.splice(${idx},1); saveWorkflowStagesList();">🗑️</button>`:''}</td></tr>`).join("")}
        </tbody></table></div>
    </div>`;
}

async function saveWorkflowStage() {
    const idx = editState.editingStageIdx, name = document.getElementById("stgNameAr").value.trim(), icon = document.getElementById("stgIcon").value.trim()||"⚡", jobKey = document.getElementById("stgJobKey").value, slaDays = Number(document.getElementById("stgSlaDays").value||2), canReject = document.getElementById("stgCanReject").checked;
    if (!name) return;
    const obj = { id: "st_" + Date.now(), name, icon, jobKey, slaDays, canReject };
    if (idx >= 0) portalState.workflowStages[idx] = obj; else portalState.workflowStages.push(obj);
    editState.editingStageIdx = -1;
    await saveWorkflowStagesList();
}

async function saveWorkflowStagesList() {
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/workflowStages.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.workflowStages) });
    renderAllViews(); showToast("✅ تم تحديث المراحل!");
}

function renderStructureImportPage(viewport, catId, courseId, toolId) {
    viewport.innerHTML = `
    <div class="full-page-card">
        <div class="full-page-header"><h2>📥 استيراد وتحديث وبناء الاستركشر الذكي (Word & Excel CSV)</h2><button class="btn btn-outline" onclick="navigatePortal('TOOL', '${catId}', '${courseId}', '${toolId}')">⬅️ رجوع للاستركشر</button></div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:1.5rem;">
            <div class="box-card">
                <h3>1️⃣ لصق النص المرقم من ملف Word مباشرة</h3>
                <textarea id="wordRawTextInput" class="form-input" style="min-height:220px;" placeholder="01 عنوان الوحدة\n01.01 عنوان القسم\n01.01.01 عنوان النقطة..."></textarea>
                <div style="display:flex; gap:0.5rem; margin-top:0.8rem;"><button class="btn btn-orange" onclick="parseWordOutlineIntoStructure('${toolId}', false)">➕ دمج وإضافة</button><button class="btn btn-danger" onclick="parseWordOutlineIntoStructure('${toolId}', true)">🔄 استبدال الكل</button></div>
            </div>
            <div class="box-card">
                <h3>2️⃣ التعديل الخارجي عبر ملف Excel (CSV)</h3>
                <button class="btn btn-navy" style="margin-bottom:1rem;" onclick="downloadStructureTemplateCSV('${toolId}')">📥 تنزيل قالب الاستركشر الحالي (Excel CSV)</button>
                <input type="file" accept=".csv" class="form-input" onchange="uploadStructureFromCSV(event, '${toolId}')">
            </div>
        </div>
    </div>`;
}

async function parseWordOutlineIntoStructure(toolId, replaceAll) {
    const raw = document.getElementById("wordRawTextInput").value.trim(); if (!raw) return;
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const list = replaceAll ? [] : getActiveStructureList(toolId);
    let curMod = list[list.length - 1] || null, curSec = (curMod && curMod.sections[curMod.sections.length - 1]) || null;
    lines.forEach(line => {
        let mTop = line.match(/^(\d{1,3}\.\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mTop) {
            if (!curMod) { curMod = { uid: "mod_"+Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            if (!curSec) { curSec = { uid: "sec_"+Date.now(), code: "01.01", title: "القسم الأول", why: "", how: "", topics: [] }; curMod.sections.push(curSec); }
            curSec.topics.push({ uid: mTop[1].replace(/\./g, "_"), code: mTop[1], title: mTop[2], content: "", terms: [], isNew: true }); return;
        }
        let mSec = line.match(/^(\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mSec) {
            if (!curMod) { curMod = { uid: "mod_"+Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            curSec = { uid: "sec_"+mSec[1].replace(/\./g, "_"), code: mSec[1], title: mSec[2], why: "", how: "", topics: [] }; curMod.sections.push(curSec); return;
        }
        let mMod = line.match(/^(\d{1,3})\s+(.+)$/);
        if (mMod) { curMod = { uid: "mod_"+mMod[1], code: mMod[1].padStart(2, "0"), title: mMod[2], overview: "", sections: [] }; list.push(curMod); curSec = null; }
    });
    autoRenumberStructureList(list); portalState.portalTree.courseStructures[toolId] = list;
    await savePortalTreeToCloud(); showToast("✅ تم بناء الاستركشر بنجاح!");
    const { catId, courseId } = portalState.navPath; navigatePortal("TOOL", catId, courseId, toolId);
}

function downloadStructureTemplateCSV(toolId) {
    const list = getActiveStructureList(toolId);
    const rows = [["كود الوحدة", "عنوان الوحدة", "وصف الوحدة", "كود القسم", "عنوان القسم", "هدف القسم", "طريقة عرض القسم", "كود النقطة", "عنوان النقطة", "المحتوى المطلوب", "المصطلحات", "UID"]];
    list.forEach(m => (m.sections||[]).forEach(s => (s.topics||[]).forEach(t => rows.push([m.code, m.title, m.overview||"", s.code, s.title, s.why||"", s.how||"", t.code, t.title, t.content||"", (t.terms||[]).join("|"), t.uid]))));
    let csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })); a.download = `Structure_${toolId}.csv`; a.click();
}

function uploadStructureFromCSV(ev, toolId) {
    const f = ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        const lines = e.target.result.replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean);
        const modMap = new Map(), newList = [];
        for (let i = 1; i < lines.length; i++) {
            const r = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, "").replace(/""/g, '"'));
            if (r.length < 9 || !r[7]) continue;
            const [mCode, mTitle, mOver, sCode, sTitle, sWhy, sHow, tCode, tTitle, tCont, tTerms, tUid] = r;
            if (!modMap.has(mCode)) { const mObj = { uid: "mod_"+mCode, code: mCode, title: mTitle, overview: mOver, sections: [], _sMap: new Map() }; modMap.set(mCode, mObj); newList.push(mObj); }
            const mObj = modMap.get(mCode);
            if (!mObj._sMap.has(sCode)) { const sObj = { uid: "sec_"+sCode.replace(/\./g,"_"), code: sCode, title: sTitle, why: sWhy, how: sHow, topics: [] }; mObj._sMap.set(sCode, sObj); mObj.sections.push(sObj); }
            mObj._sMap.get(sCode).topics.push({ uid: tUid || tCode.replace(/\./g, "_"), code: tCode, title: tTitle, content: tCont||"", terms: (tTerms||"").split("|").filter(Boolean), isNew: false });
        }
        newList.forEach(m => delete m._sMap);
        portalState.portalTree.courseStructures[toolId] = newList;
        await savePortalTreeToCloud(); showToast("✅ تم استيراد ملف الإكسيل بنجاح!");
        const { catId, courseId } = portalState.navPath; navigatePortal("TOOL", catId, courseId, toolId);
    };
    reader.readAsText(f);
}

// ============================================================================
// ☁️ تحريك وحذف أزرار البوابة والمزامنة السحابية الآمنة (بدون مسح الصور أثناء الرفع!)
// ============================================================================
async function movePortalNode(type, idx, dir, catId = null, courseId = null) {
    let arr = (type === "CATEGORY") ? portalState.portalTree.categories : (type === "COURSE" ? portalState.portalTree.courses[catId] : portalState.portalTree.courseTools[courseId]);
    if (!arr) return;
    const t = idx + dir; if (t < 0 || t >= arr.length) return;
    const tmp = arr[idx]; arr[idx] = arr[t]; arr[t] = tmp;
    await savePortalTreeToCloud(); renderAllViews();
}

async function deletePortalNode(type, id1, id2 = null, id3 = null) {
    if (!hasPerm("manage_portal_nodes") || !confirm("هل أنت متأكد من الحذف؟")) return;
    if (type === "CATEGORY") portalState.portalTree.categories = portalState.portalTree.categories.filter(x => x.id !== id1);
    if (type === "COURSE") portalState.portalTree.courses[id1] = (portalState.portalTree.courses[id1] || []).filter(x => x.id !== id2);
    if (type === "TOOL") portalState.portalTree.courseTools[id2] = (portalState.portalTree.courseTools[id2] || []).filter(x => x.id !== id3);
    await savePortalTreeToCloud(); renderAllViews();
}

async function savePortalTreeToCloud() {
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/portalTree.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.portalTree) });
}

async function resetAllTopicsPipeline() {
    if (!hasPerm("override_stage") || !confirm("⚠️ هل تريد تصفير جميع نقاط الكورس إلى المرحلة 1؟")) return;
    Object.keys(portalState.pipeline).forEach(k => { portalState.pipeline[k].stageIdx = 0; portalState.pipeline[k].subStatus = "not-started"; portalState.pipeline[k].rejected = false; });
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/pipeline.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.pipeline) });
    renderAllViews(); showToast("✅ تم تصفير جميع النقاط للمرحلة 1!");
}

async function syncFromCloud(manual = false) {
    // إذا كان المستخدم يرفع صورة أو يعدل في الاستوديو أو الإعدادات، نمنع المزامنة التلقائية من مسح عمله!
    if (isUploadingOrEditingLock && !manual) return;
    try {
        document.getElementById("cloudSyncIndicator").textContent = "⏳ جاري المزامنة...";
        const res = await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) {
                if (data.users) portalState.users = data.users;
                if (data.settings) {
                    const savedUi = Object.assign({}, portalState.settings.uiLabels, data.settings.uiLabels || {});
                    portalState.settings = Object.assign(portalState.settings, data.settings);
                    portalState.settings.uiLabels = savedUi;
                }
                if (data.rolesConfig) portalState.rolesConfig = data.rolesConfig;
                if (data.jobCatalog) portalState.jobCatalog = data.jobCatalog;
                if (data.workflowStages) portalState.workflowStages = data.workflowStages;
                if (data.portalTree) {
                    if (!data.portalTree.courseStructures) data.portalTree.courseStructures = { "tool_structure": normalizeStructureArray(DEFAULT_COURSE_DATA) };
                    portalState.portalTree = data.portalTree;
                }
                if (data.pipeline) portalState.pipeline = data.pipeline;
                if (data.notifications) portalState.notifications = data.notifications;
            } else {
                await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`, {
                    method: "PUT", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ users: portalState.users, settings: portalState.settings, rolesConfig: portalState.rolesConfig, jobCatalog: portalState.jobCatalog, workflowStages: portalState.workflowStages, portalTree: portalState.portalTree, pipeline: portalState.pipeline, notifications: portalState.notifications })
                });
            }
            applyThemeAndLogos();
            const activeTag = document.activeElement?.tagName;
            if (portalState.currentUser && (manual || (activeTag !== "INPUT" && activeTag !== "TEXTAREA" && activeTag !== "SELECT"))) {
                renderAllViews();
            } else if (portalState.currentUser) {
                updateUnreadBadge();
            }
            document.getElementById("cloudSyncIndicator").textContent = "☁️ متصل بالسحابة لحظياً ✓";
            if (manual) showToast("✅ تم تحديث كافة البيانات من السحابة!");
        }
    } catch (e) { document.getElementById("cloudSyncIndicator").textContent = "⚠️ تعذر الاتصال بالسحابة"; }
}

async function handleAuthLogin(ev) {
    ev.preventDefault();
    const u = document.getElementById("authUser").value.trim().toLowerCase(), p = document.getElementById("authPass").value.trim();
    document.getElementById("loginErr").style.display = "none";
    await syncFromCloud(false);

    if (u === MASTER_SUPER_USER && p === MASTER_SUPER_PASS) {
        portalState.currentUser = { username: "admin", displayName: "Super Admin (المدير العام)", email: "mohamed.adel@dca-eg.com", sysRole: "superadmin", jobs: ["writer","proofreader","formatter","template"] };
    } else if (portalState.users[u] && portalState.users[u].pass === p) {
        portalState.currentUser = portalState.users[u];
    } else {
        document.getElementById("loginErr").style.display = "block"; return;
    }
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(portalState.currentUser));
    document.getElementById("loginOverlay").style.display = "none";
    renderAllViews();
    showToast(`مرحباً بك ${portalState.currentUser.displayName}!`);
}

function handleLogout() {
    isUploadingOrEditingLock = false;
    sessionStorage.removeItem(SESSION_KEY);
    portalState.currentUser = null;
    document.getElementById("loginOverlay").style.display = "flex";
    document.getElementById("authPass").value = "";
}

function exportFullPipelineCSV(toolId = "tool_structure") {
    const structList = getActiveStructureList(toolId), stages = getStagesForTool(toolId);
    const head = ["كود الوحدة", "كود القسم", "كود النقطة", "عنوان النقطة", "المرحلة الحالية", "مرتجع؟"];
    stages.forEach(s => head.push(`${s.name} (المسؤول)`, `${s.name} (استحقاق)`, `${s.name} (تاريخ التسليم)`));
    let rows = [head];
    structList.forEach(mod => (mod.sections||[]).forEach(sec => (sec.topics||[]).forEach(t => {
        const p = getPipeItemByUid(t.uid, toolId);
        const row = [mod.code, sec.code, t.code, t.title, isCompletedTopic(p, toolId) ? "مكتمل" : stages[p.stageIdx]?.name, p.rejected ? "نعم" : "لا"];
        stages.forEach((_, idx) => { const sd = p.stageData[idx] || {}; row.push(getUserNameDisplay(sd.assignee), sd.dueDate || "", sd.completedAt || ""); });
        rows.push(row);
    })));
    let csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })); a.download = "DCA_Portal_Report.csv"; a.click();
}

window.onload = async function() {
    applyThemeAndLogos();
    await syncFromCloud(false);
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
        try { portalState.currentUser = JSON.parse(saved); document.getElementById("loginOverlay").style.display = "none"; renderAllViews(); } catch (e) {}
    }
    setInterval(() => { if (portalState.currentUser && !isUploadingOrEditingLock) syncFromCloud(false); }, 10000);
};
