async function updateTopicStageSla(tUid, stageIdx, daysVal, toolId = "tool_structure") {

    const sd = p.stageData[stageIdx];

async function updateTopicStageDue(tUid, stageIdx, dateVal) {

async function bulkAssignSectionStage(toolId, mIdx, sIdx, stageIdx, username) {
    if (!hasPerm("assign_tasks") || !username) return;
    const sec = getActiveStructureList(toolId)[mIdx]?.sections[sIdx];
    if (!sec) return;
    const patchObj = {};
    (sec.topics || []).forEach(t => {
        const p = getPipeItemByUid(t.uid, toolId);
        p.stageData[stageIdx].assignee = username;
        if (stageIdx === 0 && !p.stageData[0].startDate) {
            p.stageData[0].startDate = todayDateStr();
            p.stageData[0].dueDate = addDaysToDateStr(p.stageData[0].startDate, p.stageData[0].slaDays);
        }
        patchObj[String(t.uid).replace(/\./g, "_")] = p;
    });
    renderAllViews();
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/pipeline.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patchObj) });
    showToast(`✅ تم تعيين القسم (${sec.code}) بالكامل للعضو ${getUserNameDisplay(username)}`);
    await sendWorkflowNotification(username, sec.code, `تم تعيينك على جميع نقاط القسم (${sec.code}).`, "", portalState.settings.emailTriggers.onAssign);
}

// 📧 محرك إرسال الإيميلات الذكي (تعدد حسابات EmailJS لتخطي حد الـ 200 + Webhook مفتوح)
// ============================================================================
async function dispatchSmartEmail(toEmail, toName, fromName, topicCode, msgText, fileLink = "", customSubject = null, customBody = null, ccEmails = "", bccEmails = "") {
    const s = portalState.settings;
    if (!s.emailEnabled || !toEmail) return false;

    const fillVars = (tpl) => (tpl || "")
        .replace(/\{\{to_name\}\}/g, toName || "")
        .replace(/\{\{from_name\}\}/g, fromName || "")
        .replace(/\{\{topic_code\}\}/g, topicCode || "DCA")
        .replace(/\{\{message\}\}/g, msgText || "")
        .replace(/\{\{file_link\}\}/g, fileLink || "لا يوجد مرفق");

    const finalSubject = customSubject || fillVars(s.emailSubjectTpl);
    const finalBody = customBody || fillVars(s.emailBodyTpl);

    // 1. إذا كان مختاراً الربط المفتوح بسيرفر خارجي أو جوجل سكريبت (بلا حدود)
    if (s.emailProviderMode === "CUSTOM_WEBHOOK" && s.customWebhookUrl) {
        try {
            await fetch(s.customWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ to_email: toEmail, cc_email: ccEmails, bcc_email: bccEmails, to_name: toName, email_subject: finalSubject, email_body: finalBody, topic_code: topicCode, message: msgText, file_link: fileLink })
            });
            showToast(`📧 تم إرسال البريد الرسمي إلى (${toName}) عبر السيرفر المخصص!`);
            return true;
        } catch (e) { console.warn(e); return false; }
    }

    // 2. الإرسال عبر طابور حسابات EmailJS (ينتقل تلقائياً للحساب التالي عند وصول الأول لـ 195 رسالة!)
    const pool = Array.isArray(s.emailAccountsPool) ? s.emailAccountsPool : [];
    const activeAcc = pool.find(acc => acc.serviceId && acc.templateId && acc.publicKey && (acc.sentCount || 0) < (acc.maxLimit || 195)) || pool[0];
    if (!activeAcc || !activeAcc.serviceId) return false;

    try {
        const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                service_id: activeAcc.serviceId,
                template_id: activeAcc.templateId,
                user_id: activeAcc.publicKey,
                template_params: {
                    to_email: toEmail,
                    cc_email: ccEmails,
                    bcc_email: bccEmails,
                    to_name: toName,
                    from_name: fromName,
                    topic_code: topicCode || "DCA",
                    message: msgText,
                    file_link: fileLink || "https://dca-managment.github.io/DCA/",
                    email_subject: finalSubject,
                    email_body: finalBody
                }
            })
        });
        if (res.ok) {
            activeAcc.sentCount = (activeAcc.sentCount || 0) + 1;
            await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings/emailAccountsPool.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pool) });
            showToast(`📧 تم إرسال إيميل رسمي في الخلفية إلى (${toName})!`);
            return true;
        }
    } catch (e) { console.warn("EmailJS error:", e); }
    return false;
}

async function sendWorkflowNotification(toUsername, topicCode, msgText, fileLink = "", shouldSendEmail = true) {
    const fromUser = portalState.currentUser ? portalState.currentUser.displayName : "DCA System";
    const newNotif = { id: "ntf_" + Date.now(), toUser: toUsername || "admin", fromUser, topicCode, message: msgText, fileLink, date: new Date().toLocaleString("ar-EG"), read: false };
    portalState.notifications.unshift(newNotif);
    updateUnreadBadge();
    try { await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/notifications.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.notifications.slice(0, 200)) }); } catch (e) {}

    if (shouldSendEmail && toUsername) {
        const uObj = portalState.users[toUsername];
        const targetEmail = (toUsername === "admin") ? "mohamed.adel@dca-eg.com" : (uObj?.email || "");
        const targetName = (toUsername === "admin") ? "المدير العام" : (uObj?.displayName || toUsername);
        if (targetEmail) await dispatchSmartEmail(targetEmail, targetName, fromUser, topicCode, msgText, fileLink);
    }
}

function updateUnreadBadge() {
    if (!portalState.currentUser) return;
    const uName = portalState.currentUser.username;
    const unread = portalState.notifications.filter(n => (n.toUser === uName || (uName === "admin" && n.toUser === "admin")) && !n.read).length;
    const badge = document.getElementById("unreadNotifCount");
    const bell = document.getElementById("navBtnInbox");
    if (badge) badge.textContent = unread;
    if (bell) { if (unread > 0) bell.classList.add("bell-shake"); else bell.classList.remove("bell-shake"); }
    if (unread > lastKnownNotifCount && lastKnownNotifCount !== 0) showToast("🔔 لديك إشعار جديد في صندوق الرسائل!");
    lastKnownNotifCount = unread;
}

    const label=document.getElementById("profAvatarSizeValue");if(label)label.textContent=`${size}px`;

async function saveProfileAvatarSize(value){if(!hasPerm("manage_settings"))return;portalState.settings.profileAvatarSizePx=Math.max(76,Math.min(180,Number(value)||105));await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({profileAvatarSizePx:portalState.settings.profileAvatarSizePx})});showToast("✅ تم حفظ حجم الدائرة.");}
function attachProfileCropControls(){
 const bind=(stage,kind)=>{if(!stage||stage.dataset.cropBound)return;stage.dataset.cropBound="1";let drag=null;
 stage.addEventListener("pointerdown",e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:kind==="avatar"?profCropTemp.avX:profCropTemp.cvX,py:kind==="avatar"?profCropTemp.avY:profCropTemp.cvY};stage.setPointerCapture(e.pointerId);e.preventDefault();});
 stage.addEventListener("pointermove",e=>{if(!drag)return;const r=stage.getBoundingClientRect(),dx=(e.clientX-drag.x)/Math.max(1,r.width)*100,dy=(e.clientY-drag.y)/Math.max(1,r.height)*100,x=Math.max(0,Math.min(100,drag.px-dx)),y=Math.max(0,Math.min(100,drag.py-dy));kind==="avatar"?updateProfAvatarTransform(null,x,y):updateProfCoverTransform(null,x,y);});
 const stop=()=>drag=null;stage.addEventListener("pointerup",stop);stage.addEventListener("pointercancel",stop);
 stage.addEventListener("wheel",e=>{e.preventDefault();const z=kind==="avatar"?profCropTemp.avZoom:profCropTemp.cvZoom,n=Math.max(100,Math.min(300,z+(e.deltaY<0?10:-10)));kind==="avatar"?updateProfAvatarTransform(n,null,null):updateProfCoverTransform(n,null,null);},{passive:false});};
 bind(document.getElementById("profAvatarCropStage"),"avatar");bind(document.getElementById("profCoverBannerBox"),"cover");
}
function handleProfAvatarSelect(ev) {

    const r = new FileReader();

}

function handleProfCoverSelect(ev) {
    const f = ev.target.files[0]; if (!f) return;
    isUploadingOrEditingLock = true;
    const r = new FileReader();
    r.onload = (e) => {
        profCropTemp.rawCover = e.target.result; profCropTemp.cvZoom = 100; profCropTemp.cvX = 50; profCropTemp.cvY = 50;

        if (img) img.src = e.target.result;
    };
    r.readAsDataURL(f);
}

function updateProfAvatarTransform(z,x,y){if(z!==null)profCropTemp.avZoom=Math.max(100,Math.min(300,Number(z)));if(x!==null)profCropTemp.avX=Math.max(0,Math.min(100,Number(x)));if(y!==null)profCropTemp.avY=Math.max(0,Math.min(100,Number(y)));const img=document.getElementById("profLiveAvatarImg");if(img){img.style.transform=`scale(${profCropTemp.avZoom/100})`;img.style.objectPosition=`${profCropTemp.avX}% ${profCropTemp.avY}%`;}const c=document.querySelector(".profile-avatar-control");if(c){const r=c.querySelectorAll('input[type="range"]');if(r.length>=3){r[0].value=profCropTemp.avZoom;r[1].value=profCropTemp.avX;r[2].value=profCropTemp.avY;}}}

function updateProfCoverTransform(z, x, y) {
    if (z !== null) profCropTemp.cvZoom = Number(z); if (x !== null) profCropTemp.cvX = Number(x); if (y !== null) profCropTemp.cvY = Number(y);
    const img = document.getElementById("profLiveCoverImg");
    if (img) { img.style.transform = `scale(${profCropTemp.cvZoom/100})`; img.style.objectPosition = `${profCropTemp.cvX}% ${profCropTemp.cvY}%`; }
}

// صفحة مركز الإشعارات مع أزرار المسح المرتبطة بالصلاحية
function renderFullPageInbox(viewport) {
    const uName = portalState.currentUser.username;
    const canDelNotif = hasPerm("delete_notifications");
    const myNotifs = portalState.notifications.filter(n => uName === "admin" || n.toUser === uName || n.fromUser === portalState.currentUser.displayName);
    portalState.notifications.forEach(n => { if (n.toUser === uName) n.read = true; });
    updateUnreadBadge();

    viewport.innerHTML = `
    <div class="full-page-card">
        <div class="full-page-header">
            <h2>🔔 مركز الإشعارات وصندوق الرسائل الداخلية (${myNotifs.length})</h2>
            <div style="display:flex; gap:0.5rem;">
                ${(canDelNotif && myNotifs.length > 0) ? `<button class="btn btn-danger" onclick="clearAllNotificationsInbox()">🧹 مسح وتفريغ صندوق الإشعارات بالكامل</button>` : ''}
                <button class="btn btn-outline" onclick="goBackFromSystemPage()">⬅️ رجوع للصفحة السابقة</button>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:0.7rem;">
            ${myNotifs.length === 0 ? `<p style="text-align:center; padding:2.5rem; color:var(--text-muted);">صندوق الإشعارات فارغ حالياً.</p>` :
            myNotifs.map(n => `
                <div style="background:var(--bg-sec); border:1px solid var(--border-color); border-right:4px solid var(--orange); padding:0.9rem 1.1rem; border-radius:9px; font-size:0.84rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
                    <div>
                        <div style="margin-bottom:0.25rem;"><strong>من: ${n.fromUser} ⬅️ إلى: ${getUserNameDisplay(n.toUser)}</strong> <span style="font-size:0.72rem; color:var(--text-muted); margin-right:0.5rem;">🕒 ${n.date}</span></div>
                        <p>${n.message}</p>
                    </div>
                    <div style="display:flex; gap:0.4rem;">
                        ${n.topicCode ? `<button class="btn btn-orange btn-xs" onclick="jumpToTopic('${n.topicCode}')">فتح البند ${n.topicCode}</button>` : ''}
                        ${n.fileLink ? `<a href="${n.fileLink}" target="_blank" class="btn btn-outline btn-xs">🔗 فتح المرفق</a>` : ''}
                        ${canDelNotif ? `<button class="btn btn-danger btn-xs" onclick="deleteSingleNotification('${n.id}')" title="مسح هذا الإشعار">🗑️</button>` : ''}
                    </div>
                </div>
            `).join("")}
        </div>
    </div>`;
}

async function deleteSingleNotification(nId) {
    if (!hasPerm("delete_notifications")) return;
    portalState.notifications = portalState.notifications.filter(n => n.id !== nId);
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/notifications.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.notifications) });
    renderAllViews();
    showToast("🗑️ تم مسح الإشعار!");
}

async function clearAllNotificationsInbox() {
    if (!hasPerm("delete_notifications") || !await dcaConfirm("هل أنت متأكد من مسح وتفريغ صندوق الإشعارات بالكامل؟")) return;
    const uName = portalState.currentUser.username;
    if (uName === "admin" || portalState.currentUser.sysRole === "superadmin") portalState.notifications = [];
    else portalState.notifications = portalState.notifications.filter(n => n.toUser !== uName);
    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/notifications.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(portalState.notifications) });
    renderAllViews();
    showToast("🧹 تم تفريغ صندوق الإشعارات بالكامل!");
}

function parseEmailList(v){return [...new Set(String(v||"").split(/[;,\s]+/).map(x=>x.trim()).filter(Boolean))];}
function fillMailRecipientEmails(){const target=document.getElementById("mailToUser")?.value,box=document.getElementById("mailToEmails");if(!box)return;if(target==="ALL_TEAM")box.value=Object.values(portalState.users).map(u=>u.email||"").filter(Boolean).join(", ");else if(target&&portalState.users[target]?.email){const a=parseEmailList(box.value);if(!a.includes(portalState.users[target].email))a.push(portalState.users[target].email);box.value=a.join(", ");}}
async function sendCustomStudioEmailNow(){
 const target=document.getElementById("mailToUser").value,to=parseEmailList(document.getElementById("mailToEmails").value),cc=parseEmailList(document.getElementById("mailCcEmails").value),bcc=parseEmailList(document.getElementById("mailBccEmails").value),ref=document.getElementById("mailRefCode").value.trim()||"DCA",link=document.getElementById("mailFileLink").value.trim(),sub=document.getElementById("mailCustomSub").value.trim(),body=document.getElementById("mailCustomBody").value.trim();
 if(!to.length||!sub||!body){alert("⚠️ أدخل مستلمًا واحدًا على الأقل وعنوان الرسالة ونصها.");return;}const valid=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;const bad=[...to,...cc,...bcc].filter(x=>!valid.test(x));if(bad.length){alert(`⚠️ راجع عناوين البريد:\n${bad.join("\n")}`);return;}
 const from=portalState.currentUser.displayName,internal=target==="ALL_TEAM"?Object.keys(portalState.users):(target?[target]:[]);for(const k of internal){const u=portalState.users[k];if(u?.email&&to.includes(u.email))await sendWorkflowNotification(k,ref,`${sub} — ${body}`,link,false);}
 const ok=await dispatchSmartEmail(to.join(", "),to.join(", "),from,ref,body,link,sub,body,cc.join(", "),bcc.join(", "));if(!ok){alert("تعذر إرسال البريد. تحقق من إعداد مزود البريد وقالب EmailJS وحقول To وCC وBCC.");return;}showToast("✅ تم إرسال البريد بنجاح.");goBackFromSystemPage();

async function savePortalSettings() {
    const s = portalState.settings;
    if (document.getElementById("setPriColor")) s.primaryColor = document.getElementById("setPriColor").value;
    if (document.getElementById("setAccColor")) s.accentColor = document.getElementById("setAccColor").value;
    if (document.getElementById("setRadius")) s.cardRadius = document.getElementById("setRadius").value.trim() || "12px";
    if (document.getElementById("setFontSize")) s.baseFontSize = document.getElementById("setFontSize").value.trim() || "15px";
    if (document.getElementById("setDefaultTone")) s.defaultSoundTone = document.getElementById("setDefaultTone").value;

    if (document.getElementById("setBrandMain")) s.brandMain = document.getElementById("setBrandMain").value.trim() || "DCA";
    if (document.getElementById("setBrandAccent")) s.brandAccent = document.getElementById("setBrandAccent").value.trim() || "Portal";
    if (document.getElementById("setSubAr")) s.subtitleAr = document.getElementById("setSubAr").value.trim();
    if (document.getElementById("setSubEn")) s.subtitleEn = document.getElementById("setSubEn").value.trim();

    s.userSettingsVisibility = {
        allowSoundChange: document.getElementById("vis_sound")?.checked !== false,
        allowThemeFontChange: document.getElementById("vis_theme")?.checked !== false
    };

    if (document.getElementById("em_enabled")) {
        s.emailEnabled = document.getElementById("em_enabled").checked;
        s.emailProviderMode = document.getElementById("em_providerMode").value;
        s.customWebhookUrl = document.getElementById("em_webhookUrl").value.trim();
        s.emailSubjectTpl = document.getElementById("em_subTpl").value.trim();
        s.emailBodyTpl = document.getElementById("em_bodyTpl").value.trim();
        s.emailTriggers = {
            onHandover: document.getElementById("em_onHandover").checked,
            onReject: document.getElementById("em_onReject").checked,
            onAssign: document.getElementById("em_onAssign").checked,
            onComplete: document.getElementById("em_onComplete").checked
        };
    }

    ["navProfileAr","navInboxAr","navMailAr","navUsersAr","navRolesAr","navStagesAr","navSettingsAr","navSignOutAr","homeHeadingAr"].forEach(k => {
        const el = document.getElementById("lbl_" + k);
        if (el && el.value.trim()) s.uiLabels[k] = el.value.trim();
    });

    await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6/settings.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(s) });
    isUploadingOrEditingLock = false;
    renderAllViews();
    showToast("✅ تم حفظ كافة الإعدادات والمظهر والإيميل في السحابة بنجاح!");
}

function downloadFullSystemBackup() {
    const blob = new Blob([JSON.stringify(portalState, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `DCA_Portal_Backup_${todayDateStr()}.json`; a.click();
}

function restoreFullSystemBackup(ev) {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async (e) => {
        try {
            const parsed = JSON.parse(e.target.result);
            await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(parsed) });
            await syncFromCloud(true);
        } catch (err) { alert("❌ ملف نسخة احتياطية غير صالح!"); }
    };
    r.readAsText(f);
}

async function parseWordOutlineIntoStructure(toolId, replaceAll) {
    const raw = document.getElementById("wordRawTextInput").value.trim(); if (!raw) return;
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const list = replaceAll ? [] : getActiveStructureList(toolId);
    let curMod = list[list.length - 1] || null, curSec = (curMod && curMod.sections[curMod.sections.length - 1]) || null;
    lines.forEach(line => {
        let mTop = line.match(/^(\d{1,3}\.\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mTop) {
            if (!curMod) { curMod = { uid: "mod_"+Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            if (!curSec) { curSec = { uid: "sec_"+Date.now(), code: "01.01", title: "القسم الأول", why: "", how: "", topics: [] }; curMod.sections.push(curSec); }
            curSec.topics.push({ uid: mTop[1].replace(/\./g, "_"), code: mTop[1], title: mTop[2], content: "", terms: [], isNew: true }); return;
        }
        let mSec = line.match(/^(\d{1,3}\.\d{1,3})\s+(.+)$/);
        if (mSec) {
            if (!curMod) { curMod = { uid: "mod_"+Date.now(), code: "01", title: "الوحدة الأولى", overview: "", sections: [] }; list.push(curMod); }
            curSec = { uid: "sec_"+mSec[1].replace(/\./g, "_"), code: mSec[1], title: mSec[2], why: "", how: "", topics: [] }; curMod.sections.push(curSec); return;
        }
        let mMod = line.match(/^(\d{1,3})\s+(.+)$/);
        if (mMod) { curMod = { uid: "mod_"+mMod[1], code: mMod[1].padStart(2, "0"), title: mMod[2], overview: "", sections: [] }; list.push(curMod); curSec = null; }
    });
    autoRenumberStructureList(list); portalState.portalTree.courseStructures[toolId] = list;
    await savePortalTreeToCloud(); showToast("✅ تم بناء الاستركشر بنجاح!");
    const { catId, courseId } = portalState.navPath; navigatePortal("TOOL", catId, courseId, toolId);
}

function downloadStructureTemplateCSV(toolId) {
    const list = getActiveStructureList(toolId);
    const rows = [["كود الوحدة", "عنوان الوحدة", "وصف الوحدة", "كود القسم", "عنوان القسم", "هدف القسم", "طريقة عرض القسم", "كود النقطة", "عنوان النقطة", "المحتوى المطلوب", "المصطلحات", "UID"]];
    list.forEach(m => (m.sections||[]).forEach(s => (s.topics||[]).forEach(t => rows.push([m.code, m.title, m.overview||"", s.code, s.title, s.why||"", s.how||"", t.code, t.title, t.content||"", (t.terms||[]).join("|"), t.uid]))));
    let csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })); a.download = `Structure_${toolId}.csv`; a.click();
}

function uploadStructureFromCSV(ev, toolId) {
    const f = ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        const lines = e.target.result.replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean);
        const modMap = new Map(), newList = [];
        for (let i = 1; i < lines.length; i++) {
            const r = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, "").replace(/""/g, '"'));
            if (r.length < 9 || !r[7]) continue;
            const [mCode, mTitle, mOver, sCode, sTitle, sWhy, sHow, tCode, tTitle, tCont, tTerms, tUid] = r;
            if (!modMap.has(mCode)) { const mObj = { uid: "mod_"+mCode, code: mCode, title: mTitle, overview: mOver, sections: [], _sMap: new Map() }; modMap.set(mCode, mObj); newList.push(mObj); }
            const mObj = modMap.get(mCode);
            if (!mObj._sMap.has(sCode)) { const sObj = { uid: "sec_"+sCode.replace(/\./g,"_"), code: sCode, title: sTitle, why: sWhy, how: sHow, topics: [] }; mObj._sMap.set(sCode, sObj); mObj.sections.push(sObj); }
            mObj._sMap.get(sCode).topics.push({ uid: tUid || tCode.replace(/\./g, "_"), code: tCode, title: tTitle, content: tCont||"", terms: (tTerms||"").split("|").filter(Boolean), isNew: false });
        }
        newList.forEach(m => delete m._sMap);
        portalState.portalTree.courseStructures[toolId] = newList;
        await savePortalTreeToCloud(); showToast("✅ تم استيراد ملف الإكسيل بنجاح!");
        const { catId, courseId } = portalState.navPath; navigatePortal("TOOL", catId, courseId, toolId);
    };
    reader.readAsText(f);
}

async function movePortalNode(type, idx, dir, catId = null, courseId = null) {
    let arr = (type === "CATEGORY") ? portalState.portalTree.categories : (type === "COURSE" ? portalState.portalTree.courses[catId] : portalState.portalTree.courseTools[courseId]);
    if (!arr) return;
    const t = idx + dir; if (t < 0 || t >= arr.length) return;
    const tmp = arr[idx]; arr[idx] = arr[t]; arr[t] = tmp;
    await savePortalTreeToCloud(); renderAllViews();
}

async function deletePortalNode(type, id1, id2 = null, id3 = null) {
    if (!hasPerm("manage_portal_nodes") || !await dcaConfirm("هل أنت متأكد من الحذف؟")) return;
    if (type === "CATEGORY") portalState.portalTree.categories = portalState.portalTree.categories.filter(x => x.id !== id1);
    if (type === "COURSE") portalState.portalTree.courses[id1] = (portalState.portalTree.courses[id1] || []).filter(x => x.id !== id2);
    if (type === "TOOL") portalState.portalTree.courseTools[id2] = (portalState.portalTree.courseTools[id2] || []).filter(x => x.id !== id3);
    await savePortalTreeToCloud(); renderAllViews();
}

async function syncFromCloud(manual = false) {
    // إذا كان المستخدم يرفع صورة أو يعدل في الاستوديو أو الإعدادات، نمنع المزامنة التلقائية من مسح عمله!
    if (isUploadingOrEditingLock && !manual) return;
    try {
        document.getElementById("cloudSyncIndicator").textContent = "⏳ جاري المزامنة...";
        const res = await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) {
                if (data.users) portalState.users = data.users;
                if (data.settings) {
                    const savedUi = Object.assign({}, portalState.settings.uiLabels, data.settings.uiLabels || {});
                    portalState.settings = Object.assign(portalState.settings, data.settings);
                    portalState.settings.uiLabels = savedUi;
                }
                if (data.rolesConfig) portalState.rolesConfig = data.rolesConfig;
                if (data.jobCatalog) portalState.jobCatalog = data.jobCatalog;
                if (data.workflowStages) portalState.workflowStages = data.workflowStages;
                if (data.portalTree) {
                    if (!data.portalTree.courseStructures) data.portalTree.courseStructures = { "tool_structure": normalizeStructureArray(DEFAULT_COURSE_DATA) };
                    portalState.portalTree = data.portalTree;
                }
                if (data.pipeline) portalState.pipeline = data.pipeline;
                if (data.notifications) portalState.notifications = data.notifications;
            } else {
                await fetch(`${FIREBASE_BASE_URL}/dca_portal_v6.json`, {
                    method: "PUT", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ users: portalState.users, settings: portalState.settings, rolesConfig: portalState.rolesConfig, jobCatalog: portalState.jobCatalog, workflowStages: portalState.workflowStages, portalTree: portalState.portalTree, pipeline: portalState.pipeline, notifications: portalState.notifications })
                });
            }
            applyThemeAndLogos();
            const activeTag = document.activeElement?.tagName;
            if (portalState.currentUser && (manual || (activeTag !== "INPUT" && activeTag !== "TEXTAREA" && activeTag !== "SELECT"))) {
                renderAllViews();
            } else if (portalState.currentUser) {
                updateUnreadBadge();
            }
            document.getElementById("cloudSyncIndicator").textContent = "☁️ متصل بالسحابة لحظياً ✓";
            if (manual) showToast("✅ تم تحديث كافة البيانات من السحابة!");
        }
    } catch (e) { document.getElementById("cloudSyncIndicator").textContent = "⚠️ تعذر الاتصال بالسحابة"; }
}

async function handleAuthLogin(ev) {
    ev.preventDefault();

function handleLogout() {

function exportFullPipelineCSV(toolId = "tool_structure") {

<label class="dsg-f"><span>صورة خلفية (اختياري)</span><input class="form-input" type="file" accept="image/*" onchange="dsg.img(event)"><button class="btn btn-danger btn-xs" type="button" onclick="dsg.set('login','img','')">🗑️ إزالة الصورة</button></label>
${fld('login','overlay','تعتيم الصورة','range','min=0 max=90')}${sel('login','card','شكل البطاقة',[['solid','صلبة'],['glass','زجاجية شفافة']])}${sel('login','layout','التخطيط',[['center','بطاقة في المنتصف'],['split','شاشة منقسمة (شعار + نموذج)']])}
${fld('login','welcome','جملة الترحيب')}${fld('login','tagline','نص الجانب (للتخطيط المنقسم)')}${fld('login','btn','نص زر الدخول')}${fld('login','footer','نص أسفل البطاقة')}</div>

<p class="av-hint">الألوان الأساسية والحواف وحجم الخط تتحكم فيها من إعدادات الصفحة بالأسفل. كل التغييرات هنا تظهر فورًا ولا تُحفظ إلا بزر الحفظ.</p></div>`;}
const NUM={angle:1,overlay:1};
window.dsg={
 set(s,k,v){draft[s][k]=NUM[k]?Number(v):v;applyDesign();},
 img(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.login.img=c.toDataURL('image/jpeg',.72);applyDesign();showToast('✅ تم ضغط الصورة وتطبيقها');};im.src=r.result;};r.readAsDataURL(f);},

 preview(){const ov=$('loginOverlay');ov.style.display='flex';const b=document.createElement('button');b.className='btn btn-orange';b.style.cssText='position:fixed;top:14px;inset-inline-start:14px;z-index:9600';b.textContent='✖ إغلاق المعاينة';b.onclick=()=>{ov.style.display='none';b.remove();};document.body.appendChild(b);},

};

window.renderFullPageSettings=function(v){_rs.apply(this,arguments);if(!hasPerm('manage_settings'))return;const S=portalState.settings;draft={login:{...DL,...S.loginDesign},ui:{...DU,...S.uiDesign}};v.insertAdjacentHTML('afterbegin',panel());};
/* ---------- section tools: PAGE (rich editor) + EMBED (external page) ---------- */
function clean(h){const d=new DOMParser().parseFromString(String(h||''),'text/html');d.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(n=>n.remove());d.body.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{const k=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(k.startsWith('on')||k==='style'||((k==='href'||k==='src')&&!/^(https?:|mailto:|#)/.test(v)))n.removeAttribute(a.name);});if(n.tagName==='A'){n.target='_blank';n.rel='noopener noreferrer';}});return d.body.innerHTML;}
function renderSection(v,catId,courseId,t){
 const can=hasPerm('manage_portal_nodes')||hasPerm('manage_structure'),ci=portalState.portalTree.customItems||(portalState.portalTree.customItems={});
 const pg=t.type==='PAGE',key=(pg?'page_':'embed_')+t.id,d=ci[key]||(ci[key]=pg?{html:''}:{url:'',height:650});
 const head=`<div class="full-page-header"><div><h2>${esc(t.icon)} ${esc(tText(t.titleAr,t.titleEn))}</h2><p style="font-size:.8rem;color:var(--text-muted)">${esc(tText(t.descAr,t.descEn))}</p></div><button class="btn btn-outline" onclick="isUploadingOrEditingLock=false;navigatePortal('COURSE','${catId}','${courseId}')">⬅️ رجوع</button></div>`;
 let body='';
 if(pg){isUploadingOrEditingLock=can;const tb=[['B','bold'],['I','italic'],['U','underline'],['عنوان','formatBlock','h2'],['• قائمة','insertUnorderedList'],['1. قائمة','insertOrderedList'],['🔗','link'],['🧹','removeFormat']];
  body=(can?`<div style="display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem">${tb.map(([l,c,a])=>`<button type="button" class="btn btn-outline btn-xs" onmousedown="event.preventDefault();dsg.cmd('${c}','${a||''}')">${l}</button>`).join('')}<button class="btn btn-orange btn-xs" onclick="dsg.savePage('${t.id}')">💾 حفظ الصفحة</button></div>`:'')+`<div id="pgEd" class="pg-ed" ${can?'contenteditable="true"':''}>${clean(d.html)}</div>`;}
 else{isUploadingOrEditingLock=can;const ok=/^https:\/\//.test(d.url||'');
  body=(can?`<div class="dsg-grid" style="margin-bottom:.8rem"><label class="dsg-f"><span>رابط الصفحة (https)</span><input id="emUrl" class="form-input" style="direction:ltr" value="${esc(d.url)}" placeholder="https://..."></label><label class="dsg-f"><span>الارتفاع (px)</span><input id="emH" type="number" class="form-input" min="300" max="2000" value="${Number(d.height)||650}"></label><button class="btn btn-orange" style="align-self:end" onclick="dsg.saveEmbed('${t.id}')">💾 حفظ</button></div>`:'')+(ok?`<iframe src="${esc(d.url)}" style="width:100%;height:${cl(Number(d.height)||650,300,2000)}px;border:1px solid var(--border-color);border-radius:12px" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer" loading="lazy"></iframe><p class="av-hint">لو الصفحة لا تظهر فالموقع يمنع التضمين. <a href="${esc(d.url)}" target="_blank" rel="noopener">افتحها في تبويب جديد ↗</a></p>`:'<p class="av-hint">لم يتم تحديد رابط بعد.</p>');}
 v.innerHTML=`<div class="full-page-card">${head}${body}</div>`;
}
Object.assign(dsg,{async cmd(c,a){if(c==='link'){const g=getSelection(),rg=g.rangeCount?g.getRangeAt(0).cloneRange():null,u=await dcaPrompt('الرابط (https://...)');g.removeAllRanges();if(rg)g.addRange(rg);if(u&&/^https?:\/\//i.test(u))document.execCommand('createLink',false,u);return;}document.execCommand(c,false,a||null);},
 async savePage(id){portalState.portalTree.customItems['page_'+id]={html:clean($('pgEd').innerHTML)};await savePortalTreeToCloud();showToast('✅ تم حفظ الصفحة');},

const _e=window.renderDynamicToolEngine;
window.renderDynamicToolEngine=function(v,c,co,t){const ci=portalState.portalTree.customItems||{};if(t&&(t.type==='EMBED'||(t.type==='PAGE'&&!(Array.isArray(ci[t.id])&&ci[t.id].length&&!ci['page_'+t.id]))))return renderSection(v,c,co,t);return _e.apply(this,arguments);};

/* ---------- avatar studio: WYSIWYG, 1:1 drag, centered zoom, per-user size/shape ---------- */
let avSize=105,avShape='circle';const RAD={circle:'50%',squircle:'28%',square:'8px'};
function geo(){const st=$('profAvatarCropStage'),im=$('profLiveAvatarImg');if(!st||!im)return null;const W=st.clientWidth,H=st.clientHeight,nw=im.naturalWidth,nh=im.naturalHeight;if(!nw||!W)return null;const sc=Math.max(W/nw,H/nh)*profCropTemp.avZoom/100;return{im,W,H,dw:nw*sc,dh:nh*sc};}
function layoutAv(){const g=geo();if(!g)return;Object.assign(g.im.style,{position:'absolute',maxWidth:'none',width:g.dw+'px',height:g.dh+'px',left:(g.W-g.dw)*profCropTemp.avX/100+'px',top:(g.H-g.dh)*profCropTemp.avY/100+'px',transform:'none',objectFit:'fill',objectPosition:''});
 const r=document.querySelectorAll('.profile-avatar-control input[type=range]');if(r[2]){r[0].value=profCropTemp.avZoom;r[1].value=profCropTemp.avX;r[2].value=profCropTemp.avY;}}
function zoomTo(z){const g=geo();if(!g){profCropTemp.avZoom=cl(z,100,400);return;}const fx=(g.W/2-(g.W-g.dw)*profCropTemp.avX/100)/g.dw,fy=(g.H/2-(g.H-g.dh)*profCropTemp.avY/100)/g.dh;profCropTemp.avZoom=cl(z,100,400);const h=geo(),mx=h.W-h.dw,my=h.H-h.dh;profCropTemp.avX=mx?cl((h.W/2-fx*h.dw)/mx*100,0,100):50;profCropTemp.avY=my?cl((h.H/2-fy*h.dh)/my*100,0,100):50;layoutAv();}
function applySize(){const st=$('profAvatarCropStage');if(!st)return;st.style.width=st.style.height=avSize+'px';st.style.bottom=-Math.round(avSize*.4)+'px';st.style.borderRadius=RAD[avShape]||RAD.circle;const h=document.querySelector('.prof-hero');if(h)h.style.marginBottom=Math.max(56,Math.round(avSize*.4)+16)+'px';if($('avSzVal'))$('avSzVal').textContent=avSize+'px';layoutAv();}
window.updateProfAvatarTransform=function(z,x,y){if(x!==null)profCropTemp.avX=cl(+x,0,100);if(y!==null)profCropTemp.avY=cl(+y,0,100);if(z!==null)zoomTo(+z);else layoutAv();};
function bindAv(st){let d=null;
 st.addEventListener('pointerdown',e=>{if(e.button)return;const g=geo();if(!g)return;d={x:e.clientX,y:e.clientY,ox:(g.W-g.dw)*profCropTemp.avX/100,oy:(g.H-g.dh)*profCropTemp.avY/100};st.setPointerCapture(e.pointerId);st.classList.add('dragging');e.preventDefault();});
 st.addEventListener('pointermove',e=>{if(!d)return;const g=geo(),mx=g.W-g.dw,my=g.H-g.dh;profCropTemp.avX=mx?cl((d.ox+e.clientX-d.x)/mx*100,0,100):50;profCropTemp.avY=my?cl((d.oy+e.clientY-d.y)/my*100,0,100):50;layoutAv();});
 const up=()=>{d=null;st.classList.remove('dragging');};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{e.preventDefault();zoomTo(profCropTemp.avZoom+(e.deltaY<0?8:-8));},{passive:false});
 st.addEventListener('dblclick',()=>{Object.assign(profCropTemp,{avZoom:100,avX:50,avY:50});layoutAv();});
 st.tabIndex=0;st.setAttribute('role','img');st.setAttribute('aria-label','اسحب لتحريك الصورة، عجلة الماوس أو + و - للتقريب');
 st.addEventListener('keydown',e=>{const k={ArrowLeft:[2,0],ArrowRight:[-2,0],ArrowUp:[0,2],ArrowDown:[0,-2]}[e.key];if(k){profCropTemp.avX=cl(profCropTemp.avX+k[0],0,100);profCropTemp.avY=cl(profCropTemp.avY+k[1],0,100);layoutAv();e.preventDefault();}else if(e.key==='+'||e.key==='=')zoomTo(profCropTemp.avZoom+8);else if(e.key==='-')zoomTo(profCropTemp.avZoom-8);});}
function upgradeAvatar(){let st=$('profAvatarCropStage'),bn=$('profCoverBannerBox');if(!st||!bn)return;
 const n=st.cloneNode(true);st.replaceWith(n);st=n;
 const hero=document.createElement('div');hero.className='prof-hero';bn.parentNode.insertBefore(hero,bn);hero.appendChild(bn);hero.appendChild(st);bn.style.marginBottom='0';
 const u=portalState.users[portalState.currentUser.username]||{};avSize=Number(u.avatarSize||portalState.settings.profileAvatarSizePx||105);avShape=u.avatarShape||'circle';
 const old=$('profAvatarSizeControl');if(old&&old.closest('.slider-row'))old.closest('.slider-row').remove();
 const box=document.querySelector('.profile-avatar-control');
 if(box)box.insertAdjacentHTML('beforeend',`<div class="slider-row"><span>📐 حجم الإطار:</span><input type="range" min="64" max="240" value="${avSize}" oninput="dsg.size(this.value)"><strong id="avSzVal">${avSize}px</strong></div><div class="slider-row"><span>⬭ شكل الإطار:</span><select class="form-input" onchange="dsg.shape(this.value)"><option value="circle" ${avShape==='circle'?'selected':''}>دائرة</option><option value="squircle" ${avShape==='squircle'?'selected':''}>مربع ناعم</option><option value="square" ${avShape==='square'?'selected':''}>مربع</option></select></div><p class="av-hint">💡 اسحب الصورة بالماوس داخل الإطار لتحريكها، وعجلة الماوس للتقريب، ودبل كليك للإرجاع.</p>`);
 const im=$('profLiveAvatarImg');if(im)im.onload=layoutAv;bindAv(st);applySize();}
const _rp=window.renderFullPageProfile;
window.renderFullPageProfile=function(){Object.assign(profCropTemp,{avZoom:100,avX:50,avY:50,cvZoom:100,cvX:50,cvY:50});_rp.apply(this,arguments);upgradeAvatar();};
const _ha=window.handleProfAvatarSelect;window.handleProfAvatarSelect=function(){_ha.apply(this,arguments);const im=$('profLiveAvatarImg');if(im)im.onload=layoutAv;};
const _sv=window.saveMyProfileInfo;window.saveMyProfileInfo=async function(){const u=portalState.users[portalState.currentUser.username];if(u){u.avatarSize=avSize;u.avatarShape=avShape;}return _sv.apply(this,arguments);};
/* ---------- login: show/hide password, caps-lock hint, autofill hints, new tool type ---------- */
function enhance(){
 document.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye=1;const w=document.createElement('span');w.className='pw-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='pw-eye';b.textContent='👁';b.setAttribute('aria-label','إظهار أو إخفاء كلمة المرور');b.onclick=()=>{const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';};w.appendChild(b);});
 const p=$('authPass');if(p&&!p.dataset.caps){p.dataset.caps=1;p.autocomplete='current-password';if($('authUser'))$('authUser').autocomplete='username';const h=document.createElement('div');h.className='caps-hint';h.textContent='⚠️ زر Caps Lock مفعّل';p.closest('.form-group').appendChild(h);p.addEventListener('keyup',e=>{h.style.display=e.getModifierState&&e.getModifierState('CapsLock')?'block':'none';});}
 const s=$('st_toolType');if(s&&!s.querySelector('[value=EMBED]'))s.insertAdjacentHTML('beforeend','<option value="EMBED">🌐 تضمين صفحة أو تقرير خارجي (Sheets · Looker · Forms)</option>');
}
let raf;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(enhance);}).observe(document.body,{childList:true,subtree:true});
enhance();applyDesign();
})();

 const back=()=>{if(s.isConnected)s.replaceWith(b);};let done=false;

function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();}
const safeName=n=>String(n||'').trim().slice(0,40).replace(/[.$#\[\]\/]/g,'-');
const rerender=()=>render($('mainViewPort'));
async function save(){const s=portalState.settings;ens();try{const r=await fetch(BASE()+'/settings.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({studio:s.studio,loginDesign:s.loginDesign||{},uiDesign:s.uiDesign||{},cardRadius:s.cardRadius,baseFontSize:s.baseFontSize,primaryColor:s.primaryColor,accentColor:s.accentColor})});if(!r.ok)throw 0;take();dirty=false;state();dcaNotify({type:'success',msg:'تم حفظ التصميم لكل المستخدمين'});}catch(e){dcaAlert('❌ تعذر حفظ التصميم في السحابة. تغييراتك لسه موجودة هنا.');}}
function onClick(e){const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT'&&t.type==='file')return;const a=t.dataset.act,st=ens();
 if(a==='save')save();
 else if(a==='discard'){if(!dirty)return dcaNotify({type:'info',msg:'لا توجد تغييرات لتجاهلها'});revert();rerender();dcaNotify({type:'info',msg:'تم تجاهل التغييرات'});}
 else if(a==='mode'){toggleTheme();rerender();}
 else if(a==='loginprev'){const ov=$('loginOverlay');ov.style.display='flex';const b=document.createElement('button');b.className='btn btn-orange';b.style.cssText='position:fixed;top:14px;inset-inline-start:14px;z-index:9600';b.textContent='✖ إغلاق المعاينة';b.onclick=()=>{ov.style.display='none';b.remove();};document.body.appendChild(b);}
 else if(a==='resetall'){dcaConfirm('سيتم إرجاع كل الألوان والخطوط والأشكال وصفحة الدخول والقاموس وCSS للافتراضي (لحد ما تدوس حفظ). متأكد؟',{danger:true,ok:'رجوع للافتراضي'}).then(ok=>{if(ok){resetDesign(false);mark();rerender();}});}
 else if(a==='creset'){put(t.dataset.p,'');rerender();}
 else if(a==='bpreset'){const b=BUILTIN[+t.dataset.i];applySnap(b.o,{});rerender();}
 else if(a==='mpreset'){applySnap(st.presets[t.dataset.n],{replace:true});rerender();}
 else if(a==='dpreset'){delete st.presets[t.dataset.n];mark();rerender();}
 else if(a==='savepreset'){const n=safeName($('stuPName').value);if(!n)return dcaAlert('⚠️ اكتب اسمًا للقالب');if(Object.keys(st.presets).length>=30&&!st.presets[n])return dcaAlert('⚠️ وصلت للحد الأقصى (30 قالبًا)');st.presets[n]=snapshot(false);mark();rerender();dcaNotify({type:'success',msg:'تم حفظ القالب (اضغط حفظ للجميع لتثبيته)'});}
 else if(a==='export')download('DCA_design_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(snapshot(true),null,1));
 else if(a==='loginimgrm'){put('l.img','');}
 else if(a==='lgtog'||(t.closest&&t.closest('[data-act=lgtog]')&&a!=='lgdel')){const el=t.closest('[data-act=lgtog]');if(!el)return;const id=el.dataset.id,cur=dcaLogin.config().slides.slice(),i=cur.indexOf(id);if(i>=0)cur.splice(i,1);else cur.push(id);put('l.slides',cur);rerender();}
 else if(a==='lgpos'){put('l.artPos',t.dataset.v);rerender();}
 else if(a==='lgclr'){put('l.'+t.dataset.k,'');rerender();}
 else if(a==='lglogorm'){const k=t.dataset.kind;dcaLogin.removeLogo(k).then(ok=>{if(ok){put('l.'+(k==='cardD'?'cardLogoD':k+'Logo'),k==='cardD'?'same':'default');rerender();}});}
 else if(a==='lgdel'){const id=t.dataset.id;dcaConfirm('حذف الصورة من المكتبة نهائيًا؟',{danger:true,ok:'حذف'}).then(async y=>{if(!y)return;if(await dcaLogin.remove(id)){const cur=dcaLogin.config().slides.filter(x=>x!==id);put('l.slides',cur);rerender();}});}
 else if(a==='hbvis'){const id=t.dataset.id,h=st.header.hidden,i=h.indexOf(id);if(t.checked&&i>=0)h.splice(i,1);else if(!t.checked&&i<0)h.push(id);mark();}
 else if(a==='hbup'||a==='hbdn'){const o=effOrder(st),i=o.indexOf(t.dataset.id),j=i+(a==='hbup'?-1:1);if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];st.header.order=o;mark();rerender();}
 else if(a==='dictadd'){if(st.dict.length>=200)return;st.dict.push({from:'',to:''});dirty=true;rerender();}
 else if(a==='dictdel'){st.dict.splice(+t.dataset.i,1);mark();rerender();}}
function onInput(e){const t=e.target;
 if(t.dataset.p){put(t.dataset.p,t.value);const b=document.querySelector(`#dcaStudio b[data-for="${t.dataset.p}"]`);if(b)b.textContent=t.value+(b.textContent.replace(/^[\d.]+/,''));const c=t.closest('.stu-c');if(c&&c.querySelector('code'))c.querySelector('code').textContent=t.value;return;}
 if(t.dataset.di!==undefined){const d=ens().dict[+t.dataset.di];if(d){d[t.dataset.dk]=t.value.slice(0,80);mark();}return;}}
function onChange(e){const t=e.target;
 if(t.dataset.act==='loginimg'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);put('l.img',c.toDataURL('image/jpeg',.72));dcaNotify({type:'success',msg:'تم ضغط الصورة وتطبيقها'});};im.src=r.result;};r.readAsDataURL(f);}
 else if(t.dataset.act==='import'){const f=t.files[0];t.value='';if(!f)return;f.text().then(x=>{let o;try{o=JSON.parse(x);}catch(_){}if(!o||typeof o!=='object'||!o.studio)return dcaAlert('❌ الملف غير صالح كملف تصميم');dcaConfirm('هيتم تطبيق التصميم من الملف (للمعاينة، ومش هيتحفظ إلا بزر الحفظ). متابعة؟',{danger:false,ok:'تطبيق'}).then(ok=>{if(ok){applySnap(o,{replace:true,full:true});rerender();}});});}
 else if(t.dataset.act==='lgupl'){const fs=[...t.files];t.value='';if(!fs.length)return;dcaLogin.upload(fs).then(ids=>{if(ids.length){put('l.slides',dcaLogin.config().slides.concat(ids));dcaNotify({type:'success',msg:'تم رفع '+ids.length+' صورة وإضافتها للمكتبة'});}rerender();});}
 else if(t.dataset.act==='lgss'){put('l.slideshow',t.checked);}
 else if(t.dataset.act==='lgck'){put('l.'+t.dataset.k,t.checked);}
 else if(t.dataset.act==='lglogo'){const f=t.files[0],k=t.dataset.kind;t.value='';if(!f)return;dcaLogin.uploadLogo(k,f).then(ok=>{if(ok){put('l.'+(k==='cardD'?'cardLogoD':k+'Logo'),'custom');dcaNotify({type:'success',msg:'تم رفع اللوجو'});rerender();}});}
 else if(t.dataset.p&&t.tagName==='SELECT')put(t.dataset.p,t.value);}

 if(portalState.currentUser&&n.level==='SYS_PAGE'&&n.sysPage==='DESIGN'){
  if(!hasPerm('manage_settings')){portalState.navPath={level:'HOME',catId:null,courseId:null,toolId:null,sysPage:null,prevNav:null};return _ra.apply(this,arguments);}

 leave();return _ra.apply(this,arguments);};

 if(active&&dirty&&!(nm==='openFullPageSystemView'&&arguments[0]==='DESIGN')){const a=arguments,self=this;dcaConfirm('عندك تغييرات غير محفوظة في استوديو التصميم. تتجاهلها وتخرج؟',{danger:true,ok:'تجاهل وخروج'}).then(ok=>{if(ok){revert();f.apply(self,a);}});return;}
 return f.apply(this,arguments);};});

function compress(file){return new Promise((res,rej)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error('type'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let sc=Math.min(1,1600/Math.max(im.width,im.height)),q=.72,out='';for(let i=0;i<5;i++){const c=document.createElement('canvas');c.width=Math.max(1,im.width*sc);c.height=Math.max(1,im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<520000)break;sc*=.8;q-=.06;}res(out);};im.onerror=()=>rej(new Error('img'));im.src=fr.result;};fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(file);});}

function compressLogo(file){return new Promise((res,rej)=>{if(!/^image\/(jpeg|png|webp|svg\+xml)$/.test(file.type))return rej(new Error('type'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w0=im.naturalWidth||im.width||400,h0=im.naturalHeight||im.height||200,sc=Math.min(1,520/Math.max(w0,h0)||1);if(!isFinite(sc)||sc<=0)sc=1;let out='';for(let i=0;i<5;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*sc));c.height=Math.max(1,Math.round(h0*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/png');if(out.length<260000)break;sc*=.75;}res(out);};im.onerror=()=>rej(new Error('img'));im.src=fr.result;};fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(file);});}

 if(a==='del'){if(w.steps.length<=1)return dcaAlert('⚠️ لازم يفضل مرحلة واحدة على الأقل');const s=w.steps[st.step];if(!await dcaConfirm(`حذف المرحلة "${s.name}"؟`,{danger:true,ok:'حذف'}))return;w.steps.splice(st.step,1);w.steps.forEach(x=>{if(x.rejectTo===s.sid)x.rejectTo='';});st.step=Math.max(0,st.step-1);touch();return paintAll();}
 if(a==='undo')return undo();if(a==='redo')return redo();
 if(a==='new'){const n=await dcaPrompt('اسم القالب الجديد:','');if(!n)return;if(!await guard())return;const t=cleanTpl({name:n,status:'draft',steps:[{name:'كتابة',icon:'✍️',slaDays:2},{name:'مراجعة',icon:'🔍',slaDays:1},{name:'اعتماد',icon:'✅',slaDays:1}]});store()[t.id]=t;await saveStore();load(t.id);return paintAll();}
 if(a==='import')return st.root.querySelector('#wfImp').click();
 if(a==='copy'){const n=cleanTpl(Object.assign({},w,{id:'',name:w.name+' (نسخة)',status:'draft',version:1,steps:w.steps.map(s=>Object.assign({},s,{sid:''}))}));n.steps.forEach((s,i)=>{const o=w.steps[i];if(o&&o.rejectTo){const j=w.steps.findIndex(x=>x.sid===o.rejectTo);if(j>=0&&n.steps[j])s.rejectTo=n.steps[j].sid;}});if(!await guard())return;store()[n.id]=n;await saveStore();load(n.id);return paintAll();}
 if(a==='export'){const blob=new Blob([JSON.stringify({format:'dca-workflow',v:1,template:w},null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='DCA_workflow_'+String(w.name).replace(/[^\w؀-ۿ-]+/g,'_')+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return;}
 if(a==='delete'){const used=toolsUsing(st.sel);if(used.length||Object.values(nodes()).some(n=>n.stagesTpl===st.sel))return dcaAlert('⚠️ القالب مطبّق على أماكن في الشجرة. شيل التطبيق منها الأول (زر "تطبيق على…") ثم احذفه.');if(!await dcaConfirm(`حذف القالب "${w.name}" نهائيًا؟`,{danger:true,ok:'حذف'}))return;delete store()[st.sel];if(await saveStore()){dcaNotify({type:'success',msg:'تم حذف القالب'});load(DEF);paintAll();}return;}
 if(a==='save-draft'||a==='activate'||a==='save'||a==='to-draft')return saveWork(a);
 if(a==='apply'){if(st.dirty&&!await dcaConfirm('احفظ التعديلات أولًا؟ المتابعة هتتجاهلها.',{ok:'متابعة'}))return;return applyDialog(null,st.sel);}}
async function importFile(inp){const f=inp.files[0];inp.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o||o.format!=='dca-workflow'||!o.template)throw 0;const t=cleanTpl(Object.assign({},o.template,{id:'',status:'draft',version:1}));if(!t.steps.length)throw 0;store()[t.id]=t;await saveStore();load(t.id);paintAll();dcaNotify({type:'success',msg:'تم استيراد القالب كمسودة'});}catch(e){dcaAlert('❌ الملف غير صالح كقالب مراحل DCA');}}
async function saveWork(act){const w=st.work;if(!String(w.name).trim())return dcaAlert('⚠️ اكتب اسمًا للقالب');if(!w.steps.length)return dcaAlert('⚠️ أضف مرحلة واحدة على الأقل');
 const clean=cleanTpl(Object.assign({},w,{status:act==='activate'||act==='save'?(st.sel===DEF?'active':'active'):act==='to-draft'?'draft':w.status}));
 if(st.sel===DEF){const tools=toolsUsing(DEF).map(n=>n.id);const ev=evaluate(tools,()=>{const old=portalState.workflowStages;portalState.workflowStages=buildStages(clean).map(s=>{const o=Object.assign({},s);o.id=s.sid;return o;});return()=>{portalState.workflowStages=old;};},true);
  if(ev.pl.total&&!await dcaConfirm(summary(ev.pl)+' متابعة؟',{ok:'حفظ ونقل'})){ev.undo();return;}
  const ok=(await put('workflowStages',portalState.workflowStages))&&await commitPlan(ev.pl,'الافتراضي');if(!ok){ev.undo();return dcaAlert('❌ تعذر الحفظ في السحابة، لم يتغير شيء');}
  dcaNotify({type:'success',msg:'تم حفظ المراحل الافتراضية'});load(DEF);return paintAll();}
 const prev=store()[st.sel],used=toolsUsing(st.sel).map(n=>n.id),wasActive=prev&&prev.status==='active';
 clean.id=st.sel;clean.updated=Date.now();clean.version=wasActive&&clean.status==='active'?(Number(prev.version)||1)+(JSON.stringify(cleanTpl(prev).steps)!==JSON.stringify(clean.steps)?1:0):1;
 const ev=evaluate(used,()=>{const o=store()[st.sel];store()[st.sel]=clean;return()=>{if(o)store()[st.sel]=o;else delete store()[st.sel];};},true);
 if(wasActive&&used.length&&ev.pl.total&&!await dcaConfirm(summary(ev.pl)+' متابعة؟',{ok:'حفظ ونقل'})){ev.undo();return;}
 const ok=(await saveStore())&&await commitPlan(ev.pl,clean.name);if(!ok){ev.undo();return dcaAlert('❌ تعذر الحفظ في السحابة، لم يتغير شيء');}
 dcaNotify({type:'success',msg:act==='activate'?'تم تفعيل القالب':act==='to-draft'?'تم تحويل القالب لمسودة':'تم الحفظ'});load(st.sel);paintAll();}
/* ---------- drag reorder (pointer) ---------- */
function onDown(e){const g=e.target.closest('[data-w=grip]');if(!g||e.button>0)return;e.preventDefault();const el=g.closest('.wf-step'),flow=st.root.querySelector('.wf-flow');if(!el||!flow)return;el.classList.add('dragging');const from=+el.dataset.i;
 const mv=ev=>{const els=(document.elementsFromPoint?document.elementsFromPoint(ev.clientX,ev.clientY):[]).map(x=>x.closest&&x.closest('.wf-step')).filter(x=>x&&x!==el);const tg=els[0];if(tg){const r=tg.getBoundingClientRect(),before=ev.clientX>r.left+r.width/2;const ref=before?tg:tg.nextElementSibling&&tg.nextElementSibling.classList.contains('wf-slot')?tg.nextElementSibling.nextElementSibling:tg.nextSibling;const slotBefore=el.previousElementSibling;if(before){flow.insertBefore(el,tg.previousElementSibling&&tg.previousElementSibling.classList.contains('wf-slot')?tg.previousElementSibling:tg);}else{const nx=tg.nextElementSibling;flow.insertBefore(el,nx&&nx.classList.contains('wf-slot')?nx.nextSibling:nx);}}
  if(ev.clientY<90)window.scrollBy(0,-16);else if(ev.clientY>innerHeight-90)window.scrollBy(0,16);};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);el.classList.remove('dragging');const order=[...flow.querySelectorAll('.wf-step')].map(x=>+x.dataset.i);if(order.some((v,i)=>v!==i)){const cur=st.work.steps,selSid=cur[st.step]&&cur[st.step].sid;st.work.steps=order.map(i=>cur[i]);st.work.steps.forEach((s,i)=>{if(s.rejectTo&&!st.work.steps.slice(0,i).some(x=>x.sid===s.rejectTo))s.rejectTo='';});st.step=Math.max(0,st.work.steps.findIndex(s=>s.sid===selSid));touch();}paintAll();};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);}
/* ---------- apply dialog (tool or folder) ---------- */
function treeOptions(){const out=[];(function w(p,d){Object.values(nodes()).filter(n=>n.parent===p).sort((a,b)=>(a.order??0)-(b.order??0)).forEach(n=>{if(n.type==='FOLDER'||isTool(n)){out.push([n.id,'  '.repeat(d)+(d?'↳ ':'')+(n.icon||'')+' '+(n.titleAr||n.id)+(isTool(n)?' · أداة':'')]);if(n.type==='FOLDER')w(n.id,d+1);}});})('ROOT',0);return out;}
function applyDialog(nodeId,tplId){const N=nodes();const act=Object.values(store()).map(cleanTpl).filter(t=>t&&t.status==='active');const o=document.createElement('div');o.className='dui-ov';
 const sel0=nodeId||'',tp0=tplId&&tplId!==DEF?tplId:(nodeId&&N[nodeId]&&N[nodeId].stagesTpl)||'';
 o.innerHTML=`<div class="dui-box dw-dlg" role="dialog" aria-modal="true" style="max-width:560px;text-align:start"><h4>🎯 تطبيق قالب مراحل</h4><div class="wf-ad"><label>المكان (إدارة أو أداة):</label><select class="form-input" data-a="node"><option value="">— اختر —</option>${treeOptions().map(([i,l])=>`<option value="${esc(i)}" ${i===sel0?'selected':''}>${esc(l)}</option>`).join('')}</select>
 <label>القالب:</label><select class="form-input" data-a="tpl"><option value="">الافتراضي العام (إزالة أي تطبيق)</option>${act.map(t=>`<option value="${esc(t.id)}" ${t.id===tp0?'selected':''}>${esc(t.name)} (v${t.version})</option>`).join('')}</select>
 <div class="wf-pv" data-a="pv">اختر المكان لمعرفة التأثير.</div></div><div class="dui-btns"><button class="btn btn-outline" data-c>إغلاق</button><button class="btn btn-orange" data-o disabled>تطبيق</button></div></div>`;
 const q=s=>o.querySelector(s);let cur=null;
 function mutateFor(nid,tid){const n=nodes()[nid];return()=>{const had=n.stagesTpl,T=portalState.portalTree,cs=T.customToolStages&&T.customToolStages[nid];if(tid)n.stagesTpl=tid;else delete n.stagesTpl;let removed=false;if(isTool(n)&&cs){delete T.customToolStages[nid];removed=true;}return()=>{if(had)n.stagesTpl=had;else delete n.stagesTpl;if(removed)T.customToolStages[nid]=cs;};};}
 function refresh(){const nid=q('[data-a=node]').value,tid=q('[data-a=tpl]').value,pv=q('[data-a=pv]'),ob=q('[data-o]');cur=null;ob.disabled=true;if(!nid||!nodes()[nid]){pv.textContent='اختر المكان لمعرفة التأثير.';return;}
  const tools=toolsUnder(nid).map(n=>n.id),n=nodes()[nid],s=isTool(n)?source(nid):null;const legacy=tools.filter(t=>{const c=portalState.portalTree.customToolStages&&portalState.portalTree.customToolStages[t];return Array.isArray(c)&&c.length;});
  const ev=evaluate(tools,mutateFor(nid,tid),false);cur={nid,tid,tools};ob.disabled=false;
  pv.innerHTML=`<div>${esc(n.titleAr||nid)}: ${s?`المصدر الحالي: <b>${esc(s.name)}</b>`:`${tools.length} أداة مراحل تحتها`}</div><div>${esc(summary(ev.pl))}</div>${legacy.length&&!isTool(n)?`<div class="wf-warn">⚠️ ${legacy.length} أداة تحتها مراحل مخصصة قديمة (النظام القديم) وهتفضل أقوى من القالب لحد ما تطبّق القالب على الأداة نفسها.</div>`:''}${isTool(n)&&legacy.length?'<div class="wf-warn">ℹ️ هتتشال المراحل المخصصة القديمة لهذه الأداة.</div>':''}`;}
 o.onchange=e=>{if(e.target.dataset.a)refresh();};
 o.onclick=async e=>{if(e.target===o||e.target.closest('[data-c]'))return o.remove();if(!e.target.closest('[data-o]')||!cur)return;const{nid,tid,tools}=cur;
  const ev=evaluate(tools,mutateFor(nid,tid),true);const ok=(await put(`portalTree/nodes/${encodeURIComponent(nid)}/stagesTpl`,tid||null,tid?'PUT':'DELETE'))&&(!isTool(nodes()[nid])||await put(`portalTree/customToolStages/${encodeURIComponent(nid)}`,null,'DELETE'))&&await commitPlan(ev.pl,tid?(store()[tid]||{}).name||'قالب':'الافتراضي');
  if(!ok){ev.undo();return dcaAlert('❌ تعذر الحفظ في السحابة، لم يتغير شيء');}
  dcaNotify({type:'success',msg:'تم تطبيق المراحل'});o.remove();renderAllViews();};
 document.body.appendChild(o);refresh();}
window.customizeToolStagesPrompt=function(toolId){applyDialog(toolId,'');};
window.dcaWf={applyDialog,source,toolsUsing,tplFor,buildStages,cleanTpl,store,evaluate,planFor,summary,load:id=>{load(id);},state:()=>st,DEF};
const _ra=window.renderAllViews;window.renderAllViews=function(){if(st.on&&!(portalState.navPath.level==='SYS_PAGE'&&portalState.navPath.sysPage==='STAGES')){st.on=false;lock(false);if(st.dirty){try{dcaNotify({type:'info',msg:'تم تجاهل تعديلات قالب المراحل غير المحفوظة'});}catch(e){}}st.dirty=false;}return _ra.apply(this,arguments);};
document.addEventListener('keydown',e=>{if(!st.on||!(e.ctrlKey||e.metaKey)||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName))return;const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();}});
})();
